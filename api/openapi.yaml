        servidor y `avisos_marcar`). El aviso no lleva columnas de monto, de nombre ni de
        texto libre (D3, D20): el texto sale de un catálogo cerrado en la app y por Firebase
        solo viaja `{v, id}`. `clave` es única por persona (idempotencia). Se borran a los
        90 días. La tabla `avisos_entregas` (qué dispositivo recibió qué) y `avisos_sistema`
        (umbrales) son solo del servidor y la app no las lee.
      x-roles: [dueno, coadministrador]
