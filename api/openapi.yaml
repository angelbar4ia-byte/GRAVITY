    get:
      tags: [Base de datos · Finanzas]
      operationId: leerMovimientos
      summary: Leer movimientos
      description: >-
        Movimientos de los libros que puedes leer; uno entre libros (aportación a un
        compartido) se ve desde los dos. Para el saldo usa `fin_v_saldos`.
        La cuenta maestra ve vacío el libro de otra persona mientras no tenga una consulta
        vigente (`fin_registrar_consulta_maestra`, 30 minutos): no da error, no devuelve filas.
      x-roles: [dueno, coadministrador]
      x-escribe: false
      x-solo-local: true
      x-fase: 1
      parameters:
        - $ref: '#/components/parameters/select'
