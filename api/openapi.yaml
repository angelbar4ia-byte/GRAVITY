openapi: 3.1.0
info:
  title: GRAVITY · APIs del sistema
  version: 0.6.0
  summary: Herramientas de GRAVITY, base de datos, funciones del servidor y puente de casa (D16).
  description: |
    Especificación de las APIs de GRAVITY (decisión D16). Se consulta en la laptop, en
    Ajustes › Desarrollador, solo con rol Dueño. **No se publica en internet.**

    Cada operación declara, con extensiones propias:

    - `x-roles`: roles que la pueden usar (D5): `dueno`, `coadministrador`, `familiar`,
      `cuidador`, `casa`. La verdad de los permisos está en el servidor (RLS).
    - `x-escribe`: `true` si escribe datos; GRAVITY y esta consola piden confirmación antes
      de enviarla. `segun-herramienta` en la operación genérica de herramientas.
    - `x-solo-local`: `true` si su resultado nunca pasa por la IA en la nube (D3: dinero,
      datos clínicos y datos personales). `segun-herramienta` en la operación genérica.
    - `x-fase`: fase del roadmap en que se construye.

    Convenciones (especificación de la Fase 0, sección 4): dinero en centavos (`int`),
    identificadores UUID, fechas `date` y `timestamptz`, semana en lunes, libros solo-agregar.

    Fase 1 (Finanzas, D19): cada quien ve **su** libro y los compartidos de los que es
    miembro (o que son públicos); la **cuenta maestra** es otra persona con su propio login
    y de solo lectura total: lee con una consulta registrada y no escribe nada. Las
    salvaguardas y las respuestas del dueño del 23/oct viven en el servidor, no en el
    cliente (`supabase/migrations/20261023000000_finanzas_salvaguardas.sql` y
    `supabase/migrations/20261024000000_finanzas_respuestas_dueno.sql`). Los ejemplos
    son inventados (el hogar de Ana y Alex de `supabase/seed.sql`, con "Papá (ejemplo)").

    Las llaves (Supabase, Home Assistant) entran por `--dart-define` o archivos ignorados
    por git; nunca se escriben aquí.
  license:
    name: Privado. Uso exclusivo del proyecto Segundo Cerebro; no se publica.
servers:
  - url: https://{proyecto}.supabase.co
    description: Proyecto de Supabase (D7). El identificador real no se guarda en el repositorio.
    variables:
      proyecto:
        default: tu-proyecto
        description: Identificador del proyecto de Supabase.
  - url: http://127.0.0.1:54321
    description: Supabase local para desarrollo (`supabase start`).
security:
  - llavePublica: []
    sesion: []
tags:
  - name: Herramientas de GRAVITY
    description: |
      Lista cerrada de funciones que GRAVITY puede usar (D1). Cada una declara su módulo,
      sus roles, si escribe (pide confirmación) y si es solo local (D3). El registro de la
      app rechaza, al arrancar, una herramienta declarada para un rol que la matriz de
      permisos no deja abrir, leer o escribir su módulo (D5), y una de Finanzas o Cuidados
      que no sea solo local (D3), **también las de navegación**: ni siquiera "se abrió
      Finanzas" llega a la IA en la nube. A la cuidadora solo se le ofrece su bandeja de
      solicitudes (D18: nada de dinero, de la familia ni de conversación libre). Una cuenta
      maestra que no es la dueña es de **solo lectura total** (D19, 23/oct): solo
      navegación y lectura, ninguna herramienta que escriba ni que abra una hoja de
      registro; si el dueño es además la maestra, conserva las suyas para lo propio y no
      recibe lo que administra el hogar. En las Fases 0 y 1 son de navegación y se ejecutan
      dentro de la app; "registrar gasto" solo abre la hoja de registro, que es la
      confirmación (una orden nunca registra dinero sola), y hay que decir el verbo: la
      palabra "gasto" suelta no abre nada. Exponerlas por red para el puente de casa es una
      propuesta de la Fase 6.
  - name: Base de datos
    description: |
      Supabase (PostgREST): `/rest/v1/<tabla>` con los filtros de PostgREST
      (`?id=eq.<uuid>`, `select`, `order`, `limit`). Cada consulta pasa por las reglas
      por registro (RLS) del rol: se lee solo lo que el rol puede ver. Esquema en
      `supabase/migrations/20261020000000_base.sql` (Finanzas, en su propio grupo). La
      bitácora solo se agrega, y lo de Finanzas (acciones `finanzas*` y tablas `fin_*`) lo
      escribe solo el servidor. Lo que la app escribe en ella tiene tope: 4 KB por entrada
      y 500 entradas por persona en 24 horas (54000). Nada de esta base va a la IA.
  - name: Base de datos · Finanzas
    description: |
      Tablas `fin_*`, vistas y funciones de Finanzas (Fase 1, D19), según
      `supabase/migrations/20261021000000_finanzas_mvp1.sql`,
      `supabase/migrations/20261023000000_finanzas_salvaguardas.sql`,
      `supabase/migrations/20261024000000_finanzas_respuestas_dueno.sql` y
      `supabase/README.md` ("Finanzas (Fase 1)"). Solo dueño y coadministrador, cada quien
      **su libro** y los compartidos de los que es miembro, más los compartidos públicos
      (`fin_puede`); familiar, cuidador y Casa no ven nada. La **cuenta maestra** es otra
      persona con su propio login: el dueño la invita con `crear_invitacion` y
      `p_es_maestra`, y queda como coadministrador con la marca de maestra, sin libro
      personal ni membresía en ningún libro. Si no es la dueña es de **solo lectura
      total**: lee con una consulta registrada y toda escritura suya (movimientos,
      configuración del hogar, crear libros) responde 403 (42501). El dueño también puede
      ser la maestra con su propia persona, y en lo suyo sigue escribiendo. Nada de esto va
      a la IA en la nube ni a las bocinas (D3, D6).

      - **Dinero** en centavos (entero); porcentajes y tasas en puntos base (2000 = 20 %);
        semana en lunes; identificadores UUID generados en el dispositivo.
      - **Solo agregar:** `fin_movimientos`, `fin_conciliaciones`, `fin_cierres`,
        `fin_cierre_partidas`, `fin_cierre_abonos` y `fin_importaciones` solo aceptan
        INSERT; un error se corrige con una anulación (contraasiento) o una versión nueva.
      - **Cola sin conexión (idempotente):** se sube con `on_conflict=id` y
        `Prefer: resolution=ignore-duplicates`. El mismo `id` con el mismo contenido no hace
        nada y no falla; con otro contenido, en los libros solo agregar, 409 (23505).
      - **Lo que pone el servidor** (marcado como de solo lectura; no se manda):
        `recibido_en`, `libro_origen_id` y `libro_destino_id` de los movimientos, las
        columnas generadas y `reaperturas`.
      - **Errores** (código de PostgreSQL → HTTP de PostgREST): `23503` falta algo de lo
        que depende (otra cuenta, el original de una anulación; la cola reintenta) → 409;
        `23505` duplicado o mismo `id` con otro contenido → 409; `23514` regla de la tabla
        (monto, motivo, lunes, cascada) → 400; `22023` regla de negocio (combinación de
        cuentas, libro equivocado, papel) → 400; `55000` estado (cuenta no activa, semana
        cerrada) → 500; `42501` sin permiso o columna que no cambia → 403; `54000` límite
        (la bitácora: una entrada de más de 4 KB o más de 500 propias en 24 horas) → 500.
      - **Cuenta maestra y consulta registrada (I2):** sin una consulta vigente, la maestra
        solo ve la **portada**: los libros y quién los lleva (`fin_libros`,
        `fin_libro_miembros`), las categorías, las cuentas de gasto del hogar y lo que no es
        de Finanzas. El contenido de un libro ajeno (cuentas, movimientos, plan, cierres,
        saldos y su bitácora) llega **vacío, sin error**, hasta que llama
        `fin_registrar_consulta_maestra(libro)`, que deja la entrada
        `finanzas.consulta_maestra` y habilita la lectura de ese libro por **30 minutos**
        (por libro y por persona; pasado el tiempo hay que llamarla otra vez, y la app la
        renueva sola mientras el libro está abierto).
      - **Salvaguardas en el servidor** (hallazgos I1 a I5, M6 y M10 de la revisión de
        calidad): (I1) en un libro compartido solo quien lo creó, o el dueño del hogar si es
        miembro, agrega o cambia a otra persona (42501); salirse, o que te saquen, con menos
        de 2 miembros deja el libro privado y activo, y el último miembro no puede salirse
        (22023; ver abajo); (I2) la consulta
        registrada de arriba; (I3) todo movimiento del libro de Papá lleva `en_nombre_de` y
        `motivo` (23514) y las salidas hacia cualquier otro libro dejan la entrada
        `finanzas.salida_libro_representado`; (I4) un albacea es vigente solo si sigue siendo
        adulto con Finanzas, y si no, escribe el suplente; (I5) las acciones `finanzas*` y
        las tablas `fin_*` de la bitácora las escribe solo el servidor (42501 si la app las
        inserta); (M6) la maestra que no es la dueña no escribe nada, tampoco la
        configuración del hogar (42501); (M10) asignar o quitar la maestra deja
        `finanzas.maestra_asignada`.
      - **Libros compartidos (respuestas del dueño del 23/oct):** quien crea el libro
        (`creado_por`) es su administrador: agrega y saca miembros, cambia la `visibilidad`
        y lo archiva. La API no manda ni cambia `creado_por` (42501): solo el servidor, que
        lo pasa al miembro vigente más antiguo si el creador se sale. `visibilidad` solo
        existe en los compartidos: `privada` (por omisión; todo nace privado) o `publica`.
        Privada: leen y escriben sus miembros, y la maestra lee con consulta; el dueño no
        entra a un compartido privado del que no es miembro. Pública: además la **leen**
        (no la escriben) los adultos con Finanzas del hogar. **Salirse** es un `PATCH` a la
        propia fila de `fin_libro_miembros` con `hasta` = ahora (la hora la pone el
        dispositivo), siempre posible. Si quedan menos de 2 miembros vigentes (también cuando
        el administrador saca a alguien) el libro **no se archiva**: el servidor lo deja
        `activo` y `privada`, y el miembro que queda es el administrador (`creado_por`); si
        se va el administrador (o deja de ser adulto con Finanzas del hogar por una baja o un
        cambio de rol, N5), `creado_por` pasa al miembro vigente más antiguo y, con menos de
        2 vigentes, el libro pasa a `privada` (nunca se archiva solo). El
        **último miembro no puede salirse** (400, 22023: si ya no lo usa, lo archiva).
        **Archivar** es solo la decisión del administrador (`activo` = `false`) y nunca
        ocurre solo: un libro archivado se lee y no registra movimientos (403, 42501);
        reactivarlo (`activo` = `true`) no exige 2 miembros, y mientras está archivado solo su
        administrador lo administra.
      - **Cuentas de periodo:** solo las de activo y pasivo piden saldo cero para cerrarse
        o archivarse (22023); las de gasto e ingreso se cierran o archivan con saldo, y en
        ellas se puede anular un movimiento aunque estén archivadas. Archivar una
        categoría archiva su cuenta de gasto (si ninguna otra categoría activa la usa) y
        desarchivarla la reactiva.
      - **Albacea de Papá (N4):** si el cargo de albacea o el de suplente queda vacío (nadie
        vigente que siga siendo adulto con Finanzas), el dueño del hogar lo vuelve a nombrar
        con `fin_nombrar_albacea`. Un INSERT directo en `fin_libro_miembros` sigue sin pasar
        para el dueño (RLS): la función es la única puerta.
      - **Motivo (N2):** el `motivo` de una anulación, un ajuste, un movimiento en nombre
        de otra persona, el del libro de Papá y el de una conciliación con diferencia
        necesita al menos 3 caracteres visibles: no cuentan los espacios, tabuladores,
        saltos de línea, espacios Unicode ni caracteres invisibles (23514). Lo valida un
        trigger al agregar y no un CHECK, así que lo ya guardado nunca se rechaza y un
        reenvío idéntico de la cola no falla. El sentido no se juzga.
      - **Fase 2 (deudas y ahorro, D20):** `fin_deudas` suma `clase` (`tarjeta`, `prestamo`,
        `credito`, `msi`, `familiar`), `acreedor`, `monto_original_centavos`, `cat_pb`,
        `corte_dia` (solo tarjetas), `permite_pago_anticipado` (nulo = verificar con la caja)
        y `extra_reduce`; `fin_parametros` suma `orden_ahorro`, `dependientes_cuidados`,
        `esenciales_incluyen_minimos` y `dias_aviso_deuda`. Tablas nuevas: `fin_msi`,
        `fin_estados_cuenta` y `fin_retiros_ahorro` (estas dos, solo agregar),
        `fin_bolsas_ahorro` y `fin_aportaciones_ahorro`; vistas `fin_v_deuda_resumen`,
        `fin_v_bolsa_saldo` y `fin_v_estados_cuenta_vigentes`. El saldo siempre sale del
        libro: no se guardan saldos. Los checks de las tablas nuevas responden 23514 y
        escribir una aportación en una semana cerrada, 55000.
      - **Funciones internas:** `fin_vigencia_consulta_maestra`, `fin_adulto_con_finanzas` y
        las de los triggers (`fin_libro_miembros_proteger`, `fin_libros_proteger`,
        `fin_libro_miembros_sin_maestra`, `fin_categorias_archivar_cuenta`,
        `bitacora_tope_por_persona`, `fin_motivo_valido`, `fin_motivo_validar`,
        `fin_libro_asegurar_administrador`, `fin_membresia_relevo_administrador`,
        `avisos_insertar`, `avisos_generar_vencimientos`, `avisos_reclamar`…) no son
        llamables desde la API (se les quitó `EXECUTE` a todos los roles); por eso no
        tienen operación aquí. De la migración de endurecimiento, la app solo llama
        `fin_nombrar_albacea`. Sí lo son `fin_solo_lectura` y `fin_puede_salir`, que las
        reglas llaman con el rol de la sesión, y `fin_adultos_con_finanzas` (en plural: la
        que lista a los adultos con Finanzas del hogar; no la confundas con el ayudante
        interno `fin_adulto_con_finanzas`, en singular).
  - name: Base de datos · Hábitos
    description: |
      Tablas `hab_*` y funciones de Hábitos (Fase 3, D13), según
      `supabase/migrations/20261105000000_habitos.sql` y
      `supabase/migrations/20261106000000_habitos_sensibles.sql`. Lo ven y lo escriben solo dueño,
      coadministrador y familiar, y **solo lo propio** (RLS por persona): ni el dueño ve lo del
      familiar. La cuenta maestra, el cuidador y la cuenta Hogar no tienen Hábitos (403 / filas
      vacías). Nada de esto va a la IA en la nube ni a las bocinas (D3, D6, D13).

      - **Dos modos para lo sensible (D13):** `habitos_sensibles` y `diario_oracion` nacen
        `solo_telefono` (nada sale del teléfono). Solo con `habCambiarModo` pasan a
        `nube_cifrada`, y entonces el servidor guarda **solo sobres cifrados** (AES-256-GCM hecho
        en el teléfono, un sobre por día y tipo, id opaco): nunca ve texto claro, ni la hora de
        cada registro, ni la llave maestra, que viaja envuelta con una frase de 12 palabras
        (`hab_llaves`). La tablet personal funciona como el teléfono; la pública nunca recibe
        la llave.
      - **Lo no sensible** (objetivos, bloques, registros, pausas, planes y lecturas de la
        Biblia, marcas, revisiones y ajustes) está en claro. No existe el tipo "eliminar":
        vive en el documento cifrado. No mandes `persona_id`, `hogar_id` ni `actualizado_en`:
        los pone el servidor.
      - **El último cambio gana** por `modificado_en`: un UPDATE con una marca más vieja se
        ignora sin error y una a más de 5 minutos en el futuro se ajusta a la hora del servidor.
      - **Sin bitácora de contenido:** las tablas `hab_*` no tienen trigger de bitácora y el
        prefijo `habitos*` está reservado al servidor (42501 si la app lo escribe). Las
        constancias (`habitos.activar_cifrado`, `habitos.cambiar_modo`,
        `habitos.reiniciar_nube`, `habitos.borrar_datos`) no llevan contenido y solo las ve
        quien las hizo: ni el dueño ni la maestra.
      - **Errores:** `23514` check de la tabla (rangos, días, referencias) → 400; `22023` regla
        de negocio (modo, revisión, cuota, alcance) → 400; `23503` y `23505` como en Finanzas
        → 409; `55000` llave no guardada → 500; `42501` sin Hábitos en el hogar o columna que
        no se manda → 403.
      - Lo de quien se da de baja se conserva sin acceso y se borra a los 90 días
        (`hab_limpiar`, interna).
      - **Funciones internas:** `hab_nota`, `hab_exigir_activa`, `hab_borrar_datos_de`,
        `hab_limpiar`, `hab_propio`, `hab_iniciar_persona`, `hab_iniciar` y `hab_miembro_activo`
        no son llamables desde la API; sí `hab_activa` y `hab_hogar_de`, que usan las reglas.
  - name: Base de datos · Cuidados
    description: |
      Tablas `cui_*` y funciones de Cuidados (Fase 5), según `supabase/migrations/20261113000000_cuidados_avisos.sql`,
      `20261114000000_cuidados_esquema.sql`, `20261115000000_cuidados_operaciones.sql`,
      `20261116000000_cuidados_matriz.sql`, `supabase/README.md` ("Cuidados (Fase 5)") y
      `docs/specs/fase-5-cuidados.md`. **Los permisos los decide el servidor** (`cui_puede`, RLS), no la pantalla:
      el perfil de cada quien (`cuiPerfil`) sale de su rol y de sus turnos. Dueño: todo. Pareja
      (coadministrador): turnos y resumen del día de Papá; medicamentos, tomas y comidas solo en lectura y solo
      con su consentimiento; nunca la bitácora de cuidados. Cuidadora: lee lo clínico, marca tomas **a la hora de
      su turno**, registra comidas en sus días, escribe bitácora y entregas. Hermana: lee, escribe bitácora y
      entregas, y ve el resumen mensual solo si el albacea la autorizó. Un cuidador o familiar **sin turnos** no
      tiene acceso, y una baja corta el acceso al instante. Casa (tablet y bocinas), la cuenta maestra y otros
      hogares no ven nada. **Los medicamentos, las comidas y la bitácora son datos clínicos: nunca a la IA en la
      nube, a las bocinas ni a la tablet pública** (D3, D6); los avisos no llevan texto.

      - **Solo agregar:** `cui_comidas`, `cui_bitacora` y `cui_entregas` (sin PATCH ni DELETE). Los gastos, los
        cambios urgentes y las tomas solo cambian por sus funciones; `cui_consentimientos` y
        `cui_autorizacion_resumen` no se escriben directo.
      - **Lo que pone el servidor** (de solo lectura; no se manda): `persona_id`, `registrada_por`, `de_persona`,
        `estado`, `confirmado_en` y los campos `*_en` (sin permiso de columna, 42501).
      - **Tope:** 300 registros propios en 24 horas por tabla (54000).
      - **Errores:** `23514` regla de la tabla (rango, largo, monto) → 400; `22023` dato inválido → 400; `23505`
        duplicado → 409; `55000` gasto ya resuelto → 500; `42501` sin permiso → 403; `54000` tope → 500.
      - **Ayudantes sin operación** (los usan las reglas): `cui_en_circulo` y `cui_puede_comida`.
  - name: Funciones del servidor
    description: |
      Funciones de Supabase (`/functions/v1/<nombre>`). En la Fase 6, el intermediario de la
      IA, que guarda la clave de la API en el servidor (nunca en la app). Los avisos (Fase 2)
      no son una operación de la app: `pg_cron` programa los vencimientos y la Edge Function
      `enviar-avisos` los manda por FCM con la clave de servicio, con un mensaje solo de datos
      `{v, id}`; las funciones `avisos_reclamar`, `avisos_registrar_entrega` y
      `avisos_resultado_envio` son solo de `service_role`. La app lee `avisos` y se apoya en
      `avisosMarcar`, `finEmitirAviso` y `registrarDispositivoRpc`.
  - name: Puente de casa
    description: |
      Home Assistant en la red de la casa (D9), Fase 6. Usa la cuenta de rol Casa: nunca
      alcanza dinero ni datos clínicos, y las bocinas solo dicen frases genéricas (D3, D6).
      Solo en la red local; nunca se abren puertos del router.

paths:
  # ---------------------------------------------------------------------------
  # Herramientas de GRAVITY (Fase 0: navegación)
  # ---------------------------------------------------------------------------
  /herramientas:
    servers: &servidorHerramientas
      - url: http://127.0.0.1:{puerto}
        description: >-
          Propuesta para la Fase 6: GRAVITY en la laptop atiende las herramientas para el
          puente de casa. En la Fase 0 se ejecutan dentro de la app, sin red.
        variables:
          puerto:
            default: '8787'
    get:
      tags: [Herramientas de GRAVITY]
      operationId: listarHerramientas
      summary: Herramientas disponibles para la sesión
      description: >-
        Lista las herramientas que el rol de la sesión puede usar con los módulos activos.
        Lo que no está en la lista no existe para GRAVITY. Es lo único que ve la IA para
        elegir qué hacer. A la cuidadora solo le llega su bandeja de solicitudes (D18); a
        una cuenta maestra que no es la dueña, solo navegación y lectura: ninguna que
        escriba ni abra una hoja de registro (D19).
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: false
      x-solo-local: false
      x-fase: 0
      responses:
        '200':
          description: Herramientas del rol.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Herramienta'
              example:
                - nombre: habitos.abrir
                  descripcion: Abre Hábitos.
                  modulo: habitos
                  roles: [dueno, coadministrador, familiar]
                  escribe: false
                  solo_local: false
                  accion: leer
                  pertenencia: propia
                  ambito: general
                  hoja: null
                - nombre: finanzas.registrar_gasto
                  descripcion: >-
                    Abre la hoja para registrar un gasto. No guarda nada: la persona
                    captura y confirma en la hoja.
                  modulo: finanzas
                  roles: [dueno, coadministrador]
                  escribe: false
                  solo_local: true
                  accion: escribir
                  pertenencia: propia
                  ambito: general
                  hoja: gasto
        '401':
          $ref: '#/components/responses/SinSesion'
  /herramientas/{nombre}:
    servers: *servidorHerramientas
    post:
      tags: [Herramientas de GRAVITY]
      operationId: ejecutarHerramienta
      summary: Ejecutar una herramienta
      description: >-
        Ejecuta la herramienta si el rol la tiene y su módulo está activo; si no, responde
        404 con el mismo mensaje en todos los casos. Si escribe y no viene
        `confirmado: true`, no ejecuta nada y responde `requiere_confirmacion` con el texto
        de la tarjeta de confirmación. Si es solo local, `para_ia` siempre es nulo y, si
        falla, el error no lleva el mensaje original (podría llevar cifras).
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: segun-herramienta
      x-solo-local: segun-herramienta
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/nombreHerramienta'
      requestBody:
