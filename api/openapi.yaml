  /rest/v1/rpc/avisos_actualizar_preferencias:
    post:
      tags: [Base de datos]
      operationId: avisosActualizarPreferencias
      summary: Cambiar mis preferencias de avisos
      description: >-
        La persona cambia SUS preferencias; los parámetros omitidos o nulos no cambian.
        Valida rangos: tope de 0 a 10, zona horaria real, día del recordatorio de 1 (lunes)
        a 7 (domingo) y tipos del catálogo (400, 22023). Sin preferencias (la cuenta maestra
        que no es la dueña, familiar, cuidador, Casa): 403 (42501).
      x-roles: [dueno, coadministrador]
      x-escribe: true
      x-solo-local: true
