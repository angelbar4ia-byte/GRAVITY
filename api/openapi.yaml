    post:
      tags: [Base de datos]
      operationId: agregarABitacora
      summary: Agregar a la bitácora
      description: >-
        Cualquier miembro agrega a su nombre (p. ej. acciones de GRAVITY en la laptop, D8).
        No se edita ni se borra: se corrige con una entrada nueva. `accion` es un
        identificador en minúsculas (`^[a-z][a-z0-9_.]*$`, hasta 60 caracteres), p. ej.
        `entrega_de_turno` o `gravity.abrir`; si no cumple, responde 400 (código 23514).
        Hay entradas reservadas al servidor, **para todo rol de la app**, y responden 403
        (código 42501): las acciones `insertar`, `actualizar` y `borrar` (las de los
        triggers que registran los cambios de las tablas), cualquier acción que empiece por
        `finanzas` (p. ej. `finanzas.consulta_maestra`, `finanzas.maestra_asignada` y
        `finanzas.salida_libro_representado`) y cualquier entrada cuya `tabla` sea `fin_*`
        (con o sin `public.`). Esas las escriben solo los triggers y las funciones del
        servidor: así nadie fabrica un cambio automático, una consulta de la cuenta maestra
        ni un aviso de Finanzas (I5). Lo mismo con las acciones que empiezan por `habitos` y las
        tablas `hab_*`: son constancias sin contenido del servidor que solo ve quien las hizo. Lo que la app escribe aquí tiene tope (N1): el
        `detalle` de una entrada pesa a lo más 4 KB y cada persona agrega a lo más 500
        entradas propias en 24 horas (cuentan las que escribe la app: no las automáticas ni
        las de Finanzas); al excederlo responde 500 con el código 54000 y la sentencia
        entera se deshace (no se guarda ninguna de sus entradas). No es un error que se
        reintente: la cola lo deja en "requiere atención". No limita a los triggers ni a las
        funciones del servidor, y vale igual para familiar, cuidador y la cuenta Hogar.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/preferir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                hogar_id:
                  $ref: '#/components/schemas/Uuid'
                accion:
                  type: string
                  minLength: 1
                  maxLength: 60
                  pattern: '^[a-z][a-z0-9_.]*$'
                  not:
                    anyOf:
                      - enum: [insertar, actualizar, borrar]
                      - pattern: '^finanzas'
                      - pattern: '^habitos'
                  description: >-
                    Identificador en minúsculas (letras, dígitos, `_` y `.`). `insertar`,
                    `actualizar` y `borrar`, y toda acción que empiece por `finanzas` o `habitos`,
                    están reservadas al servidor (403, código 42501).
                  examples: [entrega_de_turno, gravity.abrir]
                tabla:
                  type: string
                  maxLength: 63
                  not:
                    pattern: '^\s*(public\.)?([fF][iI][nN]|[hH][aA][bB])_'
                  description: Las tablas `fin_*` y `hab_*` están reservadas al servidor (403, código 42501).
                registro_id:
                  type: string
                  maxLength: 200
                detalle:
                  type: object
                  description: Hasta 4 KB en texto; si pesa más, 54000 (N1).
                ocurrido_en:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Agregada.
        '400':
          description: >-
            `accion` no cumple el formato `^[a-z][a-z0-9_.]*$` o pasa de 60 caracteres
            (restricción del servidor, código 23514).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPostgrest'
              example:
                code: '23514'
                message: >-
                  new row for relation "bitacora" violates check constraint
                  "bitacora_accion_check"
                details: null
                hint: null
        '403':
          description: >-
            Las reglas del servidor no lo permiten: la acción es `insertar`, `actualizar`
            o `borrar` (reservadas a los triggers) o empieza por `finanzas`, la tabla es
            `fin_*` (también reservadas al servidor, I5), la entrada va a nombre de otra
            persona, el hogar no es tuyo o `ocurrido_en` pasa de 10 minutos en el futuro
            (código 42501).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPostgrest'
              example:
                code: '42501'
                message: new row violates row-level security policy for table "bitacora"
                details: null
                hint: null
        '500':
          description: >-
            Pasó el tope de la bitácora (N1, código 54000, `program_limit_exceeded`): una
            entrada con un `detalle` de más de 4 KB, o más de 500 entradas propias en 24
            horas. La sentencia entera se deshace. No es de las clases que la cola reintenta:
            lo rechazado queda en "requiere atención".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPostgrest'
              example:
                code: '54000'
                message: 'Demasiadas entradas en la bitácora: el tope es de 500 por persona en 24 horas.'
                details: null
                hint: Inténtalo de nuevo mañana; si es un error de la app, avísale a quien la mantiene.

