            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaIa'
        '401':
          $ref: '#/components/responses/SinSesion'

  # ---------------------------------------------------------------------------
  # Puente de casa: Home Assistant en la red local (Fase 6)
  # ---------------------------------------------------------------------------
  /api/services/tts/speak:
    servers: &servidorPuente
      - url: http://{equipo}:8123
        description: Home Assistant en la red de la casa (D9). Nunca expuesto a internet.
        variables:
          equipo:
            default: homeassistant.local
    post:
      tags: [Puente de casa]
      operationId: decirEnBocina
      summary: Decir una frase en una bocina
      description: >-
        Propuesta. La voz de GRAVITY en una bocina (D6). Solo frases genéricas: nunca dinero
        ni datos clínicos; de cuidados, solo recordatorios sin nombres ni medicamentos.
      x-roles: [dueno, casa]
      x-escribe: false
      x-solo-local: true
      x-fase: 6
      security:
        - tokenPuente: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FraseBocina'
            example:
              entity_id: tts.google_translate_es_com
              media_player_entity_id: media_player.bocina_cocina
              message: Hora de la comida.
      responses:
        '200':
          description: Frase enviada a la bocina.
        '401':
          description: Token del puente inválido.
  /api/services/script/turn_on:
    servers: *servidorPuente
    post:
      tags: [Puente de casa]
      operationId: ejecutarFraseFija
      summary: Ejecutar una frase fija
      description: Propuesta. Ejecuta un guion de Home Assistant con una frase fija de GRAVITY (D6).
      x-roles: [dueno, casa]
      x-escribe: false
      x-solo-local: true
      x-fase: 6
      security:
        - tokenPuente: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_id]
              properties:
                entity_id:
                  type: string
                  pattern: '^script\.[a-z0-9_]+$'
            example:
              entity_id: script.gravity_buenas_noches
      responses:
        '200':
          description: Guion en marcha.
        '401':
          description: Token del puente inválido.
  /api/states/{entity_id}:
    servers: *servidorPuente
    get:
      tags: [Puente de casa]
      operationId: estadoEnCasa
      summary: Estado de una bocina o guion
      description: Propuesta. Comprueba que una bocina o un guion existe y en qué estado está.
      x-roles: [dueno, casa]
      x-escribe: false
      x-solo-local: true
      x-fase: 6
      security:
        - tokenPuente: []
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
          example: media_player.bocina_cocina
      responses:
        '200':
          description: Estado de la entidad.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity_id:
                    type: string
                  state:
                    type: string
        '404':
          description: No existe esa entidad.

components:
  securitySchemes:
    llavePublica:
      type: apiKey
      in: header
      name: apikey
      description: Llave pública de Supabase. Entra por `--dart-define`; nunca en el repositorio.
    sesion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sesión de la persona (Supabase Auth). Las reglas RLS usan su rol en el hogar.
    tokenPuente:
      type: http
      scheme: bearer
      description: Token de larga duración de la cuenta Casa en Home Assistant. Nunca en el repositorio.

  parameters:
    nombreHerramienta:
      name: nombre
      in: path
      required: true
      description: Nombre `<modulo>.<accion>` de la herramienta.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'
      example: habitos.abrir
    select:
      name: select
      in: query
      description: Columnas a traer (PostgREST).
      schema:
        type: string
        default: '*'
    filtroId:
      name: id
      in: query
      description: 'Filtro de PostgREST por identificador, p. ej. `eq.<uuid>`.'
      schema:
        type: string
      example: eq.6f1c2a8e-3b7d-4c55-9e0a-2d4b8f1e7a90
    filtroIdObligatorio:
      name: id
      in: query
      required: true
      description: 'Registro a cambiar: `eq.<uuid>`. Obligatorio para no tocar varios a la vez.'
      schema:
        type: string
        pattern: '^eq\.[0-9a-f-]{36}$'
      example: eq.6f1c2a8e-3b7d-4c55-9e0a-2d4b8f1e7a90
    filtroHogar:
      name: hogar_id
      in: query
      description: 'Filtro por hogar, p. ej. `eq.<uuid>`.'
      schema:
        type: string
    orden:
      name: order
      in: query
      description: Orden (PostgREST), p. ej. `registrado_en.desc`.
      schema:
        type: string
    limite:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    preferir:
      name: Prefer
      in: header
      description: '`return=representation` para recibir el registro; `return=minimal` para no recibir nada.'
      schema:
        type: string
        enum: [return=representation, return=minimal]

  requestBodies:
    PeticionHerramienta:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PeticionHerramienta'
    SoloHogar:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [p_hogar_id]
            properties:
              p_hogar_id:
                $ref: '#/components/schemas/Uuid'

  responses:
    ResultadoHerramienta:
      description: Resultado, o la tarjeta de confirmación si la herramienta escribe y falta confirmar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultadoHerramienta'
          example:
            herramienta: habitos.abrir
            contenido: Abriendo Hábitos…
            requiere_confirmacion: false
            solo_local: false
            para_ia: Se abrió Hábitos.
    HerramientaNoDisponible:
      description: No existe para el rol o su módulo está inactivo (mismo mensaje en todos los casos).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorHerramienta'
          example:
            mensaje: La herramienta «finanzas.abrir» no está disponible.
    Actualizado:
      description: Registros actualizados (con `Prefer` igual a `return=representation`).
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    SinSesion:
      description: Falta la sesión o la llave pública.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: PGRST301
            message: JWT expired
            details: null
            hint: null
    Prohibido:
      description: Las reglas del servidor (RLS) no lo permiten para tu rol.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: '42501'
            message: new row violates row-level security policy
            details: null
            hint: null
    Invalido:
      description: Datos no válidos (p. ej. invitación vencida o ya usada).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: '22023'
            message: La invitación no es válida o ya expiró.
            details: null
            hint: null

  schemas:
    Uuid:
      type: string
      format: uuid
    Rol:
      type: string
      enum: [dueno, coadministrador, familiar, cuidador, casa]
    RolInvitable:
      type: string
      description: Cualquier rol menos dueño.
      enum: [coadministrador, familiar, cuidador, casa]
    Modulo:
      type: string
      enum: [gravity, finanzas, habitos, cuidados, alimentacion, casa, ajustes]
    Accion:
      type: string
      enum: [leer, escribir, administrar]
    Alcance:
      type: string
      enum: [total, propio, restringido]
    Herramienta:
      type: object
      required: [nombre, descripcion, modulo, roles, escribe, solo_local]
      properties:
        nombre:
          type: string
          pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'
        descripcion:
          type: string
        modulo:
          $ref: '#/components/schemas/Modulo'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Rol'
        escribe:
          type: boolean
          description: Si escribe, pide confirmación.
        solo_local:
          type: boolean
          description: Si es solo local, su resultado nunca va a la IA en la nube.
    PeticionHerramienta:
      type: object
      properties:
        parametros:
          type: object
          description: Parámetros de la herramienta (las de navegación no llevan).
        confirmado:
          type: boolean
          default: false
          description: Solo `true` después de que la persona aceptó la tarjeta de confirmación.
    ResultadoHerramienta:
      type: object
      required: [herramienta, contenido, requiere_confirmacion, solo_local, para_ia]
      properties:
        herramienta:
          type: string
        contenido:
          type: string
          description: Texto para la pantalla o la voz local.
        requiere_confirmacion:
          type: boolean
          description: Si es `true`, no se escribió nada; `contenido` es la tarjeta de confirmación.
        solo_local:
          type: boolean
        para_ia:
          type: [string, 'null']
          description: Lo mínimo que puede ver la IA. Siempre nulo si `solo_local`.
    ErrorHerramienta:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string
          examples:
            - La herramienta «finanzas.abrir» no está disponible.
    ErrorPostgrest:
      type: object
      properties:
        code:
          type: string
          examples: ['42501']
        message:
          type: string
        details:
          type: [string, 'null']
        hint:
          type: [string, 'null']
    Hogar:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
          maxLength: 80
        creado_en:
          type: string
          format: date-time
    Persona:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        usuario_id:
          type: [string, 'null']
          format: uuid
          description: Cuenta de Supabase; nulo si la cuenta se eliminó.
        nombre_visible:
          type: string
          maxLength: 80
        creado_en:
          type: string
          format: date-time
    Membresia:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        persona_id:
          $ref: '#/components/schemas/Uuid'
        rol:
          $ref: '#/components/schemas/Rol'
        activa:
          type: boolean
        desde:
          type: string
          format: date-time
        hasta:
          type: [string, 'null']
          format: date-time
        creado_en:
          type: string
          format: date-time
    PermisoRol:
      type: object
      properties:
        rol:
          $ref: '#/components/schemas/Rol'
        modulo:
          $ref: '#/components/schemas/Modulo'
        accion:
          $ref: '#/components/schemas/Accion'
        alcance:
          $ref: '#/components/schemas/Alcance'
        nota:
          type: [string, 'null']
    Invitacion:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/RolInvitable'
        token_hash:
          type: string
          description: SHA-256 del token; el token no se guarda.
        expira_en:
          type: string
          format: date-time
        creada_por:
          type: [string, 'null']
          format: uuid
        creada_en:
          type: string
          format: date-time
        aceptada_en:
          type: [string, 'null']
          format: date-time
        aceptada_por:
          type: [string, 'null']
          format: uuid
        revocada_en:
          type: [string, 'null']
          format: date-time
    Dispositivo:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        persona_id:
          $ref: '#/components/schemas/Uuid'
        plataforma:
          type: string
          enum: [android, windows]
        token_avisos:
          type: [string, 'null']
        nombre:
          type: [string, 'null']
        creado_en:
          type: string
          format: date-time
        ultimo_uso:
          type: string
          format: date-time
    EntradaBitacora:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          type: [string, 'null']
          format: uuid
        persona_id:
          type: [string, 'null']
          format: uuid
          description: Quién; lo pone el servidor. Nulo = sistema.
        accion:
          type: string
          description: >-
            Qué pasó, en minúsculas. `insertar`, `actualizar` y `borrar` solo las escriben
            los triggers que registran los cambios de las tablas.
        tabla:
          type: [string, 'null']
        registro_id:
          type: [string, 'null']
        detalle:
          type: object
        ocurrido_en:
          type: string
          format: date-time
        registrado_en:
          type: string
          format: date-time
    MovimientoMuestra:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        descripcion:
          type: string
        monto_centavos:
          type: integer
          format: int64
          description: Dinero en centavos (MXN).
        registrado_por:
          type: [string, 'null']
          format: uuid
        creado_en:
          type: string
          format: date-time
    Aviso:
      type: object
      description: Propuesta (Fase 2).
      required: [personas, titulo]
      properties:
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        personas:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        titulo:
          type: string
          maxLength: 80
        cuerpo:
          type: string
          maxLength: 200
        ruta:
          type: string
          description: Ruta de la app que abre al tocar el aviso.
    PreguntaIa:
      type: object
      description: Propuesta (Fase 6). Sin nombres, montos ni datos clínicos.
      required: [pregunta, herramientas]
      properties:
        pregunta:
          type: string
          maxLength: 500
        herramientas:
          type: array
          items:
            $ref: '#/components/schemas/Herramienta'
    RespuestaIa:
      type: object
      description: Propuesta (Fase 6).
      properties:
        herramienta:
          type: [string, 'null']
        parametros:
          type: object
        texto:
          type: [string, 'null']
    FraseBocina:
      type: object
      required: [entity_id, media_player_entity_id, message]
      properties:
        entity_id:
          type: string
          description: Motor de voz de Home Assistant.
        media_player_entity_id:
          type: string
          description: Bocina.
        message:
          type: string
          maxLength: 200
          description: Frase genérica, sin dinero ni datos clínicos.
        language:
          type: string
          default: es-MX
