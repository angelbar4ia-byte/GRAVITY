  /rest/v1/cui_turnos:
    get:
      tags: [Base de datos · Cuidados]
      operationId: leerCuiTurnos
      summary: Leer turnos de cuidado
      description: >-
        Turnos semanales (spec 5 §3): quién cuida y cuándo. Los ven el dueño, la pareja
        (siempre), la cuidadora y la hermana. Es la fuente de quién está de turno
        (`cuiQuienEnTurno`): los recordatorios llegan solo a ellos.
      x-roles: [dueno, coadministrador, familiar, cuidador]
      x-escribe: false
      x-solo-local: true
      x-fase: 5
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/filtroId'
        - $ref: '#/components/parameters/filtroHogar'
        - $ref: '#/components/parameters/orden'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Filas que tu rol puede ver (RLS).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CuiTurno'
              example: [{"id": "a5100000-0000-4000-8000-000000000001", "hogar_id": "b0000000-0000-4000-8000-000000000001", "persona_id": "e0000000-0000-4000-8000-000000000004", "dia_semana": 1, "inicio_min": 540, "fin_min": 900, "tipo": "cuidadora"}]
        '401':
          $ref: '#/components/responses/SinSesion'
    post:
      tags: [Base de datos · Cuidados]
      operationId: agregarCuiTurnos
      summary: Agregar turnos de cuidado
      description: >-
        Solo el dueño asigna turnos. `dia_semana` 1 (lunes) a 7; minutos desde medianoche (0 a
        1440), `fin_min` mayor que `inicio_min` (23514); un turno no cruza la medianoche (se
        parte en dos). `dueno` solo para el dueño; `cuidadora` y `hermana_visita` para un
        cuidador o familiar vigente del hogar (22023).
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 5
      parameters:
        - $ref: '#/components/parameters/alConflicto'
        - $ref: '#/components/parameters/preferirAlSubir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CuiTurno'
                - required: ["id", "hogar_id", "persona_id", "dia_semana", "inicio_min", "fin_min", "tipo"]
            example: {"id": "a5100000-0000-4000-8000-000000000001", "hogar_id": "b0000000-0000-4000-8000-000000000001", "persona_id": "e0000000-0000-4000-8000-000000000004", "dia_semana": 1, "inicio_min": 540, "fin_min": 900, "tipo": "cuidadora"}
      responses:
        '201':
          $ref: '#/components/responses/Agregado'
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/ConflictoCuidados'
    patch:
      tags: [Base de datos · Cuidados]
      operationId: cambiarCuiTurnos
      summary: Cambiar turnos de cuidado
      description: >-
        Solo el dueño cambia turnos. Mismas reglas que al agregar.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 5
      parameters:
        - $ref: '#/components/parameters/filtroIdObligatorio'
        - $ref: '#/components/parameters/preferir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CuiTurno'
                - minProperties: 1
            example: {"fin_min": 930}
      responses:
        '200':
          $ref: '#/components/responses/Actualizado'
        '204':
          description: Actualizado (sin cuerpo).
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '403':
          $ref: '#/components/responses/Prohibido'
    delete:
      tags: [Base de datos · Cuidados]
      operationId: borrarCuiTurnos
      summary: Borrar turnos de cuidado
      description: >-
        Borra un turno (solo el dueño). Queda en la bitácora de auditoría.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 5
      parameters:
        - $ref: '#/components/parameters/filtroIdObligatorio'
      responses:
        '204':
          description: Borrado.
        '403':
          $ref: '#/components/responses/Prohibido'
