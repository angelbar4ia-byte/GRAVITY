openapi: 3.1.0
info:
  title: GRAVITY · APIs del sistema
  version: 0.1.0
  summary: Herramientas de GRAVITY, base de datos, funciones del servidor y puente de casa (D16).
  description: |
    Especificación de las APIs de GRAVITY (decisión D16). Se consulta en la laptop, en
    Ajustes › Desarrollador, solo con rol Dueño. **No se publica en internet.**

    Cada operación declara, con extensiones propias:

    - `x-roles`: roles que la pueden usar (D5): `dueno`, `coadministrador`, `familiar`,
      `cuidador`, `casa`. La verdad de los permisos está en el servidor (RLS).
    - `x-escribe`: `true` si escribe datos; GRAVITY y esta consola piden confirmación antes
      de enviarla. `segun-herramienta` en la operación genérica de herramientas.
    - `x-solo-local`: `true` si su resultado nunca pasa por la IA en la nube (D3: dinero,
      datos clínicos y datos personales). `segun-herramienta` en la operación genérica.
    - `x-fase`: fase del roadmap en que se construye.

    Convenciones (especificación de la Fase 0, sección 4): dinero en centavos (`int`),
    identificadores UUID, fechas `date` y `timestamptz`, libros solo-agregar.

    Las llaves (Supabase, Home Assistant) entran por `--dart-define` o archivos ignorados
    por git; nunca se escriben aquí.
  license:
    name: Privado. Uso exclusivo del proyecto Segundo Cerebro; no se publica.
servers:
  - url: https://{proyecto}.supabase.co
    description: Proyecto de Supabase (D7). El identificador real no se guarda en el repositorio.
    variables:
      proyecto:
        default: tu-proyecto
        description: Identificador del proyecto de Supabase.
  - url: http://127.0.0.1:54321
    description: Supabase local para desarrollo (`supabase start`).
security:
  - llavePublica: []
    sesion: []
tags:
  - name: Herramientas de GRAVITY
    description: |
      Lista cerrada de funciones que GRAVITY puede usar (D1). Cada una declara su módulo,
      sus roles, si escribe (pide confirmación) y si es solo local (D3). El registro de la
      app rechaza, al arrancar, una herramienta declarada para un rol que la matriz de
      permisos no deja abrir, leer o escribir su módulo (D5), y una de Finanzas o Cuidados
      que no sea solo local (D3), salvo las de navegación, que no leen datos. En la Fase 0
      son de navegación y se ejecutan dentro de la app; exponerlas por red para el puente
      de casa es una propuesta de la Fase 6.
  - name: Base de datos
    description: |
      Supabase (PostgREST): `/rest/v1/<tabla>` con los filtros de PostgREST
      (`?id=eq.<uuid>`, `select`, `order`, `limit`). Cada consulta pasa por las reglas
      por registro (RLS) del rol: se lee solo lo que el rol puede ver. Esquema en
      `supabase/migrations/20261020000000_base.sql`. Nada de esta base va a la IA.
  - name: Funciones del servidor
    description: |
      Funciones de Supabase (`/functions/v1/<nombre>`) desde la Fase 2: avisos al instante
      y, en la Fase 6, el intermediario de la IA, que guarda la clave de la API en el
      servidor (nunca en la app).
  - name: Puente de casa
    description: |
      Home Assistant en la red de la casa (D9), Fase 6. Usa la cuenta de rol Casa: nunca
      alcanza dinero ni datos clínicos, y las bocinas solo dicen frases genéricas (D3, D6).
      Solo en la red local; nunca se abren puertos del router.

paths:
  # ---------------------------------------------------------------------------
  # Herramientas de GRAVITY (Fase 0: navegación)
  # ---------------------------------------------------------------------------
  /herramientas:
    servers: &servidorHerramientas
      - url: http://127.0.0.1:{puerto}
        description: >-
          Propuesta para la Fase 6: GRAVITY en la laptop atiende las herramientas para el
          puente de casa. En la Fase 0 se ejecutan dentro de la app, sin red.
        variables:
          puerto:
            default: '8787'
    get:
      tags: [Herramientas de GRAVITY]
      operationId: listarHerramientas
      summary: Herramientas disponibles para la sesión
      description: >-
        Lista las herramientas que el rol de la sesión puede usar con los módulos activos.
        Lo que no está en la lista no existe para GRAVITY. Es lo único que ve la IA para
        elegir qué hacer.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: false
      x-solo-local: false
      x-fase: 0
      responses:
        '200':
          description: Herramientas del rol.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Herramienta'
              example:
                - nombre: habitos.abrir
                  descripcion: Abre Hábitos.
                  modulo: habitos
                  roles: [dueno, coadministrador, familiar]
                  escribe: false
                  solo_local: false
        '401':
          $ref: '#/components/responses/SinSesion'
  /herramientas/{nombre}:
    servers: *servidorHerramientas
    post:
      tags: [Herramientas de GRAVITY]
      operationId: ejecutarHerramienta
      summary: Ejecutar una herramienta
      description: >-
        Ejecuta la herramienta si el rol la tiene y su módulo está activo; si no, responde
        404 con el mismo mensaje en todos los casos. Si escribe y no viene
        `confirmado: true`, no ejecuta nada y responde `requiere_confirmacion` con el texto
        de la tarjeta de confirmación. Si es solo local, `para_ia` siempre es nulo y, si
        falla, el error no lleva el mensaje original (podría llevar cifras).
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: segun-herramienta
      x-solo-local: segun-herramienta
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/nombreHerramienta'
      requestBody:
        $ref: '#/components/requestBodies/PeticionHerramienta'
      responses:
        '200':
          $ref: '#/components/responses/ResultadoHerramienta'
        '404':
          $ref: '#/components/responses/HerramientaNoDisponible'
  /herramientas/gravity.abrir:
    servers: *servidorHerramientas
    post:
      tags: [Herramientas de GRAVITY]
      operationId: herramientaGravityAbrir
      summary: gravity.abrir · Abrir Inicio
      description: Abre la pantalla principal de GRAVITY.
      x-roles: [dueno, coadministrador, familiar, casa]
      x-escribe: false
      x-solo-local: false
      x-fase: 0
      requestBody:
        $ref: '#/components/requestBodies/PeticionHerramienta'
      responses:
        '200':
          $ref: '#/components/responses/ResultadoHerramienta'
        '404':
          $ref: '#/components/responses/HerramientaNoDisponible'
  /herramientas/finanzas.abrir:
    servers: *servidorHerramientas
    post:
      tags: [Herramientas de GRAVITY]
      operationId: herramientaFinanzasAbrir
      summary: finanzas.abrir · Abrir Finanzas
      description: >-
        Abre Finanzas. Solo navega: no lee montos. Sinónimos en la barra de órdenes:
        presupuesto, dinero.
      x-roles: [dueno, coadministrador]
      x-escribe: false
      x-solo-local: false
      x-fase: 0
      requestBody:
        $ref: '#/components/requestBodies/PeticionHerramienta'
      responses:
        '200':
          $ref: '#/components/responses/ResultadoHerramienta'
        '404':
          $ref: '#/components/responses/HerramientaNoDisponible'
  /herramientas/habitos.abrir:
    servers: *servidorHerramientas
    post:
      tags: [Herramientas de GRAVITY]
      operationId: herramientaHabitosAbrir
      summary: habitos.abrir · Abrir Hábitos
      description: Abre Hábitos (lo propio de cada persona).
      x-roles: [dueno, coadministrador, familiar]
      x-escribe: false
      x-solo-local: false
      x-fase: 0
      requestBody:
        $ref: '#/components/requestBodies/PeticionHerramienta'
      responses:
        '200':
          $ref: '#/components/responses/ResultadoHerramienta'
        '404':
          $ref: '#/components/responses/HerramientaNoDisponible'
  /herramientas/cuidados.abrir:
    servers: *servidorHerramientas
    post:
      tags: [Herramientas de GRAVITY]
      operationId: herramientaCuidadosAbrir
      summary: cuidados.abrir · Abrir Cuidados
      description: >-
        Abre Cuidados. Lo que se ve adentro depende del rol: completo (dueño), su turno
        (cuidador) o recordatorios genéricos (casa). El coadministrador no entra a
        Cuidados hasta que se registre el consentimiento (Fase 5). Sinónimo en la barra de
        órdenes: papá.
      x-roles: [dueno, cuidador, casa]
      x-escribe: false
      x-solo-local: false
      x-fase: 0
      requestBody:
        $ref: '#/components/requestBodies/PeticionHerramienta'
      responses:
        '200':
          $ref: '#/components/responses/ResultadoHerramienta'
        '404':
          $ref: '#/components/responses/HerramientaNoDisponible'
  /herramientas/alimentacion.abrir:
    servers: *servidorHerramientas
    post:
      tags: [Herramientas de GRAVITY]
      operationId: herramientaAlimentacionAbrir
      summary: alimentacion.abrir · Abrir Alimentación
      description: >-
        Abre Alimentación. Sinónimos en la barra de órdenes: comida, cocina, menú, recetas.
      x-roles: [dueno, coadministrador, familiar, casa]
      x-escribe: false
      x-solo-local: false
      x-fase: 0
      requestBody:
        $ref: '#/components/requestBodies/PeticionHerramienta'
      responses:
        '200':
          $ref: '#/components/responses/ResultadoHerramienta'
        '404':
          $ref: '#/components/responses/HerramientaNoDisponible'
  /herramientas/casa.abrir:
    servers: *servidorHerramientas
    post:
      tags: [Herramientas de GRAVITY]
      operationId: herramientaCasaAbrir
      summary: casa.abrir · Abrir Casa
      description: Abre Casa. Sinónimo en la barra de órdenes, hogar.
      x-roles: [dueno, coadministrador, familiar, casa]
      x-escribe: false
      x-solo-local: false
      x-fase: 0
      requestBody:
        $ref: '#/components/requestBodies/PeticionHerramienta'
      responses:
        '200':
          $ref: '#/components/responses/ResultadoHerramienta'
        '404':
          $ref: '#/components/responses/HerramientaNoDisponible'
  /herramientas/ajustes.abrir:
    servers: *servidorHerramientas
    post:
      tags: [Herramientas de GRAVITY]
      operationId: herramientaAjustesAbrir
      summary: ajustes.abrir · Abrir Ajustes
      description: Abre Ajustes (lo propio de cada persona; todo para el dueño).
      x-roles: [dueno, coadministrador, familiar, cuidador]
      x-escribe: false
      x-solo-local: false
      x-fase: 0
      requestBody:
        $ref: '#/components/requestBodies/PeticionHerramienta'
      responses:
        '200':
          $ref: '#/components/responses/ResultadoHerramienta'
        '404':
          $ref: '#/components/responses/HerramientaNoDisponible'
  /herramientas/ajustes.abrir_desarrollador:
    servers: *servidorHerramientas
    post:
      tags: [Herramientas de GRAVITY]
      operationId: herramientaAjustesAbrirDesarrollador
      summary: ajustes.abrir_desarrollador · Abrir Desarrollador
      description: >-
        Abre Ajustes › Desarrollador, esta consola. Solo el dueño y solo en la laptop (D16):
        la barra de órdenes no la ofrece en otro dispositivo y el router de la app lo vuelve
        a revisar.
      x-roles: [dueno]
      x-escribe: false
      x-solo-local: false
      x-fase: 0
      requestBody:
        $ref: '#/components/requestBodies/PeticionHerramienta'
      responses:
        '200':
          $ref: '#/components/responses/ResultadoHerramienta'
        '404':
          $ref: '#/components/responses/HerramientaNoDisponible'

  # ---------------------------------------------------------------------------
  # Base de datos (Supabase, Fase 0)
  # ---------------------------------------------------------------------------
  /rest/v1/hogares:
    get:
      tags: [Base de datos]
      operationId: leerHogares
      summary: Leer hogares
      description: Hogares de los que eres miembro vigente.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: false
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/filtroId'
      responses:
        '200':
          description: Hogares visibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hogar'
        '401':
          $ref: '#/components/responses/SinSesion'
    patch:
      tags: [Base de datos]
      operationId: renombrarHogar
      summary: Cambiar el nombre del hogar
      description: Solo el dueño (administra Ajustes). Solo la columna `nombre`. Queda en la bitácora.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/filtroIdObligatorio'
        - $ref: '#/components/parameters/preferir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              additionalProperties: false
              properties:
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          $ref: '#/components/responses/Actualizado'
        '204':
          description: Actualizado (sin cuerpo).
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/crear_hogar:
    post:
      tags: [Base de datos]
      operationId: crearHogar
      summary: Crear un hogar
      description: >-
        Crea un hogar y deja como dueño a quien lo crea. Devuelve el `id` del hogar. La puede
        llamar **cualquier cuenta con sesión**, aunque todavía no pertenezca a ningún hogar
        o tenga otro rol en otro hogar: por eso `x-roles` lista los cinco roles. Quien la
        llama queda como dueño solo del hogar nuevo.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_nombre]
              properties:
                p_nombre:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          description: Identificador del hogar nuevo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uuid'
        '401':
          $ref: '#/components/responses/SinSesion'
  /rest/v1/personas:
    get:
      tags: [Base de datos]
      operationId: leerPersonas
      summary: Leer personas
      description: Cada quien se ve a sí mismo; el dueño ve a los miembros de su hogar, también a los dados de baja.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: false
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/filtroId'
      responses:
        '200':
          description: Personas visibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Persona'
        '401':
          $ref: '#/components/responses/SinSesion'
    patch:
      tags: [Base de datos]
      operationId: cambiarMiNombre
      summary: Cambiar mi nombre visible
      description: Cada quien cambia solo su propio `nombre_visible`.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/filtroIdObligatorio'
        - $ref: '#/components/parameters/preferir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_visible]
              additionalProperties: false
              properties:
                nombre_visible:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          $ref: '#/components/responses/Actualizado'
        '204':
          description: Actualizado (sin cuerpo).
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/membresias:
    get:
      tags: [Base de datos]
      operationId: leerMembresias
      summary: Leer membresías y roles
      description: Cada quien ve las suyas; el dueño, las de su hogar.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: false
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/filtroId'
        - $ref: '#/components/parameters/filtroHogar'
      responses:
        '200':
          description: Membresías visibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membresia'
        '401':
          $ref: '#/components/responses/SinSesion'
    patch:
      tags: [Base de datos]
      operationId: cambiarMembresia
      summary: Cambiar rol o dar de baja
      description: >-
        Solo el dueño, sobre otras personas: cambiar `rol` (nunca a dueño), dar de baja
        (`activa: false` u `hasta`). La baja quita el acceso de inmediato; las membresías no
        se borran y todo queda en la bitácora.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/filtroIdObligatorio'
        - $ref: '#/components/parameters/preferir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                rol:
                  $ref: '#/components/schemas/RolInvitable'
                activa:
                  type: boolean
                hasta:
                  type: [string, 'null']
                  format: date-time
      responses:
        '200':
          $ref: '#/components/responses/Actualizado'
        '204':
          description: Actualizado (sin cuerpo).
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/permisos_rol:
    get:
      tags: [Base de datos]
      operationId: leerMatrizPermisos
      summary: Leer la matriz de permisos
      description: Matriz rol × módulo × acción con su alcance. Solo cambia por migración; la app lleva un espejo.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: false
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/select'
      responses:
        '200':
          description: La matriz completa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermisoRol'
        '401':
          $ref: '#/components/responses/SinSesion'
  /rest/v1/rpc/mis_permisos:
    post:
      tags: [Base de datos]
      operationId: misPermisos
      summary: Mis permisos en un hogar
      description: Los permisos del rol vigente de quien consulta (módulo, acción y alcance).
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: false
      x-solo-local: true
      x-fase: 0
      requestBody:
        $ref: '#/components/requestBodies/SoloHogar'
      responses:
        '200':
          description: Permisos del rol.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    modulo:
                      $ref: '#/components/schemas/Modulo'
                    accion:
                      $ref: '#/components/schemas/Accion'
                    alcance:
                      $ref: '#/components/schemas/Alcance'
        '401':
          $ref: '#/components/responses/SinSesion'
  /rest/v1/invitaciones:
    get:
      tags: [Base de datos]
      operationId: leerInvitaciones
      summary: Leer invitaciones
      description: Solo el dueño del hogar. El token no se guarda, solo su huella SHA-256.
      x-roles: [dueno]
      x-escribe: false
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/filtroHogar'
      responses:
        '200':
          description: Invitaciones del hogar.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitacion'
        '401':
          $ref: '#/components/responses/SinSesion'
  /rest/v1/rpc/crear_invitacion:
    post:
      tags: [Base de datos]
      operationId: crearInvitacion
      summary: Invitar a una persona
      description: >-
        Solo el dueño. Rol: coadministrador, familiar, cuidador o casa. Devuelve el token una
        sola vez; las invitaciones pendientes al mismo correo se revocan.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_hogar_id, p_correo, p_rol]
              properties:
                p_hogar_id:
                  $ref: '#/components/schemas/Uuid'
                p_correo:
                  type: string
                  format: email
                  maxLength: 254
                p_rol:
                  $ref: '#/components/schemas/RolInvitable'
                p_vigencia_dias:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 7
      responses:
        '200':
          description: La invitación y su token (se muestra una sola vez).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    invitacion_id:
                      $ref: '#/components/schemas/Uuid'
                    token:
                      type: string
                    expira:
                      type: string
                      format: date-time
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/aceptar_invitacion:
    post:
      tags: [Base de datos]
      operationId: aceptarInvitacion
      summary: Aceptar una invitación
      description: >-
        La acepta la persona cuyo correo confirmado coincide; crea su membresía con el rol
        invitado. Devuelve el `id` del hogar.
      x-roles: [coadministrador, familiar, cuidador, casa]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_token]
              properties:
                p_token:
                  type: string
      responses:
        '200':
          description: Hogar al que entraste.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uuid'
        '400':
          $ref: '#/components/responses/Invalido'
  /rest/v1/rpc/revocar_invitacion:
    post:
      tags: [Base de datos]
