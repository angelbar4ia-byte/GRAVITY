    post:
      tags: [Base de datos · Finanzas]
      operationId: asignarCuentaMaestra
      summary: Nombrar o quitar la cuenta maestra
      description: >-
        Solo el dueño (42501). Nombra la cuenta maestra del hogar: un miembro vigente con
        rol dueño o coadministrador (si no, 22023); nunca familiar, cuidador ni Casa. Con
        `p_persona_id` nulo la quita. Una sola por hogar. Puede ser el propio dueño (con su
        persona: en lo suyo sigue escribiendo) o un coadministrador vigente que no lleve
        libro propio; a uno que sí lo lleva lo rechaza con 400 (22023: "invita a otra
        persona como cuenta maestra, o nómbrate tú"). Lo normal es invitarla con
        `crearInvitacion` y `p_es_maestra: true` (otra persona con su propio login, sin
        libro personal); si no es la dueña, es de solo lectura total. Si cambia quién es,
        deja la entrada `finanzas.maestra_asignada` (en `detalle`, `anterior_persona_id` y
        `nueva_persona_id`), que ve todo adulto con Finanzas (M10), además de la de
        membresías, que solo ve el dueño.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_hogar_id, p_persona_id]
