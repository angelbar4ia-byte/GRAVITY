      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_zona_horaria:
                  type: string
                p_silencio_desde:
                  type: string
                  pattern: '^[0-9]{2}:[0-9]{2}(:[0-9]{2})?$'
                p_silencio_hasta:
                  type: string
                  pattern: '^[0-9]{2}:[0-9]{2}(:[0-9]{2})?$'
                p_criticas_en_silencio:
                  type: boolean
                p_tope_no_criticas:
                  type: integer
                  minimum: 0
