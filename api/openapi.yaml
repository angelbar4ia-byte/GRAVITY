        miembro de un compartido (si está archivado, solo quien lo creó, para reactivarlo),
        albacea de un representado. La cuenta maestra que no es la dueña nunca escribe ni
        administra, en ningún libro. Siempre exige un rol con Finanzas: a familiar, cuidador
        y Casa les responde `false`, salvo que el familiar lee el libro de Papá (representado)
