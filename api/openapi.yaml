  /rest/v1/rpc/hab_subir_sobres:
    post:
      tags: [Base de datos · Hábitos]
      operationId: habSubirSobres
      summary: Subir sobres cifrados
      description: >-
        Hasta 50 sobres por llamada, cada uno con `id` (opaco), `tipo`, `revision`,
        `cifrado`, `llave_version` y `eliminado`. Solo de tipos en `nube_cifrada` (400,
        22023); la revisión es nueva o la siguiente (si salta, 22023; si es igual o menor es
        un conflicto que se devuelve, no un error); el sobre pesa a lo más 64 KB (23514) y
        la cuota es de 25 MB por persona (22023). Idempotente. La hora que queda es la del
        servidor. Devuelve cuántos aceptó y los conflictos. Exige Hábitos en el hogar: a la
        cuenta maestra, al cuidador, a la cuenta Hogar y a quien no tiene sesión, 403
        (42501).
      x-roles: [dueno, coadministrador, familiar]
      x-escribe: true
      x-solo-local: true
      x-fase: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_sobres]
              properties:
                p_sobres: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/HabSobreSubida'}}
            example:
              p_sobres:
                - id: 9c000000-0000-4000-8000-000000000001
                  tipo: habitos_sensibles
                  revision: 1
                  cifrado: dGV4dG8tY2lmcmFkby1kZS1lamVtcGxv
                  llave_version: 1
                  eliminado: false
