  /rest/v1/rpc/fin_registrar_consulta_maestra:
    post:
      tags: [Base de datos · Finanzas]
      operationId: finRegistrarConsultaMaestra
      summary: Registrar una consulta de la cuenta maestra a un libro ajeno
      description: >-
        La cuenta maestra la llama **antes** de abrir un libro ajeno. Deja la consulta en la
        bitácora (`finanzas.consulta_maestra`, visible para quienes llevan ese libro) y
        habilita la lectura de ese libro por **30 minutos** (I2): es por libro y por
        persona, y pasado el tiempo hay que llamarla otra vez (cada llamada queda en la
        bitácora; la app la renueva sola mientras el libro está abierto). Sin una consulta
        vigente, el servidor no devuelve filas del contenido de un libro ajeno (cuentas,
        movimientos, plan, cierres, saldos): llega vacío, **sin error**; los libros y sus
        miembros sí se ven (la portada). Devuelve `true` si registró la consulta y `false`
        si el libro es propio (no se registra ni hace falta). Si ya hay una entrada del
        último minuto para ese libro y esa persona, devuelve `true` sin repetirla (no
        engorda la bitácora; la renovación automática de la app no la llena). Si la sesión no
        es la cuenta maestra del hogar, o el libro no existe, 403 (42501).
      x-roles: [dueno, coadministrador]
      x-escribe: true
      x-solo-local: true
      x-fase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_libro_id]
              properties:
                p_libro_id:
                  $ref: '#/components/schemas/Uuid'
            example:
              p_libro_id: f1000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: >-
            `true` si se registró la consulta (vale 30 minutos); `false` si el libro es propio.
          content:
            application/json:
              schema:
                type: boolean
              examples:
                registrada:
                  summary: 'Libro ajeno (Gastos de la casa): consulta registrada'
                  value: true
                propia:
                  summary: 'Libro propio: no se registra ni hace falta'
                  value: false
        '403':
          $ref: '#/components/responses/Prohibido'
        '401':
          $ref: '#/components/responses/SinSesion'
