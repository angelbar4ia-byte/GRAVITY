      description: >-
        Solo el dueño, sobre otras personas: cambiar `rol` (nunca a dueño), dar de baja
        (`activa: false` u `hasta`). La baja quita el acceso de inmediato; las membresías no
        se borran y todo queda en la bitácora. Dar un rol con Finanzas crea el libro
        personal de esa persona. `es_maestra` no se cambia aquí: `asignar_cuenta_maestra`.
        Si quien cambia de rol o se da de baja administraba un libro compartido y deja de ser
        adulto con Finanzas, el servidor pasa el cargo de administrador de ese libro al miembro
        vigente más antiguo y, con menos de 2 vigentes, lo deja privado (N5); nunca lo archiva.
