      operationId: cambiarMiembroLibro
      summary: Cerrar la participación en un libro
      description: >-
        Los miembros no se borran: se cierra `hasta` (queda en la bitácora). `libro_id` y
        `persona_id` no cambian (42501). En un libro **compartido**: **salirse** es un
        `PATCH` a la propia fila con `hasta` = ahora (la hora la manda el dispositivo);
        cualquier miembro puede, siempre, también con el libro archivado (`fin_puede_salir`).
        Si al salir (o al sacar a alguien) quedan menos de 2 miembros vigentes (adultos con
        Finanzas), el libro **no se archiva**: sigue `activo` y pasa a `visibilidad` =
        `privada`, y el miembro que queda es el administrador (`creado_por`), sin error. Si se
        va quien lo administra (o ya no es adulto con Finanzas del hogar), `creado_por` pasa
        al miembro vigente más antiguo (`desde`, luego `id`). El **último miembro vigente no
        puede salirse** ni lo saca nadie (400, 22023, "El último miembro de un libro
        compartido no puede salirse"; si ya no se usa, el administrador lo archiva). Todo
        cambio de `fin_libros` que hace el servidor queda en la bitácora. Quien se salió no
        vuelve a abrir su fila (ni con `upsert`): lo reingresa el administrador con una fila
        nueva. **Quitar a otro** (o cambiar su `desde`, `hasta` o `papel`) es solo de quien
        creó el libro, o del dueño del hogar si es miembro (I1); a cualquier otro responde
        403 (42501). Cambiar la fecha `desde` de la propia fila también es solo del
        administrador (42501). Un albacea es vigente (I4) solo si su membresía del hogar
        sigue activa y con Finanzas; si no, escribe el suplente.
