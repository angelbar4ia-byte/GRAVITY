                p_desde: {type: string, format: date}
                p_dias: {type: integer, minimum: 1, maximum: 14, default: 1}
            example: {"p_hogar_id": "b0000000-0000-4000-8000-000000000001", "p_desde": "2026-11-09", "p_dias": 1}
      responses:
        '200':
          description: Cuántas tomas creó.
          content:
            application/json:
              schema:
                type: integer
              example: 3
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/cui_marcar_toma:
    post:
      tags: [Base de datos · Cuidados]
      operationId: cuiMarcarToma
      summary: Marcar una toma como dada o no dada
      description: >-
        El dueño siempre; la cuidadora o la hermana solo si estaban de turno (cuidadora u
        hermana_visita) a la hora programada de la toma (v1.2). Fuera de su turno y la pareja
        (403, 42501, igual exista o no la toma). `p_estado` es
        `dado` o `no_dado` (22023); no vuelve a pendiente. Cada cambio queda en la bitácora de
        auditoría (`cuidados.toma_marcada`, solo el estado).
      x-roles: [dueno, familiar, cuidador]
      x-escribe: true
      x-solo-local: true
      x-fase: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["p_toma_id", "p_estado"]
              properties:
                p_toma_id: {$ref: '#/components/schemas/Uuid'}
                p_estado: {type: string, enum: [dado, no_dado]}
            example: {"p_toma_id": "a5600000-0000-4000-8000-000000000001", "p_estado": "dado"}
      responses:
        '200':
          description: Marcada.
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/cui_dejar_instruccion:
    post:
      tags: [Base de datos · Cuidados]
      operationId: cuiDejarInstruccion
      summary: Dejar una instrucción para la cuidadora principal
      description: >-
        El dueño, la hermana y la pareja (con o sin consentimiento; no la cuenta maestra) (v1.4).
        Escribe una fila de la bitácora de cuidados con `tipo = instruccion`. De 1 a 500
        caracteres (22023). La cuidadora la lee; la pareja sin consentimiento no lee la bitácora.
        Cuidadora, Casa y quien no tiene perfil: 403 (42501). La bitácora de auditoría guarda
        `cuidados.instruccion_dejada` sin el texto.
      x-roles: [dueno, coadministrador, familiar]
      x-escribe: true
      x-solo-local: true
      x-fase: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["p_hogar_id", "p_texto"]
              properties:
                p_hogar_id: {$ref: '#/components/schemas/Uuid'}
                p_texto: {type: string, minLength: 1, maxLength: 500}
            example: {"p_hogar_id": "b0000000-0000-4000-8000-000000000001", "p_texto": "Papá no debe comer sal hoy (ejemplo)"}
      responses:
        '200':
          description: El id de la instrucción.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uuid'
              example: "a5500000-0000-4000-8000-000000000001"
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/cui_crear_cambio_urgente:
    post:
      tags: [Base de datos · Cuidados]
      operationId: cuiCrearCambioUrgente
      summary: Mandar un cambio urgente al cuidador de turno
      description: >-
        Solo el dueño (D4). Crea el cambio (1 a 200 caracteres, 22023) y avisa AL INSTANTE, sin
        esperar el silencio nocturno, a quien está de turno que no sea él (aviso
        `cambio_urgente_cuidados`, crítico, sin texto: apunta al cambio). Sin nadie de turno
        queda sin destinatario y lo ven al entrar. Idempotente por `p_id` (cola sin conexión).
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["p_hogar_id", "p_texto"]
              properties:
                p_hogar_id: {$ref: '#/components/schemas/Uuid'}
                p_texto: {type: string, minLength: 1, maxLength: 200}
                p_id: {$ref: '#/components/schemas/Uuid'}
            example: {"p_hogar_id": "b0000000-0000-4000-8000-000000000001", "p_texto": "Papá no debe comer sal hoy (ejemplo)", "p_id": "a5400000-0000-4000-8000-000000000001"}
      responses:
        '200':
          description: El id del cambio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uuid'
              example: "a5400000-0000-4000-8000-000000000001"
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/cui_atender_cambio_urgente:
    post:
      tags: [Base de datos · Cuidados]
      operationId: cuiAtenderCambioUrgente
      summary: Marcar un cambio urgente como atendido
      description: >-
        Quien lo recibe, el dueño o, si nadie estaba de turno, una cuidadora u hermana. Marca la
        hora y resuelve su aviso. Repetirlo no falla.
      x-roles: [dueno, familiar, cuidador]
      x-escribe: true
      x-solo-local: true
      x-fase: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["p_id"]
              properties:
                p_id: {$ref: '#/components/schemas/Uuid'}
            example: {"p_id": "a5400000-0000-4000-8000-000000000001"}
      responses:
        '200':
          description: Atendido.
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/cui_confirmar_gasto:
    post:
      tags: [Base de datos · Cuidados]
      operationId: cuiConfirmarGasto
      summary: Confirmar o rechazar un gasto de cuidado
      description: >-
        Solo el dueño. `p_confirmar` true pasa el gasto a `confirmado` (Finanzas parte de ese
        estado), false a `rechazado`. Un gasto ya resuelto responde 55000.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["p_gasto_id", "p_confirmar"]
              properties:
                p_gasto_id: {$ref: '#/components/schemas/Uuid'}
                p_confirmar: {type: boolean}
            example: {"p_gasto_id": "a5300000-0000-4000-8000-000000000001", "p_confirmar": true}
      responses:
        '200':
          description: Resuelto.
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/cui_cambiar_consentimiento:
    post:
      tags: [Base de datos · Cuidados]
      operationId: cuiCambiarConsentimiento
      summary: Conceder o retirar un consentimiento
      description: >-
        Lo cambia su titular; el de Papá, que no tiene cuenta, lo firma el albacea (D19, spec 5
        §4). Hoy el consentimiento de la pareja le abre medicamentos, tomas y comidas en solo
        lectura; retirarlo cierra de inmediato. Queda en la bitácora de auditoría.
      x-roles: [dueno, coadministrador, familiar, cuidador]
      x-escribe: true
      x-solo-local: true
      x-fase: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["p_hogar_id", "p_persona_id", "p_concedido"]
              properties:
                p_hogar_id: {$ref: '#/components/schemas/Uuid'}
                p_persona_id: {$ref: '#/components/schemas/Uuid'}
                p_concedido: {type: boolean}
            example: {"p_hogar_id": "b0000000-0000-4000-8000-000000000001", "p_persona_id": "e0000000-0000-4000-8000-000000000002", "p_concedido": true}
      responses:
        '200':
          description: Guardado.
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/cui_autorizar_resumen:
    post:
      tags: [Base de datos · Cuidados]
      operationId: cuiAutorizarResumen
      summary: Autorizar que la hermana vea el resumen mensual
      description: >-
        Solo el albacea vigente del libro de Papá (D19). Autoriza (`p_vigente` true) o retira a
        un cuidador o familiar del hogar; retirarla cierra de inmediato. Queda en la bitácora de
        auditoría.
      x-roles: [dueno, coadministrador]
      x-escribe: true
      x-solo-local: true
      x-fase: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["p_hogar_id", "p_persona_id", "p_vigente"]
              properties:
                p_hogar_id: {$ref: '#/components/schemas/Uuid'}
                p_persona_id: {$ref: '#/components/schemas/Uuid'}
                p_vigente: {type: boolean}
            example: {"p_hogar_id": "b0000000-0000-4000-8000-000000000001", "p_persona_id": "e0000000-0000-4000-8000-000000000003", "p_vigente": true}
      responses:
        '200':
          description: Guardado.
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/cui_resumen_mensual:
    post:
      tags: [Base de datos · Cuidados]
      operationId: cuiResumenMensual
      summary: Resumen mensual del costo del cuidado
      description: >-
        Total del mes (`p_mes` se lleva al día 1) de los gastos de cuidado y de la casa
        CONFIRMADOS, EXCLUYENDO los que registraron la pareja y el dueño. Solo el dueño y la
        hermana con autorización vigente del albacea; cualquier otra sesión recibe 403 (42501).
        Devuelve totales, nunca filas ni personas.
      x-roles: [dueno, familiar, cuidador]
      x-escribe: false
      x-solo-local: true
      x-fase: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["p_mes"]
              properties:
                p_mes: {type: string, format: date}
            example: {"p_mes": "2026-11-01"}
      responses:
        '200':
          description: Un renglón por hogar donde tiene acceso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CuiResumenMensual'
              example: [{"hogar_id": "b0000000-0000-4000-8000-000000000001", "mes": "2026-11-01", "gastos_cuidado_centavos": 19000, "gastos_casa_centavos": 23000, "n_gastos": 4}]
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/cui_resumen_papa:
    post:
      tags: [Base de datos · Cuidados]
      operationId: cuiResumenPapa
      summary: Resumen del día de Papá
      description: >-
        Conteos de tomas y de comidas del día (por omisión, hoy en la zona del hogar), SIN
        nombres, dosis ni notas. Lo ve cualquiera con perfil en Cuidados, también la pareja sin
        consentimiento (spec 5 §4). Sin perfil, 403.
      x-roles: [dueno, coadministrador, familiar, cuidador]
      x-escribe: false
      x-solo-local: true
      x-fase: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["p_hogar_id"]
              properties:
                p_hogar_id: {$ref: '#/components/schemas/Uuid'}
                p_dia: {type: string, format: date}
            example: {"p_hogar_id": "b0000000-0000-4000-8000-000000000001", "p_dia": "2026-11-09"}
      responses:
        '200':
          description: Los conteos del día.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CuiResumenPapa'
              example: [{"dia": "2026-11-09", "tomas_total": 3, "tomas_dadas": 1, "tomas_no_dadas": 0, "tomas_pendientes": 2, "comidas_registradas": 1, "comidas_con_rechazo": 0}]
        '400':
          $ref: '#/components/responses/ReglaCuidados'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
components:
  securitySchemes:
    llavePublica:
      type: apiKey
      in: header
      name: apikey
      description: Llave pública de Supabase. Entra por `--dart-define`; nunca en el repositorio.
    sesion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sesión de la persona (Supabase Auth). Las reglas RLS usan su rol en el hogar.
    tokenPuente:
      type: http
      scheme: bearer
      description: Token de larga duración de la cuenta Casa en Home Assistant. Nunca en el repositorio.

  parameters:
    nombreHerramienta:
      name: nombre
      in: path
      required: true
      description: Nombre `<modulo>.<accion>` de la herramienta.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'
      example: habitos.abrir
    select:
      name: select
      in: query
      description: Columnas a traer (PostgREST).
      schema:
        type: string
        default: '*'
    filtroId:
      name: id
      in: query
      description: 'Filtro de PostgREST por identificador, p. ej. `eq.<uuid>`.'
      schema:
        type: string
      example: eq.6f1c2a8e-3b7d-4c55-9e0a-2d4b8f1e7a90
    filtroIdObligatorio:
      name: id
      in: query
      required: true
      description: 'Registro a cambiar: `eq.<uuid>`. Obligatorio para no tocar varios a la vez.'
      schema:
        type: string
        pattern: '^eq\.[0-9a-f-]{36}$'
      example: eq.6f1c2a8e-3b7d-4c55-9e0a-2d4b8f1e7a90
    filtroHogar:
      name: hogar_id
      in: query
      description: 'Filtro por hogar, p. ej. `eq.<uuid>`.'
      schema:
        type: string
    orden:
      name: order
      in: query
      description: Orden (PostgREST), p. ej. `registrado_en.desc`.
      schema:
        type: string
    limite:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    filtroPlanHab:
      name: plan_id
      in: query
      description: 'Filtro por plan de lectura, p. ej. `eq.<uuid>`.'
      schema:
        type: string
    filtroPlanHabObligatorio:
      name: plan_id
      in: query
      required: true
      description: 'Plan a cambiar: `eq.<uuid>`.'
      schema:
        type: string
        pattern: '^eq\.[0-9a-f-]{36}$'
    filtroDiaHab:
      name: dia
      in: query
      description: 'Día del plan, p. ej. `eq.3`.'
      schema:
        type: string
    preferir:
      name: Prefer
      in: header
      description: '`return=representation` para recibir el registro; `return=minimal` para no recibir nada.'
      schema:
        type: string
        enum: [return=representation, return=minimal]
    filtroLibro:
      name: libro_id
      in: query
      description: 'Filtro por libro de Finanzas, p. ej. `eq.<uuid>`. Sin filtro llegan todos los que puedes leer.'
      schema:
        type: string
      example: eq.f1000000-0000-4000-8000-000000000001
    filtroLibroObligatorio:
      name: libro_id
      in: query
      required: true
      description: 'Libro a cambiar: `eq.<uuid>`.'
      schema:
        type: string
        pattern: '^eq\.[0-9a-f-]{36}$'
      example: eq.f1000000-0000-4000-8000-000000000001
    filtroFecha:
      name: fecha
      in: query
      description: 'Filtro de PostgREST por fecha, p. ej. `gte.2026-10-19`.'
      schema:
        type: string
      example: gte.2026-10-19
    filtroSemana:
      name: semana_id
      in: query
      description: 'Filtro por semana del plan, p. ej. `eq.<uuid>`.'
      schema:
        type: string
    filtroSemanaInicio:
      name: semana_inicio
      in: query
      description: 'Filtro por el lunes de la semana, p. ej. `eq.2026-10-19`.'
      schema:
        type: string
      example: eq.2026-10-19
    alConflicto:
      name: on_conflict
      in: query
      description: >-
        Columna que identifica un reenvío de la cola sin conexión. Con
        `Prefer: resolution=ignore-duplicates` equivale a `INSERT … ON CONFLICT (id) DO NOTHING`.
      schema:
        type: string
        enum: [id]
    preferirAlSubir:
      name: Prefer
      in: header
      description: >-
        `resolution=ignore-duplicates` para subir desde la cola sin conexión (un reenvío
        idéntico no hace nada); `return=representation` para recibir lo insertado.
      schema:
        type: string
        enum:
          - return=minimal
          - return=representation
          - resolution=ignore-duplicates,return=minimal
          - resolution=ignore-duplicates,return=representation

  requestBodies:
    PeticionHerramienta:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PeticionHerramienta'
    SoloHogar:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [p_hogar_id]
            properties:
              p_hogar_id:
                $ref: '#/components/schemas/Uuid'

  responses:
    ResultadoHerramienta:
      description: Resultado, o la tarjeta de confirmación si la herramienta escribe y falta confirmar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultadoHerramienta'
          example:
            herramienta: habitos.abrir
            contenido: Abriendo Hábitos…
            requiere_confirmacion: false
            solo_local: false
            para_ia: Se abrió Hábitos.
    HerramientaNoDisponible:
      description: No existe para el rol o su módulo está inactivo (mismo mensaje en todos los casos).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorHerramienta'
          example:
            mensaje: La herramienta «finanzas.abrir» no está disponible.
    Agregado:
      description: >-
        Agregado. Con `Prefer: return=representation` devuelve lo insertado; un reenvío
        idéntico desde la cola no inserta nada y devuelve una lista vacía.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    ReglaFinanzas:
      description: >-
        No cumple una regla: de la tabla (23514: monto, motivo, lunes, cascada…) o de
        negocio (22023: combinación de cuentas, libro equivocado, papel…).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: '22023'
            message: Solo una transferencia o un pago de deuda va de un libro a otro.
            details: null
            hint: null
    ConflictoFinanzas:
      description: >-
        23503: falta algo de lo que depende (otra cuenta, el original de una anulación; la
        cola reintenta cuando ya se subió). 23505: duplicado, o el mismo `id` con otro
        contenido (no se edita: se corrige con un registro nuevo).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: '23505'
            message: Ya existe el movimiento 3d0c2f5e-8a41-4b7e-9c1d-5f2a6b8e9a01 con otro contenido.
            details: null
            hint: 'No se edita: se corrige con un registro nuevo (anulación o versión siguiente).'
    EstadoFinanzas:
      description: >-
        55000: el registro no está en el estado que se necesita (cuenta congelada, cerrada o
        archivada; semana cerrada).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: '55000'
            message: >-
              Una de las cuentas no está activa (congelada, cerrada o archivada): no admite
              movimientos nuevos.
            details: null
            hint: null
    ReglaHabitos:
      description: >-
        No cumple una regla: de la tabla (23514: rangos, días, referencias, un tipo con su dato) o de negocio (22023: modo,
        revisión, cuota, alcance, versión de la llave).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: '22023'
            message: Volver a solo teléfono borra lo de la nube, pide confirmación.
            details: null
            hint: null
    ConflictoHabitos:
      description: >-
        23503: falta algo de lo que depende (un objetivo o bloque que aún no se sube; la cola reintenta). 23505: duplicado
        (un registro del mismo elemento y día, una revisión de la semana).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: '23505'
            message: duplicate key value violates unique constraint "hab_registros_un_elemento_por_dia"
            details: null
            hint: null
    ReglaCuidados:
      description: >-
        No cumple una regla: de la tabla (23514: rango del turno, largo de una nota, horas HH:MM, monto mayor que cero) o de
        negocio (22023: tipo de turno, estado de una toma, días a generar, texto del cambio urgente).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: '22023'
            message: El cambio urgente lleva de 1 a 200 caracteres.
            details: null
            hint: null
    ConflictoCuidados:
      description: >-
        23505: duplicado (el mismo `id` con otro contenido, un turno o una toma repetidos). 23503: falta algo de lo que depende
        (la cola reintenta).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: '23505'
            message: duplicate key value violates unique constraint "cui_tomas_una_por_hora"
            details: null
            hint: null
    Actualizado:
      description: Registros actualizados (con `Prefer` igual a `return=representation`).
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    SinSesion:
      description: Falta la sesión o la llave pública.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: PGRST301
            message: JWT expired
            details: null
            hint: null
    Prohibido:
      description: Las reglas del servidor (RLS) no lo permiten para tu rol.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: '42501'
            message: new row violates row-level security policy
            details: null
            hint: null
    Invalido:
      description: Datos no válidos (p. ej. invitación vencida o ya usada).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPostgrest'
          example:
            code: '22023'
            message: La invitación no es válida o ya expiró.
            details: null
            hint: null

  schemas:
    Uuid:
      type: string
      format: uuid
    Rol:
      type: string
      enum: [dueno, coadministrador, familiar, cuidador, casa]
    RolInvitable:
      type: string
      description: Cualquier rol menos dueño.
      enum: [coadministrador, familiar, cuidador, casa]
    Modulo:
      type: string
      enum: [gravity, finanzas, habitos, cuidados, alimentacion, casa, ajustes]
    Accion:
      type: string
      enum: [leer, escribir, administrar]
    Alcance:
      type: string
      enum: [total, propio, restringido]
    Herramienta:
      type: object
      required: [nombre, descripcion, modulo, roles, escribe, solo_local]
      properties:
        nombre:
          type: string
          pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'
        descripcion:
          type: string
        modulo:
          $ref: '#/components/schemas/Modulo'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Rol'
        escribe:
          type: boolean
          description: Si escribe, pide confirmación.
        solo_local:
          type: boolean
          description: Si es solo local, su resultado nunca va a la IA en la nube.
        accion:
          $ref: '#/components/schemas/Accion'
          description: >-
            Lo que la persona debe poder hacer en el módulo para que se le ofrezca (abrir
            la hoja de un gasto exige escribir, aunque la que guarda es la hoja).
        pertenencia:
          type: string
          enum: [propia, ajena]
          description: >-
            Sobre qué datos actúa (D19). La cuenta maestra nunca recibe una que escriba o
            administre lo ajeno.
        ambito:
          type: string
          enum: [general, solicitudes]
          description: '`solicitudes`: la bandeja de la cuidadora (D18), lo único de GRAVITY que recibe.'
        hoja:
          type: [string, 'null']
          enum: [gasto, ingreso_extra, null]
          description: >-
            Hoja de registro que abre (la hoja es la confirmación); nula si abre una
            pantalla. Una cuenta maestra que no es la dueña no recibe ninguna herramienta con
            hoja (solo lectura total).
    PeticionHerramienta:
      type: object
      properties:
        parametros:
          type: object
          description: Parámetros de la herramienta (las de navegación no llevan).
        confirmado:
          type: boolean
          default: false
          description: Solo `true` después de que la persona aceptó la tarjeta de confirmación.
    ResultadoHerramienta:
      type: object
      required: [herramienta, contenido, requiere_confirmacion, solo_local, para_ia]
      properties:
        herramienta:
          type: string
        contenido:
          type: string
          description: Texto para la pantalla o la voz local.
        requiere_confirmacion:
          type: boolean
          description: Si es `true`, no se escribió nada; `contenido` es la tarjeta de confirmación.
        solo_local:
          type: boolean
        para_ia:
          type: [string, 'null']
          description: Lo mínimo que puede ver la IA. Siempre nulo si `solo_local`.
    ErrorHerramienta:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string
          examples:
            - La herramienta «finanzas.abrir» no está disponible.
    ErrorPostgrest:
      type: object
      properties:
        code:
          type: string
          examples: ['42501']
        message:
          type: string
        details:
          type: [string, 'null']
        hint:
          type: [string, 'null']
    Hogar:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
          maxLength: 80
        creado_en:
          type: string
          format: date-time
    Persona:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        usuario_id:
          type: [string, 'null']
          format: uuid
          description: Cuenta de Supabase; nulo si la cuenta se eliminó.
        nombre_visible:
          type: string
          maxLength: 80
        creado_en:
          type: string
          format: date-time
    Membresia:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        persona_id:
          $ref: '#/components/schemas/Uuid'
        rol:
          $ref: '#/components/schemas/Rol'
        activa:
          type: boolean
        desde:
          type: string
          format: date-time
        hasta:
          type: [string, 'null']
          format: date-time
        es_maestra:
          type: boolean
          readOnly: true
          description: >-
            Cuenta maestra del hogar (D19): una por hogar, solo dueño o coadministrador; la
            asigna el dueño con `asignar_cuenta_maestra`.
        creado_en:
          type: string
          format: date-time
    PermisoRol:
      type: object
      properties:
        rol:
          $ref: '#/components/schemas/Rol'
        modulo:
          $ref: '#/components/schemas/Modulo'
        accion:
          $ref: '#/components/schemas/Accion'
        alcance:
          $ref: '#/components/schemas/Alcance'
        nota:
          type: [string, 'null']
    Invitacion:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/RolInvitable'
        es_maestra:
          type: boolean
          default: false
          description: >-
            Invitación a la cuenta maestra (D19, 23/oct): solo con rol `coadministrador`; al
            aceptarla, la persona queda con la marca de cuenta maestra y sin libro personal.
        token_hash:
          type: string
          description: SHA-256 del token; el token no se guarda.
        expira_en:
          type: string
          format: date-time
        creada_por:
          type: [string, 'null']
          format: uuid
        creada_en:
          type: string
          format: date-time
        aceptada_en:
          type: [string, 'null']
          format: date-time
        aceptada_por:
          type: [string, 'null']
          format: uuid
        revocada_en:
          type: [string, 'null']
          format: date-time
    Dispositivo:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        persona_id:
          $ref: '#/components/schemas/Uuid'
        plataforma:
          type: string
          enum: [android, windows]
        token_avisos:
          type: [string, 'null']
          description: Token único global; se cambia solo con `registrarDispositivoRpc`.
        nombre:
          type: [string, 'null']
        tipo:
          type: string
          enum: [telefono, tablet_personal, tablet_publica, laptop]
        recibe_avisos:
          type: boolean
          description: El teléfono sí por omisión; tablet personal y laptop no; una tablet pública nunca.
        creado_en:
          type: string
          format: date-time
        ultimo_uso:
          type: string
          format: date-time
    EntradaBitacora:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          type: [string, 'null']
          format: uuid
        persona_id:
          type: [string, 'null']
          format: uuid
          description: Quién; lo pone el servidor. Nulo = sistema.
        accion:
          type: string
          description: >-
            Qué pasó, en minúsculas. `insertar`, `actualizar` y `borrar` solo las escriben
            los triggers que registran los cambios de las tablas. Las de Finanzas las
            escribe solo el servidor (I5): `finanzas.consulta_maestra` (la cuenta maestra
            consultó un libro ajeno; vale 30 minutos), `finanzas.maestra_asignada` (el dueño
            nombró o quitó la cuenta maestra, o se aceptó una invitación de cuenta maestra;
            `detalle` lleva `anterior_persona_id` y `nueva_persona_id` y, con invitación,
            `invitada_por`), `finanzas.salida_libro_representado` (una salida del libro de
            Papá hacia cualquier otro libro, personal o compartido; `detalle` lleva el libro
            de origen, el de destino, el tipo, la fecha, el monto en centavos,
            `en_nombre_de` y `motivo`) y `finanzas.albacea_nombrado` (el dueño nombró al
            albacea o al suplente del libro de Papá; `detalle` lleva `libro_id`,
            `persona_id`, `papel` y `anterior_persona_id`) y `finanzas.consulta_vista` (cada
            consulta del familiar con la vista temporal de Papá; `detalle` lleva solo
            `solicitud_id`).
          examples:
            - finanzas.consulta_maestra
            - finanzas.maestra_asignada
            - finanzas.salida_libro_representado
            - finanzas.albacea_nombrado
            - finanzas.consulta_vista
        tabla:
          type: [string, 'null']
        registro_id:
          type: [string, 'null']
        detalle:
          type: object
        ocurrido_en:
          type: string
          format: date-time
        registrado_en:
          type: string
          format: date-time
    # -------------------------------------------------------------------------
    # Finanzas (Fase 1, D19). Dinero en centavos; porcentajes en puntos base.
    # readOnly: lo pone el servidor (no se manda).
    # -------------------------------------------------------------------------
    Centavos:
      type: integer
      format: int64
      description: Dinero en centavos (MXN), entero. Nunca va a la IA en la nube (D3).
    CentavosPositivos:
      type: integer
      format: int64
      minimum: 1
      description: Dinero en centavos (MXN), mayor que cero.
    CentavosNoNegativos:
      type: integer
      format: int64
      minimum: 0
      description: Dinero en centavos (MXN), cero o más.
    PuntosBase:
      type: integer
      minimum: 0
      maximum: 10000
      description: Porcentaje en puntos base (2000 = 20.00 %).
    UuidONulo:
      type: [string, 'null']
      format: uuid
    FinNombre:
      type: string
      minLength: 1
      maxLength: 80
    FinPrioridad:
      type: string
      enum: [necesario, deseable, discrecional]
    FinReglaInhabil:
      type: string
      enum: [siguiente_dia_habil, dia_habil_anterior, sin_cambio]
      description: Qué hacer si un pago cae en sábado, domingo o día inhábil (D19, regla 5).
    FinFormaPago:
      type: string
      enum: [semanal, catorcenal, quincenal, mensual, cada_meses]
      description: >-
        semanal (`dia_semana`), catorcenal (`fecha_ancla`), quincenal (2 `dias_mes`), mensual
        (1 o más `dias_mes`, p. ej. `[1, 11]`) o cada_meses (`fecha_ancla` e `intervalo_meses`).
    FinFormaPagoONula:
      type: [string, 'null']
      enum: [semanal, catorcenal, quincenal, mensual, cada_meses, null]
      description: Calendario opcional (como `FinFormaPago`).
    FinFrecuencia:
      type: string
      enum: [semanal, catorcenal, quincenal, mensual, bimestral, trimestral, semestral, anual, diaria]
    FinModoArrastre:
      type: string
      enum: [arrastrar, al_remanente]
    FinDiaSemana:
      type: [integer, 'null']
      minimum: 1
      maximum: 7
      description: 1 = lunes … 7 = domingo.
    FinDiasMes:
      type: [array, 'null']
      items:
        type: integer
        minimum: 0
        maximum: 31
      minItems: 1
      maxItems: 31
      description: Días del mes (0 = último día), p. ej. `[1, 11]` o `[15, 0]`.
    FinIntervaloMeses:
      type: [integer, 'null']
      minimum: 1
      maximum: 12
    FinLibro:
      type: object
      description: >-
        Libro de Finanzas (D19): `personal` (lo crea el servidor al dar un rol con Finanzas),
        `compartido` (2 o más adultos) o `representado` (el de Papá, que llevan sus albaceas).
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          $ref: '#/components/schemas/FinNombre'
        tipo:
          type: string
          enum: [personal, compartido, representado]
        titular_id:
          $ref: '#/components/schemas/UuidONulo'
          description: Obligatorio en personal y representado; nulo en compartido.
        activo:
          type: boolean
          default: true
          description: >-
            `false` = archivado por su administrador (nunca ocurre solo): se lee y no
            registra movimientos nuevos.
        visibilidad:
          type: string
          enum: [privada, publica]
          default: privada
          description: >-
            Solo en los compartidos (en los demás, siempre `privada`). `privada`: leen y
            escriben sus miembros (la maestra lee con consulta). `publica`: además la leen,
            sin escribir, todos los adultos con Finanzas del hogar. La cambia solo quien
            creó el libro (42501). Pasa sola a `privada` cuando quedan menos de 2 miembros
            vigentes.
        creado_por:
          $ref: '#/components/schemas/UuidONulo'
          readOnly: true
          description: >-
            El administrador del libro (quien lo creó). La API no lo manda ni lo cambia
            (42501); el servidor lo pasa al miembro vigente más antiguo si el administrador se
            sale o deja de ser adulto con Finanzas, y al que queda si quedan menos de 2.
        creado_en:
          type: string
          format: date-time
          readOnly: true
    FinLibroMiembro:
      type: object
      description: Quién lleva cada libro. No se borra; se cierra `hasta`.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        libro_id:
          $ref: '#/components/schemas/Uuid'
        persona_id:
          $ref: '#/components/schemas/Uuid'
        papel:
          type: string
          enum: [titular, miembro, albacea, albacea_suplente]
        desde:
          type: string
          format: date-time
        hasta:
          type: [string, 'null']
          format: date-time
    FinCategoria:
      type: object
      description: Árbol de categorías del hogar (3 niveles, común a todos los libros).
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        padre_id:
          $ref: '#/components/schemas/UuidONulo'
          description: Nulo solo en el nivel 1.
        nivel:
          type: integer
          minimum: 1
          maximum: 3
        nombre:
          $ref: '#/components/schemas/FinNombre'
        icono:
          type: [string, 'null']
          maxLength: 64
        color:
          type: [string, 'null']
          maxLength: 32
        naturaleza:
          type: [string, 'null']
          maxLength: 40
          description: Texto de la plantilla (fija, variable, mixta, eventual…).
        prioridad:
          $ref: '#/components/schemas/FinPrioridad'
        protegida:
          type: boolean
        es_del_sistema:
          type: boolean
        oculta:
          type: boolean
        archivada:
          type: boolean
        posiblemente_deducible:
          type: boolean
        cuenta_gasto_id:
          $ref: '#/components/schemas/UuidONulo'
    FinCuenta:
      type: object
      description: >-
        Cuenta de un libro o, si es `de_gasto` o `gasto_financiero`, del hogar (`libro_id`
        nulo). Cerrar o archivar exige saldo cero solo en activos y pasivos (las de gasto e
        ingreso son de periodo); borrar solo sin movimientos.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        libro_id:
          $ref: '#/components/schemas/UuidONulo'
        nombre:
          $ref: '#/components/schemas/FinNombre'
        tipo:
          type: string
          enum: [efectivo, banco, ahorro, inversion, por_cobrar, tarjeta, prestamo, origen_ingreso,
                 de_gasto, gasto_financiero, por_clasificar, ajustes, apertura]
        clase:
          type: string
          enum: [activo, pasivo, ingreso, gasto, ajuste, apertura]
          readOnly: true
          description: Generada desde `tipo`.
        liquida:
          type: boolean
          readOnly: true
          description: Generada; efectivo y banco entran al "disponible".
        estado:
          type: string
          enum: [activa, congelada, cerrada, archivada]
          default: activa
        categoria_id:
          $ref: '#/components/schemas/UuidONulo'
          description: Solo en cuentas de gasto.
        limite_centavos:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Límite de una tarjeta, en centavos (opcional).
        creada_por:
          $ref: '#/components/schemas/UuidONulo'
          description: La app la puede mandar; el servidor la sobrescribe con la sesión.
        creada_en:
          type: string
          format: date-time
          readOnly: true
    FinParametros:
      type: object
      description: Parámetros de un libro (una fila por libro; porcentajes en puntos base).
      properties:
        libro_id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        meta_remanente_pb:
          $ref: '#/components/schemas/PuntosBase'
        ahorro_minimo_con_deuda_pb:
          $ref: '#/components/schemas/PuntosBase'
        tope_arrastre_semanas:
          type: integer
          minimum: 0
          maximum: 52
        partida_ambar_pb:
          type: integer
          minimum: 0
          maximum: 100000
        partida_rojo_pb:
          type: integer
          minimum: 0
          maximum: 100000
        remanente_verde_pb:
          $ref: '#/components/schemas/PuntosBase'
        remanente_ambar_pb:
          $ref: '#/components/schemas/PuntosBase'
        carga_ambar_pb:
          type: integer
          minimum: 0
          maximum: 100000
        carga_rojo_pb:
          type: integer
          minimum: 0
          maximum: 100000
        cumplimiento_verde_pb:
          $ref: '#/components/schemas/PuntosBase'
        cumplimiento_ambar_pb:
          $ref: '#/components/schemas/PuntosBase'
        cierre_automatico_dias:
          type: integer
          minimum: 1
          maximum: 30
        orden_ahorro:
          type: array
          items:
            type: string
            enum: [fondo_n1, reservas, metas_fecha, fondo_meta, metas_libres]
          description: Orden en que se reparte el ahorro (23514 si no es una permutación válida).
        dependientes_cuidados:
          type: boolean
          default: false
        esenciales_incluyen_minimos:
          type: boolean
          default: true
        dias_aviso_deuda:
          type: array
          items:
            type: integer
          default: [3, 1]
          description: Días antes del vencimiento en que avisa un pago próximo.
        cuenta_ajustes_id:
          $ref: '#/components/schemas/Uuid'
          readOnly: true
        cuenta_apertura_id:
          $ref: '#/components/schemas/Uuid'
          readOnly: true
        cuenta_por_clasificar_id:
          $ref: '#/components/schemas/Uuid'
          readOnly: true
    FinMovimiento:
      type: object
      description: >-
        Movimiento del libro **solo agregar** (partida doble simplificada). Se corrige con una
        anulación; nunca se edita ni se borra.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Generado en el dispositivo (la cola sin conexión reenvía el mismo).
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          type: string
          enum: [apertura, ingreso, gasto, reembolso, transferencia, pago_deuda, reclasificacion, ajuste,
                 anulacion]
        fecha:
          type: string
          format: date
          description: Fecha económica; define la semana.
        registrado_en:
          type: string
          format: date-time
          description: Cuándo se capturó, en el dispositivo. **Obligatorio.**
        recibido_en:
          type: string
          format: date-time
          readOnly: true
          description: Cuándo llegó al servidor; lo pone el servidor.
        cuenta_origen_id:
          $ref: '#/components/schemas/Uuid'
        cuenta_destino_id:
          $ref: '#/components/schemas/Uuid'
          description: Distinta de la de origen.
        libro_origen_id:
          $ref: '#/components/schemas/UuidONulo'
          readOnly: true
          description: Libro de la cuenta de origen; lo pone el servidor.
        libro_destino_id:
          $ref: '#/components/schemas/UuidONulo'
          readOnly: true
          description: Libro de la cuenta de destino; lo pone el servidor.
        monto_centavos:
          $ref: '#/components/schemas/CentavosPositivos'
        categoria_id:
          $ref: '#/components/schemas/UuidONulo'
        grupo_id:
          $ref: '#/components/schemas/UuidONulo'
          description: Agrupa un ticket dividido o capital más intereses.
        realizado_por:
          $ref: '#/components/schemas/Uuid'
          description: Por omisión, la sesión.
        registrado_por:
          $ref: '#/components/schemas/Uuid'
          description: Por omisión, la sesión; siempre la sesión (nadie registra a nombre de otro).
        en_nombre_de:
          $ref: '#/components/schemas/UuidONulo'
          description: >-
            Persona representada (Papá). Obligatoria, junto con `motivo`, en todo movimiento
            que toque el libro de Papá (23514, I3); es el titular de ese libro.
        via:
          type: string
          enum: [manual, voz, imagen, qr, importacion]
          default: manual
        nota:
          type: [string, 'null']
          maxLength: 200
        motivo:
          type: [string, 'null']
          maxLength: 200
          description: >-
            Obligatorio en `ajuste`, `anulacion` y con `en_nombre_de`, y en todo movimiento
            del libro de Papá: al menos 3 caracteres visibles, sin contar espacios, saltos de
            línea ni caracteres invisibles (23514, N2).
        anula_a:
          $ref: '#/components/schemas/UuidONulo'
          description: Solo en `anulacion`; cada movimiento tiene a lo más una.
        estado_inicial:
          type: string
          enum: [confirmado, pendiente]
          default: confirmado
    FinIngreso:
      type: object
      description: Ingreso recurrente de un libro (por persona).
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hogar_id:
          $ref: '#/components/schemas/Uuid'
        libro_id:
          $ref: '#/components/schemas/Uuid'
        persona_id:
