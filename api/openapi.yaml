              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                plataforma:
                  type: string
                  enum: [android, windows]
                token_avisos:
                  type: [string, 'null']
                  maxLength: 4096
                nombre:
                  type: [string, 'null']
                  maxLength: 80
      responses:
        '201':
          description: Registrado.
        '403':
          $ref: '#/components/responses/Prohibido'
    patch:
      tags: [Base de datos]
      operationId: actualizarDispositivo
      summary: Actualizar mi dispositivo
      description: Token de avisos, nombre o último uso; solo los tuyos.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/filtroIdObligatorio'
        - $ref: '#/components/parameters/preferir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                token_avisos:
                  type: [string, 'null']
                  maxLength: 4096
                nombre:
                  type: [string, 'null']
                  maxLength: 80
                ultimo_uso:
                  type: string
                  format: date-time
      responses:
        '200':
          $ref: '#/components/responses/Actualizado'
        '204':
          description: Actualizado (sin cuerpo).
        '403':
          $ref: '#/components/responses/Prohibido'
    delete:
      tags: [Base de datos]
      operationId: quitarDispositivo
      summary: Quitar mi dispositivo
      description: Deja de recibir avisos en ese dispositivo; solo los tuyos.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/filtroIdObligatorio'
      responses:
        '204':
          description: Quitado.
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/bitacora:
    get:
      tags: [Base de datos]
      operationId: leerBitacora
      summary: Leer la bitácora
      description: El dueño ve la de su hogar; cada quien ve lo que hizo. Solo agregar.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: false
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/filtroHogar'
        - $ref: '#/components/parameters/orden'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Entradas visibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntradaBitacora'
        '401':
          $ref: '#/components/responses/SinSesion'
    post:
      tags: [Base de datos]
      operationId: agregarABitacora
      summary: Agregar a la bitácora
      description: >-
        Cualquier miembro agrega a su nombre (p. ej. acciones de GRAVITY en la laptop, D8).
        No se edita ni se borra: se corrige con una entrada nueva. `accion` es un
        identificador en minúsculas (`^[a-z][a-z0-9_.]*$`, hasta 60 caracteres), p. ej.
        `entrega_de_turno` o `gravity.abrir`; si no cumple, responde 400 (código 23514).
        Las acciones `insertar`, `actualizar` y `borrar` están reservadas a los triggers
        que registran los cambios de las tablas: nadie puede fabricar una entrada que
        parezca un cambio automático, y responde 403 (código 42501).
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/preferir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                hogar_id:
                  $ref: '#/components/schemas/Uuid'
                accion:
                  type: string
                  minLength: 1
                  maxLength: 60
                  pattern: '^[a-z][a-z0-9_.]*$'
                  not:
                    enum: [insertar, actualizar, borrar]
                  description: >-
                    Identificador en minúsculas (letras, dígitos, `_` y `.`). `insertar`,
                    `actualizar` y `borrar` están reservadas a los triggers (403, código
                    42501).
                  examples: [entrega_de_turno, gravity.abrir]
                tabla:
                  type: string
                  maxLength: 63
                registro_id:
                  type: string
                  maxLength: 200
                detalle:
                  type: object
                ocurrido_en:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Agregada.
        '400':
          description: >-
            `accion` no cumple el formato `^[a-z][a-z0-9_.]*$` o pasa de 60 caracteres
            (restricción del servidor, código 23514).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPostgrest'
              example:
                code: '23514'
                message: >-
                  new row for relation "bitacora" violates check constraint
                  "bitacora_accion_check"
                details: null
                hint: null
        '403':
          description: >-
            Las reglas del servidor no lo permiten: la acción es `insertar`, `actualizar`
            o `borrar` (reservadas a los triggers), la entrada va a nombre de otra persona,
            el hogar no es tuyo o `ocurrido_en` pasa de 10 minutos en el futuro (código 42501).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPostgrest'
              example:
                code: '42501'
                message: new row violates row-level security policy for table "bitacora"
                details: null
                hint: null
  /rest/v1/finanzas_muestra:
    get:
      tags: [Base de datos]
      operationId: leerFinanzasMuestra
      summary: Leer la muestra de Finanzas
      description: >-
        Tabla de muestra de la Fase 0 para comprobar la regla del dinero: dueño y
        coadministrador leen; familiar, cuidador y casa no ven nada. Se reemplaza en la
        Fase 1. Montos en centavos.
      x-roles: [dueno, coadministrador]
      x-escribe: false
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/filtroHogar'
      responses:
        '200':
          description: Movimientos de muestra.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovimientoMuestra'
        '401':
          $ref: '#/components/responses/SinSesion'
    post:
      tags: [Base de datos]
      operationId: agregarFinanzasMuestra
      summary: Agregar a la muestra de Finanzas
      description: Solo el dueño. Monto en centavos (entero).
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/preferir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hogar_id, descripcion, monto_centavos]
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                hogar_id:
                  $ref: '#/components/schemas/Uuid'
                descripcion:
                  type: string
                  minLength: 1
                  maxLength: 200
                monto_centavos:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Agregado.
        '403':
          $ref: '#/components/responses/Prohibido'
    patch:
      tags: [Base de datos]
      operationId: cambiarFinanzasMuestra
      summary: Cambiar un registro de la muestra
      description: Solo el dueño; solo existe en la muestra. En la Fase 1 los movimientos serán solo-agregar.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/filtroIdObligatorio'
        - $ref: '#/components/parameters/preferir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                descripcion:
                  type: string
                  minLength: 1
                  maxLength: 200
                monto_centavos:
                  type: integer
                  format: int64
      responses:
        '200':
          $ref: '#/components/responses/Actualizado'
        '204':
          description: Actualizado (sin cuerpo).
        '403':
          $ref: '#/components/responses/Prohibido'
    delete:
      tags: [Base de datos]
      operationId: borrarFinanzasMuestra
      summary: Borrar un registro de la muestra
      description: Solo el dueño; solo existe en la muestra. En la Fase 1 los movimientos no se borran.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/filtroIdObligatorio'
      responses:
        '204':
          description: Borrado.
        '403':
          $ref: '#/components/responses/Prohibido'

  # ---------------------------------------------------------------------------
  # Funciones del servidor (Fase 2 en adelante)
  # ---------------------------------------------------------------------------
  /functions/v1/avisos:
    post:
      tags: [Funciones del servidor]
      operationId: enviarAviso
      summary: Enviar un aviso al instante (Fase 2)
      description: >-
        Propuesta. Envía una notificación (FCM) a los dispositivos de las personas indicadas,
        p. ej. una alerta de vencimiento o, en la Fase 5, un cambio urgente de medicamento a
        la cuidadora de turno. El texto es discreto: sin montos ni nombres de medicamentos.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Aviso'
      responses:
        '202':
          description: Aviso en camino.
        '403':
          $ref: '#/components/responses/Prohibido'
  /functions/v1/ia:
    post:
      tags: [Funciones del servidor]
      operationId: preguntarIa
      summary: Intermediario de la IA (Fase 6)
      description: >-
        Propuesta. Guarda la clave de la API de IA en el servidor (nunca en la app). Recibe
        solo la pregunta y las herramientas del rol, y responde qué herramienta usar. Nunca
        recibe resultados de herramientas solo locales (D3). Proveedor por decidir.
      x-roles: [dueno, coadministrador, familiar, cuidador]
      x-escribe: false
      x-solo-local: false
      x-fase: 6
      requestBody:
        required: true
