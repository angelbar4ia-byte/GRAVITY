  /rest/v1/rpc/crear_invitacion:
    post:
      tags: [Base de datos]
      operationId: crearInvitacion
      summary: Invitar a una persona
      description: >-
        Solo el dueño. Rol: coadministrador, familiar, cuidador o casa. Devuelve el token una
        sola vez; las invitaciones pendientes al mismo correo se revocan. Con
        `p_es_maestra: true` (D19, 23/oct) invita a la **cuenta maestra**: otra persona con
        su propio login. El rol debe ser `coadministrador` y el correo no puede ser el de un
        miembro vigente del hogar (400, 22023). Al aceptarla, la persona queda
        coadministrador con la marca de cuenta maestra, sin libro personal y de solo lectura
        total en Finanzas. Se llama igual con 3 o 4 parámetros: `p_vigencia_dias` y
        `p_es_maestra` son opcionales.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_hogar_id, p_correo, p_rol]
              properties:
                p_hogar_id:
                  $ref: '#/components/schemas/Uuid'
                p_correo:
                  type: string
                  format: email
                  maxLength: 254
                p_rol:
                  $ref: '#/components/schemas/RolInvitable'
                p_vigencia_dias:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 7
                p_es_maestra:
                  type: boolean
                  default: false
                  description: >-
                    Invitar a la cuenta maestra (solo con rol `coadministrador` y un correo
                    que no sea de un miembro del hogar).
            examples:
              maestra:
                summary: Invitar a la cuenta maestra (otra persona, con otro correo)
                value:
                  p_hogar_id: b0000000-0000-4000-8000-000000000001
                  p_correo: marta@ejemplo.test
                  p_rol: coadministrador
                  p_es_maestra: true
              coadministrador:
                summary: Invitar a la pareja
                value:
                  p_hogar_id: b0000000-0000-4000-8000-000000000001
                  p_correo: alex@ejemplo.test
                  p_rol: coadministrador
      responses:
        '200':
          description: La invitación y su token (se muestra una sola vez).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    invitacion_id:
                      $ref: '#/components/schemas/Uuid'
                    token:
                      type: string
                    expira:
                      type: string
                      format: date-time
        '400':
          $ref: '#/components/responses/Invalido'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/aceptar_invitacion:
    post:
      tags: [Base de datos]
      operationId: aceptarInvitacion
      summary: Aceptar una invitación
      description: >-
        La acepta la persona cuyo correo confirmado coincide; crea su membresía con el rol
        invitado. Devuelve el `id` del hogar. Si la invitación era de cuenta maestra
        (`es_maestra`), la membresía nace con `es_maestra` y sin libro personal; la maestra
        anterior, si la había, deja de serlo, y queda la entrada `finanzas.maestra_asignada`
        en la bitácora (con `anterior_persona_id`, `nueva_persona_id` e `invitada_por`).
      x-roles: [coadministrador, familiar, cuidador, casa]
      x-escribe: true
      x-solo-local: true
