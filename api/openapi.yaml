        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Movimientos visibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinMovimiento'
        '401':
          $ref: '#/components/responses/SinSesion'
    post:
      tags: [Base de datos · Finanzas]
      operationId: registrarMovimiento
      summary: Registrar un movimiento (solo agregar)
      description: >-
        Libro **solo agregar** (sección 4.3): no se edita ni se borra; un error se corrige
        con una `anulacion` (contraasiento: `anula_a`, mismo monto con origen y destino
        invertidos y `motivo`). Hay que poder escribir en cada libro que toca (`fin_puede`)
        y siempre a nombre propio. `registrado_en` es **obligatorio** (cuándo se capturó; si
        faltara, cada reenvío sería distinto). No mandes `recibido_en`, `libro_origen_id` ni
        `libro_destino_id`: los pone el servidor (sin permiso de columna, 42501). En el libro
        de Papá (`representado`) **todo** movimiento, también una anulación, lleva
        `en_nombre_de` (su titular) y `motivo`; si falta alguno, 400 (23514, I3). El `motivo`
        (el del libro de Papá, el de una anulación, un ajuste o un movimiento en nombre de
        otra persona) necesita al menos 3 caracteres visibles: los espacios, tabuladores,
        saltos de línea, espacios Unicode y caracteres invisibles no cuentan (400, 23514,
        N2). Lo registra el albacea, que es vigente solo si sigue siendo adulto con Finanzas
        (I4); si no, escribe el suplente. Una salida del libro de Papá hacia cualquier otro
        libro, personal o compartido (`transferencia` o `pago_deuda`), deja además la
        entrada `finanzas.salida_libro_representado` en la bitácora, visible para quienes
        llevan el libro (un gasto de Papá a una cuenta de gasto del hogar no es una salida
        de libro). Un libro archivado (`fin_libros.activo` = `false`) rechaza
        los movimientos nuevos, y la cuenta maestra que no es la dueña no registra nada: en
        ambos casos 403 (42501). La anulación acepta cuentas de gasto o ingreso archivadas
        (se archivan con saldo); en activos y pasivos cerrados o archivados, no (500, 55000).
        Solo `transferencia` y `pago_deuda` (y su anulación) cruzan de un libro a otro. Reenviar el mismo `id` con
        el mismo contenido no hace nada (0 filas, sin error); con otro contenido, 409
        (23505). GRAVITY nunca llama esta operación por su cuenta: la persona confirma en la
        hoja de registro (D3).
      x-roles: [dueno, coadministrador]
      x-escribe: true
      x-solo-local: true
      x-fase: 1
      parameters:
        - $ref: '#/components/parameters/alConflicto'
        - $ref: '#/components/parameters/preferirAlSubir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FinMovimiento'
                - required: [id, hogar_id, tipo, fecha, registrado_en, cuenta_origen_id, cuenta_destino_id, monto_centavos]
            examples:
              gasto:
                summary: Gasto con la tarjeta del banco ($123.50)
                value:
                  id: 3d0c2f5e-8a41-4b7e-9c1d-5f2a6b8e9a01
                  hogar_id: b0000000-0000-4000-8000-000000000001
                  tipo: gasto
                  fecha: '2026-10-21'
                  registrado_en: '2026-10-21T19:42:10-06:00'
                  cuenta_origen_id: c3000000-0000-4000-8000-000000000001
                  cuenta_destino_id: c2000000-0000-4000-8000-000000000003
                  monto_centavos: 12350
                  categoria_id: c1000000-0000-4000-8000-000000000012
                  via: manual
                  nota: Mercado (ejemplo)
              anulacion:
                summary: Anulación del gasto anterior (contraasiento)
                value:
                  id: 3d0c2f5e-8a41-4b7e-9c1d-5f2a6b8e9a02
                  hogar_id: b0000000-0000-4000-8000-000000000001
                  tipo: anulacion
                  fecha: '2026-10-21'
                  registrado_en: '2026-10-21T19:43:00-06:00'
                  cuenta_origen_id: c2000000-0000-4000-8000-000000000003
                  cuenta_destino_id: c3000000-0000-4000-8000-000000000001
                  monto_centavos: 12350
                  anula_a: 3d0c2f5e-8a41-4b7e-9c1d-5f2a6b8e9a01
                  motivo: Deshecho al capturar
              albacea:
                summary: La albacea paga la luz en nombre de Papá
                value:
                  id: 3d0c2f5e-8a41-4b7e-9c1d-5f2a6b8e9a03
                  hogar_id: b0000000-0000-4000-8000-000000000001
                  tipo: gasto
                  fecha: '2026-10-20'
                  registrado_en: '2026-10-20T10:05:00-06:00'
                  cuenta_origen_id: c3000000-0000-4000-8000-000000000030
                  cuenta_destino_id: c2000000-0000-4000-8000-000000000005
                  monto_centavos: 48000
                  en_nombre_de: e0000000-0000-4000-8000-000000000009
                  motivo: Recibo de luz de Papá (ejemplo)
              salida:
                summary: Salida del libro de Papá a un libro personal (queda en la bitácora)
                value:
                  id: 3d0c2f5e-8a41-4b7e-9c1d-5f2a6b8e9a05
                  hogar_id: b0000000-0000-4000-8000-000000000001
                  tipo: transferencia
