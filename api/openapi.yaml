                  programado_para: '2026-11-02T09:00:00-06:00'
                  enviar_en: '2026-11-02T09:00:00-06:00'
                  estado: enviada
                  creado_en: '2026-11-02T08:00:00-06:00'
        '401':
          $ref: '#/components/responses/SinSesion'
  /rest/v1/avisos_preferencias:
