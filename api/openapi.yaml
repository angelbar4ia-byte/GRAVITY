      operationId: leerMembresias
      summary: Leer membresías y roles
      description: >-
        Cada quien ve las suyas; el dueño, las de su hogar. `es_maestra` dice cuál es la
        cuenta maestra (D19); para mostrarla a todos en Ajustes › Privacidad se usa
        `cuenta_maestra`.
