  /rest/v1/bitacora:
    get:
      tags: [Base de datos]
      operationId: leerBitacora
      summary: Leer la bitácora
      description: >-
        Solo agregar. Cada quien ve lo que hizo. El historial de GRAVITY (`gravity.*`): su
        autor, también para el dueño (D18), y la cuenta maestra. Lo de Finanzas (tablas
        `fin_*` y acciones `finanzas*`): quien puede leer el libro de la entrada (la cuenta
        maestra solo con una consulta vigente, I2) o, si es del hogar, quien tiene Finanzas.
        Lo demás (membresías, invitaciones…): el dueño y la cuenta maestra. Las acciones que
        el servidor deja en Finanzas son `finanzas.consulta_maestra` (cada consulta de la
        maestra a un libro ajeno, visible para quienes lo llevan), `finanzas.maestra_asignada`
        (quién es la maestra, visible para todo adulto con Finanzas),
        `finanzas.salida_libro_representado` (una salida del libro de Papá hacia cualquier
        otro libro, personal o compartido, visible para quienes lo llevan),
        `finanzas.albacea_nombrado` (el dueño nombró al albacea o al suplente del libro de
        Papá, visible para quienes lo llevan) y `finanzas.consulta_vista` (cada consulta del
        familiar con la vista temporal de Papá, D24; solo quién y cuándo, sin montos ni cuentas).
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: false
      x-solo-local: true
      x-fase: 0
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/filtroHogar'
        - $ref: '#/components/parameters/orden'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Entradas visibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntradaBitacora'
