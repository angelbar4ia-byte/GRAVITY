  /rest/v1/fin_libros:
    get:
      tags: [Base de datos · Finanzas]
      operationId: leerLibrosFinanzas
      summary: Leer libros
      description: >-
        Tu libro personal, los compartidos de los que eres miembro y, si eres albacea, el de
        Papá (D19). Un compartido `publica` lo leen (no lo escriben) todos los adultos con
        Finanzas del hogar; uno `privada` (por omisión), solo sus miembros: el dueño no
        entra a un compartido privado del que no es miembro. Un libro archivado
        (`activo: false`) sigue en la lista, de solo lectura. La cuenta maestra ve la
        **portada** de todos los libros del hogar (el libro y quién lo lleva) sin consulta,
        para elegir cuál mirar; su contenido exige una consulta registrada
        (`fin_registrar_consulta_maestra`, I2). El libro personal lo crea el servidor al
        dar un rol con Finanzas (la maestra no lleva uno): la app lo busca
        (`tipo=eq.personal` y `titular_id` = su persona), no lo crea.
      x-roles: [dueno, coadministrador]
      x-escribe: false
      x-solo-local: true
      x-fase: 1
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/filtroId'
        - $ref: '#/components/parameters/filtroHogar'
      responses:
        '200':
          description: Libros que puedes leer.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinLibro'
              example:
                - id: f1000000-0000-4000-8000-000000000001
                  hogar_id: b0000000-0000-4000-8000-000000000001
                  nombre: Gastos de la casa
                  tipo: compartido
                  titular_id: null
                  activo: true
                  visibilidad: privada
                - id: f1000000-0000-4000-8000-000000000002
                  hogar_id: b0000000-0000-4000-8000-000000000001
                  nombre: Papá (ejemplo)
                  tipo: representado
                  titular_id: e0000000-0000-4000-8000-000000000009
                  activo: true
        '401':
          $ref: '#/components/responses/SinSesion'
    post:
      tags: [Base de datos · Finanzas]
      operationId: crearLibroCompartido
      summary: Crear un libro compartido
      description: >-
        Cualquier adulto con Finanzas crea un libro `compartido` (p. ej. "Gastos de la
        casa") y queda como su miembro y su **administrador** (`creado_por`); luego agrega a
        los demás en `fin_libro_miembros`. Todo nace `privada` (por omisión); `visibilidad`
        solo existe en los compartidos y se puede crear ya `publica`. El personal lo crea el
        servidor y el representado (Papá), `fin_crear_libro_representado`. `creado_por` y
        `creado_en` los pone el servidor: mandar `creado_por` responde 403 (42501). La
        cuenta maestra que no es la dueña no crea libros (solo lectura total, 403, 42501).
      x-roles: [dueno, coadministrador]
      x-escribe: true
      x-solo-local: true
      x-fase: 1
      parameters:
        - $ref: '#/components/parameters/alConflicto'
        - $ref: '#/components/parameters/preferirAlSubir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FinLibro'
                - required: [id, hogar_id, nombre, tipo]
            examples:
              compartido:
                summary: Gastos de la casa (Ana y Alex), privado por omisión
                value:
                  id: f1000000-0000-4000-8000-000000000001
                  hogar_id: b0000000-0000-4000-8000-000000000001
                  nombre: Gastos de la casa
                  tipo: compartido
              publico:
                summary: Un compartido público (los adultos con Finanzas lo leen)
                value:
                  id: f1000000-0000-4000-8000-000000000004
                  hogar_id: b0000000-0000-4000-8000-000000000001
                  nombre: Vacaciones (ejemplo)
                  tipo: compartido
                  visibilidad: publica
      responses:
        '201':
          $ref: '#/components/responses/Agregado'
        '400':
          $ref: '#/components/responses/ReglaFinanzas'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/ConflictoFinanzas'
    patch:
      tags: [Base de datos · Finanzas]
      operationId: cambiarLibroFinanzas
      summary: Cambiar el nombre, la visibilidad o archivar un libro
      description: >-
        Quien lo administra (titular de un personal, miembro de un compartido, albacea de un
        representado). Se cambian `nombre`, `activo` y, en un compartido, `visibilidad`;
        `tipo`, `titular_id`, `creado_por` y las llaves no cambian (42501). En un compartido,
        solo quien lo creó cambia la `visibilidad`, lo archiva (`activo: false`) o lo
        reactiva (`activo: true`); a otro miembro responde 403 (42501). Archivar es solo la
        decisión explícita del administrador y nunca ocurre solo: cuando quedan menos de 2
        miembros el libro pasa a `privada` y sigue activo (ver `cambiarMiembroLibro`).
        Reactivarlo no exige 2 miembros. Un libro archivado es de solo lectura: se lee y ya
        no admite movimientos nuevos y, mientras lo está, solo su administrador lo
        administra.
      x-roles: [dueno, coadministrador]
      x-escribe: true
      x-solo-local: true
      x-fase: 1
      parameters:
        - $ref: '#/components/parameters/filtroIdObligatorio'
        - $ref: '#/components/parameters/preferir'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FinLibro'
                - minProperties: 1
            examples:
              publicar:
                summary: Hacer público un compartido (solo su administrador)
                value:
                  visibilidad: publica
              archivar:
                summary: Archivar el libro (solo lectura)
                value:
                  activo: false
      responses:
        '200':
          $ref: '#/components/responses/Actualizado'
        '204':
          description: Actualizado (sin cuerpo).
        '400':
          $ref: '#/components/responses/ReglaFinanzas'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/ConflictoFinanzas'
