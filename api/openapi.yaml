  # Avisos y dispositivos (Fase 2, D20): 20261102000000_avisos.sql
  # ---------------------------------------------------------------------------
  /rest/v1/avisos:
    get:
      tags: [Base de datos]
      operationId: leerAvisos
      summary: Leer mis avisos
      description: >-
