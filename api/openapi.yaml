        hogar_id: {$ref: '#/components/schemas/Uuid', readOnly: true, description: 'Lo pone el servidor.'}
        persona_id: {$ref: '#/components/schemas/Uuid', readOnly: true, description: 'La pone el servidor: es tu persona.'}
        semana: {type: string, format: date, description: Lunes.}
        estado: {type: string, enum: [pendiente, en_curso, completada, omitida], default: pendiente}
        programada_para: {type: [string, 'null'], format: date-time}
        completada_en: {type: [string, 'null'], format: date-time}
        resumen: {type: [object, 'null'], description: 'Hasta 8 KB.'}
        ajustes: {type: [object, 'null'], description: 'Hasta 8 KB.'}
        dar_cumplido: {type: [boolean, 'null']}
        modificado_en: {type: string, format: date-time, description: 'Último cambio gana: un UPDATE con modificado_en más viejo se ignora sin error; uno a más de 5 minutos en el futuro se ajusta a la hora del servidor.'}
        actualizado_en: {type: string, format: date-time, readOnly: true, description: 'Lo pone el servidor.'}
    HabSobre:
      type: object
      description: Sobre cifrado (AES-256-GCM hecho en el teléfono). El servidor solo ve el tipo, la revisión y el tamaño.
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: Opaco (HMAC en el teléfono).}
        hogar_id: {$ref: '#/components/schemas/Uuid', readOnly: true, description: 'Lo pone el servidor.'}
        persona_id: {$ref: '#/components/schemas/Uuid', readOnly: true, description: 'La pone el servidor: es tu persona.'}
        tipo: {type: string, enum: [habitos_sensibles, diario_oracion]}
        revision: {type: integer, minimum: 1}
        cifrado: {type: string, minLength: 1, maxLength: 87400, pattern: '^[A-Za-z0-9_-]+$', description: Hasta 64 KB.}
        llave_version: {type: integer, minimum: 1}
        eliminado: {type: boolean}
        creado_en: {type: string, format: date-time, readOnly: true, description: 'Lo pone el servidor.'}
        actualizado_en: {type: string, format: date-time, readOnly: true, description: 'Lo pone el servidor.'}
    HabSobreSubida:
      type: object
      description: Un sobre al subirlo con `habSubirSobres`.
      required: [id, tipo, revision, cifrado, llave_version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        tipo: {type: string, enum: [habitos_sensibles, diario_oracion]}
        revision: {type: integer, minimum: 1}
        cifrado: {type: string, minLength: 1, maxLength: 87400, pattern: '^[A-Za-z0-9_-]+$'}
        llave_version: {type: integer, minimum: 1}
        eliminado: {type: boolean, default: false}
    HabResultadoSubida:
      type: object
      description: Resultado de `habSubirSobres`.
      properties:
        aceptados: {type: integer, minimum: 0}
        conflictos: {type: array, items: {type: object, properties: {id: {$ref: '#/components/schemas/Uuid'}, revision: {type: integer, description: La revisión que ya tiene el servidor.}}}}
    HabLlave:
      type: object
      description: La llave maestra envuelta con la frase de recuperación; el servidor no puede abrirla.
      properties:
        persona_id: {$ref: '#/components/schemas/Uuid', readOnly: true, description: 'La pone el servidor: es tu persona.'}
        hogar_id: {$ref: '#/components/schemas/Uuid', readOnly: true, description: 'Lo pone el servidor.'}
        version: {type: integer, minimum: 1}
        kdf: {type: string, enum: [pbkdf2-hmac-sha256, argon2id]}
        kdf_params: {type: object, description: Hasta 1 KB.}
        sal: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_=+/-]+$'}
        llave_envuelta: {type: string, minLength: 16, maxLength: 512, pattern: '^[A-Za-z0-9_=+/-]+$'}
        creado_en: {type: string, format: date-time, readOnly: true, description: 'Lo pone el servidor.'}
        rotada_en: {type: [string, 'null'], format: date-time}
    PreguntaIa:
      type: object
      description: Propuesta (Fase 6). Sin nombres, montos ni datos clínicos.
      required: [pregunta, herramientas]
      properties:
        pregunta:
          type: string
          maxLength: 500
        herramientas:
          type: array
          items:
            $ref: '#/components/schemas/Herramienta'
    RespuestaIa:
      type: object
      description: Propuesta (Fase 6).
      properties:
        herramienta:
          type: [string, 'null']
        parametros:
          type: object
        texto:
          type: [string, 'null']
    FraseBocina:
      type: object
      required: [entity_id, media_player_entity_id, message]
      properties:
        entity_id:
          type: string
          description: Motor de voz de Home Assistant.
        media_player_entity_id:
          type: string
          description: Bocina.
        message:
          type: string
          maxLength: 200
          description: Frase genérica, sin dinero ni datos clínicos.
        language:
          type: string
          default: es-MX

    CuiTurno:
      type: object
      description: Turno semanal de cuidado (minutos desde medianoche en la zona del hogar; no cruza la medianoche).
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        hogar_id: {$ref: '#/components/schemas/Uuid'}
        persona_id: {$ref: '#/components/schemas/Uuid'}
        dia_semana: {type: integer, minimum: 1, maximum: 7, description: '1 = lunes … 7 = domingo.'}
        inicio_min: {type: integer, minimum: 0, maximum: 1439}
        fin_min: {type: integer, minimum: 1, maximum: 1440, description: 'Mayor que inicio_min.'}
        tipo: {type: string, enum: [cuidadora, dueno, hermana_visita]}
    CuiMedicamento:
      type: object
      description: Medicamento de Papá (dato clínico, D3).
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        hogar_id: {$ref: '#/components/schemas/Uuid'}
        nombre: {type: string, minLength: 1, maxLength: 80}
        dosis: {type: [string, 'null'], maxLength: 80}
        horas: {type: array, minItems: 1, maxItems: 12, items: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}}
        notas: {type: [string, 'null'], maxLength: 500}
        activo: {type: boolean, default: true}
    CuiToma:
      type: object
      description: Una toma programada. Solo la cambia cuiMarcarToma.
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        hogar_id: {$ref: '#/components/schemas/Uuid'}
        medicamento_id: {$ref: '#/components/schemas/Uuid'}
        programada_para: {type: string, format: date-time}
        estado: {type: string, enum: [pendiente, dado, no_dado], readOnly: true}
        marcada_por: {$ref: '#/components/schemas/UuidONulo', readOnly: true}
        marcada_en: {type: [string, 'null'], format: date-time, readOnly: true}
    CuiComida:
      type: object
      description: Comida de Papá (solo agregar; la corrección es una fila nueva).
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        hogar_id: {$ref: '#/components/schemas/Uuid'}
        fecha: {type: string, format: date}
        tiempo: {type: string, enum: [desayuno, comida, cena, colacion]}
        resultado: {type: string, enum: [comio, comio_poco, rechazo]}
        registrada_por: {$ref: '#/components/schemas/Uuid', readOnly: true, description: 'La pone el servidor: es tu persona.'}
        registrada_en: {type: string, format: date-time, readOnly: true, description: 'Lo pone el servidor.'}
    CuiNota:
      type: object
      description: Nota de la bitácora de cuidados (solo agregar).
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        hogar_id: {$ref: '#/components/schemas/Uuid'}
        persona_id: {$ref: '#/components/schemas/Uuid', readOnly: true, description: 'La pone el servidor: es tu persona.'}
        nota: {type: string, minLength: 1, maxLength: 500}
        creada_en: {type: string, format: date-time, readOnly: true, description: 'Lo pone el servidor.'}
    CuiEntrega:
      type: object
      description: Entrega de turno (solo agregar).
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        hogar_id: {$ref: '#/components/schemas/Uuid'}
        de_persona: {$ref: '#/components/schemas/Uuid', readOnly: true, description: 'La pone el servidor: es tu persona.'}
        para_persona: {$ref: '#/components/schemas/Uuid'}
        nota: {type: string, minLength: 1, maxLength: 500}
        creada_en: {type: string, format: date-time, readOnly: true, description: 'Lo pone el servidor.'}
    CuiCambioUrgente:
      type: object
      description: Cambio urgente del dueño. Se crea con cuiCrearCambioUrgente.
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        hogar_id: {$ref: '#/components/schemas/Uuid'}
        de_persona: {$ref: '#/components/schemas/Uuid'}
        para_persona: {$ref: '#/components/schemas/UuidONulo', description: 'Nulo si nadie estaba de turno.'}
        texto: {type: string, minLength: 1, maxLength: 200}
        creado_en: {type: string, format: date-time}
        atendido_en: {type: [string, 'null'], format: date-time}
    CuiGasto:
      type: object
