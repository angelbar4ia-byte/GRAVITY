          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uuid'
              example: f1000000-0000-4000-8000-000000000002
        '400':
          $ref: '#/components/responses/ReglaFinanzas'
        '403':
          $ref: '#/components/responses/Prohibido'
        '401':
          $ref: '#/components/responses/SinSesion'
  /rest/v1/rpc/fin_nombrar_albacea:
    post:
      tags: [Base de datos · Finanzas]
      operationId: finNombrarAlbacea
      summary: Nombrar al albacea (o al suplente) del libro de Papá
      description: >-
        Solo el dueño del hogar (N4): a cualquier otro responde 403 (42501), exista o no el
        libro, para no revelar libros. Nombra albacea o suplente de un libro `representado`
        cuyo cargo quedó vacío (nadie vigente que siga siendo adulto con Finanzas); si ese
        cargo lo tiene abierto alguien que ya no es adulto con Finanzas, lo cierra. Devuelve
        el id de la fila nueva de `fin_libro_miembros` y deja la entrada
        `finanzas.albacea_nombrado` en la bitácora (`libro_id`, `persona_id`, `papel` y
        `anterior_persona_id`). Responde 400 (22023) si el libro no es representado, el
        cargo no es `albacea` ni `albacea_suplente`, la persona no es adulto con Finanzas
        del hogar o es la persona representada, el cargo ya lo ocupa alguien (quien lo tiene
        debe dejarlo primero), o la persona ya lleva el libro con otro cargo.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_libro_id, p_persona_id]
              properties:
                p_libro_id:
                  $ref: '#/components/schemas/Uuid'
                p_persona_id:
                  $ref: '#/components/schemas/Uuid'
                p_papel:
                  type: string
                  enum: [albacea, albacea_suplente]
                  default: albacea
            examples:
              suplente:
                summary: Alex, suplente del libro de Papá
                value:
                  p_libro_id: f1000000-0000-4000-8000-000000000002
                  p_persona_id: e0000000-0000-4000-8000-000000000002
                  p_papel: albacea_suplente
              albacea:
                summary: Ana vuelve a ser la albacea (por omisión, `albacea`)
                value:
                  p_libro_id: f1000000-0000-4000-8000-000000000002
                  p_persona_id: e0000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Id de la fila nueva de `fin_libro_miembros`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uuid'
              example: 7c2e9a40-5b1d-4e8a-9f36-1a4d6b8c0e21
        '400':
          $ref: '#/components/responses/ReglaFinanzas'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/fin_vistas_solicitadas:
    get:
      tags: [Base de datos · Finanzas]
      operationId: leerFinVistasSolicitadas
      summary: Leer las solicitudes de vista temporal de Papá
      description: >-
        Solo lectura (D24). El familiar lee las suyas; el dueño del hogar lee las del hogar. Nadie
        escribe directo: la tabla cambia solo por `fin_pedir_vista_papa` y `fin_responder_vista`
        (y el vencimiento, del servidor). No se borra. La autorización dura 30 minutos
        (`vigente_hasta`). No lleva montos ni cuentas.
      x-roles: [dueno, familiar]
      x-escribe: false
      x-solo-local: true
      x-fase: 4
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/filtroId'
        - $ref: '#/components/parameters/filtroHogar'
        - $ref: '#/components/parameters/orden'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Solicitudes visibles para la sesión.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VistaSolicitada'
              example:
                - id: 9c000000-0000-4000-8000-000000000001
                  hogar_id: b0000000-0000-4000-8000-000000000001
                  solicitante_id: e0000000-0000-4000-8000-000000000003
                  libro_persona_id: e0000000-0000-4000-8000-000000000001
                  motivo: Revisar las medicinas de Papá
                  estado: autorizada
                  autorizada_por: e0000000-0000-4000-8000-000000000001
                  vigente_hasta: '2026-11-10T10:30:00-06:00'
                  creado_en: '2026-11-10T10:00:00-06:00'
        '401':
          $ref: '#/components/responses/SinSesion'
  /rest/v1/rpc/fin_registrar_consulta_vista:
    post:
      tags: [Base de datos · Finanzas]
      operationId: finRegistrarConsultaVista
      summary: Registrar una consulta de la vista temporal de Papá
      description: >-
        El familiar la llama cada vez que consulta el libro de Papá con una vista vigente
        (D24). Deja una entrada en la bitácora (`finanzas.consulta_vista`: quién y cuándo, sin
        montos ni cuentas), una por cada consulta, sin tope (D24). No devuelve nada. Sin una vista vigente, o si la sesión no es un
        familiar, 403 (42501).
      x-roles: [familiar]
      x-escribe: true
      x-solo-local: true
      x-fase: 4
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        '200':
          description: Consulta registrada (o ya registrada en el último minuto).
        '403':
          $ref: '#/components/responses/Prohibido'
        '401':
          $ref: '#/components/responses/SinSesion'
  /rest/v1/rpc/fin_pedir_vista_papa:
    post:
      tags: [Base de datos · Finanzas]
      operationId: finPedirVistaPapa
      summary: Pedir la vista temporal de Finanzas de Papá (familiar)
      description: >-
        Solo el familiar vigente del hogar (D24): a cualquier otra sesión responde 403
        (42501). Crea una solicitud `pendiente` en `fin_vistas_solicitadas` y avisa al dueño
        (aviso `solicitud_vista`, crítico, sin montos ni nombres). Devuelve el id de la
        solicitud. Responde 400 (22023) si el motivo tiene menos de 3 caracteres visibles o
        más de 200, si el hogar no tiene libro de Papá, o si ya hay una solicitud pendiente
        o una vista vigente (máximo 5 solicitudes por 24 horas).
      x-roles: [familiar]
      x-escribe: true
      x-solo-local: true
      x-fase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_motivo]
              properties:
                p_motivo:
                  type: string
                  minLength: 3
                  maxLength: 200
            example:
              p_motivo: Revisar el pago del predial
      responses:
        '200':
          description: Id de la solicitud creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uuid'
              example: 5d3a1c70-2b8e-4f19-a6c4-8e0b7d92f315
        '400':
          $ref: '#/components/responses/ReglaFinanzas'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/fin_responder_vista:
    post:
      tags: [Base de datos · Finanzas]
      operationId: finResponderVista
      summary: Autorizar, rechazar o cancelar una solicitud de vista
      description: >-
        Solo el dueño del hogar (42501 a cualquier otro). `autorizar` y `rechazar` valen para
        solicitudes pendientes; al autorizar, `vigente_hasta` queda en ahora más 30 minutos
        exactos. `cancelar` vale para una pendiente o una autorizada vigente. No devuelve
        nada. Responde 400 (22023) si la acción no es una de las tres, si la solicitud ya
        venció, ya no está pendiente o ya no se puede cancelar.
      x-roles: [dueno]
      x-escribe: true
      x-solo-local: true
      x-fase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_solicitud, p_accion]
              properties:
                p_solicitud:
                  $ref: '#/components/schemas/Uuid'
                p_accion:
                  type: string
                  enum: [autorizar, rechazar, cancelar]
            example:
              p_solicitud: 5d3a1c70-2b8e-4f19-a6c4-8e0b7d92f315
              p_accion: autorizar
      responses:
        '204':
          description: Hecho.
        '400':
          $ref: '#/components/responses/ReglaFinanzas'
        '401':
          $ref: '#/components/responses/SinSesion'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/fin_vista_papa_vigente:
    post:
      tags: [Base de datos · Finanzas]
      operationId: finVistaPapaVigente
      summary: ¿Tengo una vista de Papá autorizada y en tiempo?
      description: >-
        Verdadero si la sesión es un familiar con una solicitud `autorizada` cuyo
        `vigente_hasta` aún no pasa. Es la verdad para la app (D24); a cualquier otra sesión
        le responde `false`. La lectura de los datos de Papá la decide la RLS en cada
        consulta, no esta marca.
      x-roles: [familiar]
      x-escribe: false
      x-solo-local: true
      x-fase: 4
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        '200':
          description: Si hay una vista vigente.
          content:
            application/json:
              schema:
                type: boolean
              example: false
        '401':
          $ref: '#/components/responses/SinSesion'
  /rest/v1/rpc/fin_vista_vigente_hogar:
    post:
      tags: [Base de datos · Finanzas]
      operationId: finVistaVigenteHogar
      summary: ¿Tengo una vista de Papá vigente en este hogar?
      description: >-
        Como `fin_vista_papa_vigente`, para un hogar (D24). Lo usan las políticas de lectura
        de categorías y cuentas de gasto. Verdadero solo para un familiar de ese hogar con una
        solicitud `autorizada` cuyo `vigente_hasta` no ha pasado; a cualquier otra sesión le
        responde `false`.
      x-roles: [familiar]
      x-escribe: false
      x-solo-local: true
      x-fase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_hogar_id]
              properties:
                p_hogar_id:
                  $ref: '#/components/schemas/Uuid'
            example:
              p_hogar_id: b0000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Si hay una vista vigente.
          content:
            application/json:
              schema:
                type: boolean
              example: false
        '401':
          $ref: '#/components/responses/SinSesion'
  /rest/v1/rpc/fin_vista_vigente_libro:
    post:
      tags: [Base de datos · Finanzas]
      operationId: finVistaVigenteLibro
      summary: ¿Tengo una vista vigente sobre este libro de Papá?
      description: >-
        Verdadero si la sesión es un familiar con una vista `autorizada` y en tiempo sobre ese
        libro `representado` (D24). Con cualquier otro libro o sesión responde `false`. Es la
        base de la regla de lectura de `fin_puede`; la app la usa para saber si puede mostrar
        el libro.
      x-roles: [familiar]
      x-escribe: false
      x-solo-local: true
      x-fase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_libro_id]
              properties:
                p_libro_id:
                  $ref: '#/components/schemas/Uuid'
            example:
              p_libro_id: f1000000-0000-4000-8000-000000000002
      responses:
        '200':
          description: Si hay una vista vigente.
          content:
            application/json:
              schema:
                type: boolean
              example: false
        '401':
          $ref: '#/components/responses/SinSesion'
  /rest/v1/rpc/fin_lunes:
    post:
      tags: [Base de datos · Finanzas]
      operationId: finLunes
      summary: Lunes de la semana de una fecha
      description: >-
