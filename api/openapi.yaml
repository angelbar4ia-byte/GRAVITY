        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Mis avisos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvisoPersona'
              example:
                - id: 9b000000-0000-4000-8000-000000000001
