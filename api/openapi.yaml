  /rest/v1/rpc/registrar_dispositivo:
    post:
      tags: [Base de datos]
      operationId: registrarDispositivoRpc
      summary: Registrar este dispositivo
      description: >-
        Da de alta o **reasigna** el token a la persona de la sesión (el id sale del token,
        así que es idempotente); entrar con otra cuenta en el mismo equipo reasigna el token
        (el token es único global). Un teléfono recibe avisos por omisión; tablet personal y
        laptop, no; una tablet pública nunca. Registrar de nuevo no apaga la elección de la
        persona. Sin sesión: 403 (42501); token, plataforma o tipo inválidos: 400 (22023).
        Reemplaza al POST directo sobre `dispositivos`, que ya no existe.
      x-roles: [dueno, coadministrador, familiar, cuidador, casa]
      x-escribe: true
      x-solo-local: true
      x-fase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_token, p_plataforma]
              properties:
                p_token:
                  type: string
                  minLength: 1
                  maxLength: 4096
                p_plataforma:
                  type: string
                  enum: [android, windows]
                p_nombre:
                  type: [string, 'null']
                  maxLength: 80
                p_tipo:
                  type: string
                  enum: [telefono, tablet_personal, tablet_publica, laptop]
                  default: telefono
            example:
              p_token: token-fcm-de-ejemplo-ana
              p_plataforma: android
              p_nombre: Teléfono de Ana (ejemplo)
              p_tipo: telefono
      responses:
        '200':
          description: Id del dispositivo (derivado del token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uuid'
              example: 6f1c2a8e-3b7d-4c55-9e0a-2d4b8f1e7a90
        '400':
          $ref: '#/components/responses/Invalido'
        '403':
          $ref: '#/components/responses/Prohibido'
  /rest/v1/rpc/quitar_dispositivo:
