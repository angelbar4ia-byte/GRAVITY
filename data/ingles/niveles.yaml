# Matriz de niveles de GRAVITY (gravity-ingles-v1, tipo niveles). Paquete P1.3.
# - Contiene la escalera de 13 escalones, el temario de cada uno y las listas controladas (habilidades, focos de pregunta,
#   enfoques del día y temas de gramática). La herramienta lee cinco claves de primer nivel (niveles, escalones, habilidades,
#   focos y temas; V13); las demás las ignora y son para quien produce el curso.
# - El curso no arranca hasta que la fase 6 (pareja y corrección con IA) esté integrada (D-ING-9 y D-ING-10, en D29): esta matriz es
#   contenido para producir, no para estudiar todavía.
# - Siglas: «plan 0.6» = docs/specs/fase-8-ingles-plan.md; «formato 0.4» = docs/specs/fase-8-ingles-formato.md; «D29» =
#   docs/DECISIONES.md; «anexo B» = anexo B del plan (propuesta de temario por escalón); «anexo A» = anexo A del diseño de Hábitos
#   (docs/modulos/habitos/diseno-app-habitos.md, seis módulos de inglés); «A2 Key» y «B1 Preliminary» = los manuales del profesor
#   de Cambridge citados en los contratos de data/ingles/formatos/.
# - Honestidad sobre el origen. La asignación de cada tema a una etapa es criterio de diseño. Se respalda así:
#     en_manual: ids de contrato cuyo manual (inventario de estructuras) nombra el tema. Lo leyó y lo comprobó el autor con la página
#                del manual (bloque manuales y bloque cobertura_de_manuales); calidad contrasta una muestra.
#     pendiente: true = su etapa no la respalda ningún inventario que el proyecto tenga (todo A1 y todo B2, que no tienen inventario,
#                y lo que A2 Key o B1 Preliminary no nombran). Hay que contrastarlo con el English Grammar Profile y con las listas de
#                Cambridge cuando alguien tenga red. Un tema sin pendiente tiene su etapa respaldada por el manual de esa etapa.
#   El manual solo respalda que un tema esté visto a más tardar al cerrar la etapa; el reparto entre los escalones de una misma
#   etapa es diseño de GRAVITY y por eso todos los escalones llevan pendiente: true con su nota.
# - Reglas que cumple este archivo (las comprueba un script de P1.3 fuera del repositorio; conviene pasarlas a V27):
#     1. Los 13 escalones están en el orden de la escalera y cada uno trae etapa, 40 horas, 8 semanas, puerta y descriptores «puedo»
#        de lectura, escucha, escritura y habla.
#     2. Cada tema de gramática es nuevo en un solo escalón (gramatica_nueva). Un escalón solo retoma temas de escalones anteriores
#        (gramatica_que_se_retoma).
#     3. Todo lo que el inventario del manual de una etapa nombra está visto, a más tardar, al cerrar esa etapa (A2.3 y B1.4).
#     4. Todos los valores de nivel, escalón, habilidad, foco, enfoque y tema que usan los ejemplos están en estas listas.
#     5. Los datos de etapas, horas y puertas son los mismos de gravity-escalon.yaml.
# - Los descriptores «puedo» están escritos para GRAVITY, con palabras propias; no copian el marco europeo ni ningún manual.
esquema: gravity-ingles-v1
tipo: niveles
id: niveles
estado: borrador
nombre: "Matriz de niveles: escalera de 13 escalones, temario y listas controladas"
documentos:
  - {ruta: docs/specs/fase-8-ingles-plan.md, version: "0.6", fecha: 2026-11-16}
  - {ruta: docs/specs/fase-8-ingles-formato.md, version: "0.4", fecha: 2026-11-16}
  - {ruta: docs/DECISIONES.md, version: D29, fecha: 2026-11-16}
  - {ruta: data/ingles/formatos/gravity-escalon.yaml, version: borrador, fecha: 2026-11-16}
  - {ruta: data/ingles/formatos/gravity-sesion-60.yaml, version: borrador, fecha: 2026-11-16}
  - {ruta: data/ingles/formatos/gravity-ubicacion.yaml, version: borrador, fecha: 2026-11-16}
  - {ruta: docs/contenido/ingles/niveles-y-avance.md, version: "0.3", fecha: 2026-11-14, nota: "la versión 0.4 es del mismo paquete"}
  - {ruta: docs/contenido/ingles/modulo-1.md a modulo-4.md, version: "1.0 y 0.1", fecha: 2026-11-14, nota: "semilla de B1.1 y B1.2"}
  - {ruta: docs/modulos/habitos/diseno-app-habitos.md, version: "anexo A", fecha: 2026-11-14, nota: "los seis módulos de inglés (A.4) y el vocabulario transversal"}
totales:
  escalones: 13
  etapas: 4
  semanas_por_escalon: 8
  horas_por_escalon: 40
  horas_totales: 520
  origen: "D29 (D-ING-1); plan 0.6, sección 3.1; gravity-escalon.yaml (totales y escalera)"
descriptores_puedo:
  origen: "Escritos para GRAVITY con palabras propias, en primera persona y en español. No copian los descriptores del marco europeo ni los de ningún manual. Los manuales de A2 Key, B1 Preliminary y B2 First solo se consultaron para alinear lo que cada puerta de etapa mide."
  longitudes: "Las cifras de palabras y de segundos son las de la tabla por etapa de gravity-sesion-60 (longitudes_por_etapa): A1 lectura y audio 60 a 120, escritura 30 a 50, habla 30 a 45 s; A2 120 a 200, 50 a 80, 45 a 60 s; B1 200 a 350, 80 a 120, 60 a 90 s; B2 350 a 550 de lectura, 350 a 500 de audio, 140 a 190, 90 a 120 s. Los tres escalones de cierre con examen oficial (A2.3, B1.4 y B2.4) se alinean además con el contrato de su examen."
  cuatro_habilidades: [lectura, escucha, escritura, habla]

niveles:
  - id: A1
    escalones: [A1.1, A1.2]
    escalon_de_cierre: A1.2
    horas_acumuladas: 80
    puerta: {tipo: interna, formato: gravity-escalon, nombre: "Prueba interna de A1"}
    origen: "gravity-escalon.yaml (etapas); D29 (D-ING-1); plan 0.6, sección 3.1. A1 no tiene examen oficial en la escalera: su etiqueta la da la prueba interna."
  - id: A2
    escalones: [A2.1, A2.2, A2.3]
    escalon_de_cierre: A2.3
    horas_acumuladas: 200
    puerta: {tipo: examen, formato: cambridge-a2-key, fidelidad_requerida: completa}
    origen: "gravity-escalon.yaml (etapas); D29 (D-ING-1)"
  - id: B1
    escalones: [B1.1, B1.2, B1.3, B1.4]
    escalon_de_cierre: B1.4
    horas_acumuladas: 360
    puerta: {tipo: examen, formato: cambridge-b1-preliminary, fidelidad_requerida: completa}
    origen: "gravity-escalon.yaml (etapas); D29 (D-ING-1)"
  - id: B2
    escalones: [B2.1, B2.2, B2.3, B2.4]
    escalon_de_cierre: B2.4
    horas_acumuladas: 520
    puerta: {tipo: examen, formato: cambridge-b2-first, fidelidad_requerida: completa}
    origen: "gravity-escalon.yaml (etapas); D29 (D-ING-1)"

escalones:
  # ---------------------------------------------------------------- A1 (sin inventario de manual: todo es diseño)
  - id: A1.1
    etapa: A1
    orden: 1
    nombre: "Presentarme y hablar de mis cosas"
    entrada_por_ubicacion: "Ninguna etapa alcanzada (gravity-ubicacion.yaml, tabla de entrada)"
    horas: 40
    semanas: 8
    horas_acumuladas_al_cerrar: 40
    horas_acumuladas_al_pasar_la_puerta_de_etapa: 80
    puerta: {tipo: escalon, formato: gravity-escalon}
    gramatica_nueva: [gram.verbo_to_be, gram.pronombres_sujeto, gram.articulos_a_an_the, gram.plurales, gram.demostrativos,
      gram.adjetivos_posesivos, gram.there_is_are, gram.presente_simple_afirmativa, gram.palabras_interrogativas_basicas,
      gram.adjetivos_calificativos]
    gramatica_que_se_retoma: []
    funciones:
      - "Saludar y despedirme"
      - "Presentarme y presentar a otra persona"
      - "Dar y pedir datos personales (nombre, edad, país, teléfono)"
      - "Deletrear mi nombre y pedir que me repitan algo"
      - "Contar, decir la hora y decir la fecha"
      - "Decir quién es mi familia y cómo son las personas"
      - "Decir qué hay en un lugar y dónde está algo"
    vocabulario:
      - "Datos personales, países y nacionalidades"
      - "Números, horas, días, meses y fechas"
      - "Familia y personas"
      - "La casa, los cuartos y los objetos"
      - "Colores, ropa y descripciones simples"
      - "Comida y bebida básicas"
      - "Frases para pedir ayuda y repetir en clase"
    puedo:
      lectura: "Puedo leer una ficha, un letrero o un mensaje muy corto y encontrar el nombre, la edad, el país, la hora o el precio que busco."
      escucha: "Puedo entender saludos, presentaciones y preguntas personales muy simples cuando me hablan despacio y me repiten si lo pido."
      escritura: "Puedo llenar un formulario con mis datos y escribir de 30 a 50 palabras sobre mí y mi familia con frases muy sencillas."
      habla: "Puedo saludar, presentarme y preguntar y decir datos personales con frases muy cortas, pidiendo que me repitan cuando no entiendo."
    origen:
      gramatica: "Anexo B del plan (fila A1.1), que a su vez sale del repaso R1 de niveles-y-avance 0.3, sección 2 (temas del repaso que el dueño nunca aprobó y que D29 no confirma). Añadí palabras interrogativas básicas y adjetivos calificativos, que el anexo B no nombraba y el manual de A2 Key lista (PDF p. 52)."
      funciones: "Diseño de GRAVITY a partir del anexo B; el proyecto no tiene lista de funciones de A1."
      vocabulario: "Anexo B (números, horas y fechas; familia y objetos de casa del repaso R1) y diseño de GRAVITY."
      puedo: "Diseño de GRAVITY (ver descriptores_puedo)."
    pendiente: true
    nota: "Todo A1 es diseño: el proyecto no tiene inventario de A1 (los contratos empiezan en A2 Key). Contrastar con el English Grammar Profile y con las listas de Cambridge para A1 el reparto entre A1.1 y A1.2."

  - id: A1.2
    etapa: A1
    orden: 2
    nombre: "Mi día y lo que sé hacer"
    horas: 40
    semanas: 8
    horas_acumuladas_al_cerrar: 80
    horas_acumuladas_al_pasar_la_puerta_de_etapa: 80
    puerta: {tipo: interna, formato: gravity-escalon, nombre: "Prueba interna de A1"}
    gramatica_nueva: [gram.presente_simple_negativa_y_pregunta, gram.adverbios_de_frecuencia, gram.can_habilidad, gram.gusto_mas_ing,
      gram.imperativos, gram.preposiciones_de_lugar, gram.preposiciones_de_tiempo, gram.some_any, gram.posesivo_s,
      gram.pronombres_objeto]
    gramatica_que_se_retoma: [gram.verbo_to_be, gram.pronombres_sujeto, gram.articulos_a_an_the, gram.plurales, gram.adjetivos_posesivos,
      gram.there_is_are, gram.presente_simple_afirmativa, gram.palabras_interrogativas_basicas]
    funciones:
      - "Hablar de mi rutina y de mis horarios"
      - "Decir con qué frecuencia hago algo"
      - "Decir lo que sé hacer y lo que no sé hacer"
      - "Expresar gustos y preferencias sencillas"
      - "Dar y seguir instrucciones cortas"
      - "Decir dónde y cuándo ocurre algo"
      - "Pedir y ofrecer algo de comer o de beber"
    vocabulario:
      - "Rutinas y horarios"
      - "Habilidades y pasatiempos"
      - "Deportes y tiempo libre"
      - "Lugares de la ciudad y cómo llegar"
      - "Transporte básico"
      - "Compras y comida con cantidades simples"
    puedo:
      lectura: "Puedo leer un texto de 60 a 100 palabras sobre la rutina de una persona o un horario y decir qué hace, cuándo y dónde."
      escucha: "Puedo seguir una conversación lenta sobre rutinas, gustos y cosas que alguien sabe hacer, y entender instrucciones cortas."
      escritura: "Puedo escribir de 30 a 50 palabras sobre mi día, lo que me gusta y lo que sé hacer, con frases simples."
      habla: "Puedo describir mi rutina y mis gustos durante 30 a 45 segundos, pedir algo sencillo y dar una instrucción corta."
    origen:
      gramatica: "Anexo B del plan (fila A1.2), que sale del repaso R2 de niveles-y-avance 0.3 (tampoco aprobado por el dueño). Añadí el posesivo 's y los pronombres de objeto: el manual de A2 Key los lista (PDF p. 52) y no tenían escalón en el anexo B."
      funciones: "Diseño de GRAVITY a partir del anexo B."
      vocabulario: "Repaso R2 (rutinas, habilidades, tiempo libre y lugares) y diseño de GRAVITY."
      puedo: "Diseño de GRAVITY (ver descriptores_puedo)."
    pendiente: true
    nota: "Todo A1 es diseño. Contrastar con el English Grammar Profile. La puerta es la prueba interna de A1 (gravity-escalon): no hay examen oficial de A1 en la escalera, así que su etiqueta no equivale a ninguna certificación."

  # ---------------------------------------------------------------- A2 (puerta de etapa: A2 Key; el curso arranca aquí, D-ING-7)
  - id: A2.1
    etapa: A2
    orden: 3
    nombre: "Lo que pasó, lo que pasa y lo que voy a hacer"
    entrada_por_ubicacion: "Última etapa alcanzada: A1 (gravity-ubicacion.yaml, tabla de entrada)"
    horas: 40
    semanas: 8
    horas_acumuladas_al_cerrar: 120
    horas_acumuladas_al_pasar_la_puerta_de_etapa: 200
    puerta: {tipo: escalon, formato: gravity-escalon}
    gramatica_nueva: [gram.presente_continuo, gram.verbos_de_estado, gram.was_were, gram.pasado_simple_afirmativa,
      gram.pasado_simple_negativa_y_pregunta, gram.contables_e_incontables, gram.pronombres_posesivos_e_indefinidos,
      gram.comparativos_y_superlativos, gram.going_to, gram.conectores_basicos]
    gramatica_que_se_retoma: [gram.verbo_to_be, gram.presente_simple_afirmativa, gram.presente_simple_negativa_y_pregunta,
      gram.adverbios_de_frecuencia, gram.can_habilidad, gram.gusto_mas_ing, gram.preposiciones_de_tiempo, gram.some_any,
      gram.pronombres_objeto, gram.adjetivos_calificativos, gram.plurales, gram.posesivo_s]
    funciones:
      - "Decir qué hago ahora y qué hacen otras personas"
      - "Distinguir lo que hago siempre de lo que pasa en este momento"
      - "Contar lo que hice ayer, el fin de semana o en mis vacaciones"
      - "Comparar personas, lugares y cosas"
      - "Preguntar y hablar de cantidades al comprar o cocinar"
      - "Decir mis planes e intenciones"
      - "Dar razones sencillas (porque, así que)"
    vocabulario:
      - "Actividades de casa y trabajo en este momento"
      - "Gustos, opiniones y sentimientos"
      - "Fin de semana y vacaciones"
      - "Salidas, eventos y entretenimiento"
      - "Comida, compras y cantidades"
      - "Ciudad, lugares y transporte"
      - "Planes, citas y tiempo libre"
    puedo:
      lectura: "Puedo leer un mensaje largo, una anécdota o un anuncio de 120 a 150 palabras y entender qué pasó, cuándo y a quién, y qué se planea hacer."
      escucha: "Puedo entender, si me hablan con claridad y sin prisa, un relato corto sobre lo que alguien hizo o va a hacer."
      escritura: "Puedo escribir de 50 a 70 palabras contando lo que hice y lo que voy a hacer, y comparar dos cosas."
      habla: "Puedo contar en unos 45 segundos lo que hice, comparar dos opciones y decir qué voy a hacer, con razones sencillas."
    origen:
      gramatica: "Anexo B del plan (fila A2.1), que sale del repaso R3 de niveles-y-avance 0.3, ajustado con el inventario de A2 Key (PDF p. 51 a 53): se añaden pronombres posesivos e indefinidos y conectores básicos, que el manual lista y el anexo B no nombraba. El presente continuo y los verbos de estado quedan aquí (el manual lista «verbos que no se usan en continuo»); lo que B1.1 hace con ellos es contrastar usos."
      funciones: "Lista de funciones de A2 Key (PDF p. 51), reescrita con palabras propias y repartida entre A2.1, A2.2 y A2.3 por diseño."
      vocabulario: "Temas de A2 Key (PDF p. 53), un campo por semana, y vocabulario transversal del anexo A.4 (viajes y vida diaria)."
      puedo: "Diseño de GRAVITY (ver descriptores_puedo)."
    pendiente: true
    nota: "El manual de A2 Key respalda que todo esté visto al cerrar A2.3, no el reparto entre A2.1, A2.2 y A2.3, que es diseño. Contrastar con el English Grammar Profile: presente continuo, verbos de estado, contables e incontables y going to en este escalón. Carga alta: 10 temas nuevos en 7 semanas de contenido; la calibra el piloto de A2.1 (P1.5). La semana 1 retoma A1, porque la ubicación solo exige 10 de 12 en A1. Detalle por semana en temario_por_semana."

  - id: A2.2
    etapa: A2
    orden: 4
    nombre: "Experiencias, obligaciones y consejos"
    horas: 40
    semanas: 8
    horas_acumuladas_al_cerrar: 160
    horas_acumuladas_al_pasar_la_puerta_de_etapa: 200
    puerta: {tipo: escalon, formato: gravity-escalon}
    gramatica_nueva: [gram.will_futuro, gram.have_to_must_mustnt, gram.should_consejo, gram.presente_perfecto_experiencias,
      gram.presente_perfecto_just_already_yet, gram.could_peticiones_y_habilidad_pasada, gram.would_like_y_sugerencias,
      gram.verbo_mas_infinitivo, gram.adverbios_de_modo_y_grado]
    gramatica_que_se_retoma: [gram.going_to, gram.presente_continuo, gram.verbos_de_estado, gram.was_were, gram.pasado_simple_afirmativa,
      gram.pasado_simple_negativa_y_pregunta, gram.can_habilidad, gram.imperativos, gram.gusto_mas_ing,
      gram.adverbios_de_frecuencia, gram.contables_e_incontables, gram.conectores_basicos]
    funciones:
      - "Hablar de experiencias de vida (¿alguna vez has…?)"
      - "Dar noticias recientes y decir qué ya hice y qué todavía no"
      - "Predecir, decidir en el momento, prometer y ofrecer ayuda"
      - "Expresar obligación, prohibición y necesidad"
      - "Dar y pedir consejos"
      - "Pedir con cortesía, ofrecer, invitar y sugerir"
      - "Hablar de cómo me siento y de mi salud"
      - "Decir cómo hago algo y qué espero o quiero hacer"
    vocabulario:
      - "Clima y naturaleza"
      - "Trabajo, reglas y servicios"
      - "Salud, medicina y ejercicio"
      - "Viajes y experiencias"
      - "Casa, recados y tareas pendientes"
      - "Restaurantes, tiendas y servicios"
      - "Sentimientos y relaciones con otras personas"
    puedo:
      lectura: "Puedo leer un texto de unas 150 palabras sobre experiencias, reglas o consejos y entender las ideas y lo que se recomienda."
      escucha: "Puedo entender un mensaje de voz o una conversación sobre experiencias, obligaciones y consejos, aunque tenga que oírlo dos veces."
      escritura: "Puedo escribir de 50 a 80 palabras contando una experiencia o dando un consejo con sus razones."
      habla: "Puedo hablar de 45 a 60 segundos sobre algo que he vivido, dar un consejo y hacer una petición o una invitación con cortesía."
    origen:
      gramatica: "Anexo B del plan (fila A2.2: presente perfecto de experiencias y con just, already y yet; will; have to, must y should), que sale del repaso R4 de niveles-y-avance 0.3, ajustado con el inventario de A2 Key (PDF p. 51 y 52): se añaden peticiones y ofrecimientos (could, would like, shall), infinitivo tras verbos y adverbios de modo y grado, que el manual lista y el anexo B no nombraba. May (posibilidad) y need entran dentro de will_futuro y have_to_must_mustnt."
      funciones: "Lista de funciones de A2 Key (PDF p. 51), reescrita con palabras propias."
      vocabulario: "Temas de A2 Key (PDF p. 53), un campo por semana, y vocabulario transversal del anexo A.4 (salud y viajes)."
      puedo: "Diseño de GRAVITY (ver descriptores_puedo)."
    pendiente: true
    nota: "Todos los temas tienen respaldo del manual de A2 Key; el reparto dentro de A2 es diseño. Contrastar con el English Grammar Profile el orden entre el presente perfecto, will y los modales. Detalle por semana en temario_por_semana."

  - id: A2.3
    etapa: A2
    orden: 5
    nombre: "Historias, condiciones y cómo se hacen las cosas"
    horas: 40
    semanas: 8
    horas_acumuladas_al_cerrar: 200
    horas_acumuladas_al_pasar_la_puerta_de_etapa: 200
    puerta: {tipo: examen, formato: cambridge-a2-key, fidelidad_requerida: completa}
    gramatica_nueva: [gram.pasado_continuo, gram.condicional_primera, gram.relativas_who_which_that, gram.sintagma_nominal_basico,
      gram.presente_perfecto_for_since, gram.pasiva_presente_y_pasado, gram.oraciones_con_that,
      gram.futuro_con_presente_continuo_y_simple, gram.gerundio_y_preposiciones, gram.too_y_enough]
    gramatica_que_se_retoma: [gram.presente_simple_afirmativa, gram.presente_continuo, gram.verbos_de_estado, gram.pasado_simple_afirmativa,
      gram.pasado_simple_negativa_y_pregunta, gram.presente_perfecto_experiencias, gram.presente_perfecto_just_already_yet,
      gram.will_futuro, gram.going_to, gram.have_to_must_mustnt, gram.comparativos_y_superlativos, gram.verbo_mas_infinitivo,
      gram.gusto_mas_ing, gram.adjetivos_calificativos, gram.posesivo_s, gram.conectores_basicos, gram.adverbios_de_modo_y_grado]
    funciones:
      - "Contar lo que pasaba mientras ocurría otra cosa"
      - "Plantear condiciones y sus consecuencias"
      - "Describir personas, cosas y lugares con más detalle (la persona que…, el lugar donde…)"
      - "Decir desde cuándo y por cuánto tiempo hago o tengo algo"
      - "Decir cómo se hace o se hizo algo sin nombrar a quien lo hace"
      - "Decir lo que pienso, espero y sé (I think that…)"
      - "Hablar de citas, arreglos y horarios"
      - "Decir que algo es demasiado o es suficiente"
    vocabulario:
      - "Historias y noticias"
      - "Condiciones y consecuencias de la vida diaria"
      - "Personas, objetos y lugares: cómo son y para qué sirven"
      - "Etapas de la vida, estudios y trabajo"
      - "Productos, lugares conocidos y procesos"
      - "Horarios, citas y transporte público"
      - "Idiomas, estudios y comunicación"
    puedo:
      lectura: "Puedo leer avisos, mensajes y un texto de unas 200 palabras y encontrar lo que necesito, y completar un texto corto con las palabras que le faltan."
