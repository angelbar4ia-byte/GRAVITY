cobertura_de_manuales:
  nota: "Un elemento del inventario puede quedar cubierto por varios temas, y un tema puede cubrir varios elementos. Los elementos del inventario que solo se reconocen y no se producen (needn't, el genitivo doble, las formas fuera de la lista) están dentro del alcance del tema que los nombra."
