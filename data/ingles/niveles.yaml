    gramatica_que_se_retoma: [gram.pasiva_presente_y_pasado, gram.pasiva_ampliada, gram.causativo_have_get, gram.estilo_indirecto,
      gram.patrones_verbales_ing_e_infinitivo, gram.relativas_who_which_that, gram.relativas_ampliadas,
      gram.sintagmas_nominales_complejos, gram.preguntas_indirectas, gram.verbos_frasales_frecuentes]
    funciones:
      - "Informar de lo que dijeron o decidieron otras personas"
      - "Describir procesos y cómo se hace algo"
      - "Atribuir información sin comprometerme (se dice que…, se cree que…)"
      - "Hablar de servicios y de cosas que se hacen por uno"
      - "Dar detalles con cláusulas de relativo y de participio"
      - "Resumir una noticia o un informe"
    vocabulario:
      - "Ciencia, tecnología e industria"
      - "Noticias, política y sociedad"
      - "Procesos, fabricación y servicios"
      - "Verbos de reporte: admitir, negar, sugerir, insistir y advertir"
      - "Salud y medio ambiente en informes"
      - "Trabajo y organizaciones"
    puedo:
      lectura: "Puedo leer informes, noticias y artículos de 450 a 550 palabras y entender quién dijo qué, qué se hizo y cómo funciona un proceso."
      escucha: "Puedo entender un reportaje o una entrevista de 400 a 500 palabras y seguir lo que se informa, lo que se atribuye a otros y las opiniones."
      escritura: "Puedo escribir de 150 a 180 palabras un informe breve o una noticia que describa un proceso y cuente lo que dijeron otras personas."
      habla: "Puedo informar a otra persona, durante 90 a 120 segundos, de lo que dijeron o decidieron otros y de cómo se hace algo."
    origen:
      gramatica: "Anexo B del plan (fila B2.3), con una diferencia: el causativo have/get (el anexo B lo ponía aquí como «have something done») pasó a B1.4 porque el manual de B1 Preliminary lo lista (PDF p. 73); aquí se retoma dentro de la pasiva avanzada. Todo B2 es diseño."
      funciones: "Anexo B del plan y diseño de GRAVITY."
      vocabulario: "Diseño de GRAVITY."
      puedo: "Diseño de GRAVITY (ver descriptores_puedo)."
    pendiente: true
    nota: "Todo B2 es diseño. Contrastar con el English Grammar Profile la pasiva con verbos de opinión y de reporte, los participios y las relativas reducidas."

  - id: B2.4
    etapa: B2
    orden: 13
    nombre: "Argumentar por escrito y en debate"
    horas: 40
    semanas: 8
    horas_acumuladas_al_cerrar: 520
    horas_acumuladas_al_pasar_la_puerta_de_etapa: 520
    puerta: {tipo: examen, formato: cambridge-b2-first, fidelidad_requerida: completa}
    gramatica_nueva: [gram.conectores_de_contraste_y_concesion, gram.conectores_formales_de_causa_resultado_y_proposito,
      gram.enfasis_con_oraciones_hendidas, gram.formacion_de_palabras, gram.colocaciones_y_expresiones_fijas,
      gram.verbos_frasales_por_tema]
    gramatica_que_se_retoma: [gram.conectores_de_causa_resultado_y_proposito, gram.oraciones_de_tiempo, gram.verbos_frasales_frecuentes,
      gram.adjetivos_compuestos, gram.comparaciones_ampliadas, gram.condicional_segunda, gram.condicional_tercera,
      gram.condicionales_mixtas, gram.wish_e_if_only, gram.preposiciones_dependientes, gram.pasiva_avanzada, gram.verbos_de_reporte]
    funciones:
      - "Argumentar a favor y en contra con ejemplos"
      - "Contrastar ideas y hacer concesiones"
      - "Explicar causas, resultados y propósitos con un registro formal"
      - "Enfatizar lo que importa (lo que necesito es…)"
      - "Escribir un ensayo, un informe, una reseña, un artículo, un correo o una carta"
      - "Debatir, llegar a un acuerdo y defender mi opinión"
    vocabulario:
      - "Ensayo y debate: opinión, argumento y evidencia"
      - "Colocaciones frecuentes por tema: trabajo, educación, salud y medio ambiente"
      - "Familias de palabras: prefijos y sufijos"
      - "Verbos frasales por tema"
      - "Reseñas, informes y artículos"
      - "Conectores formales e informales"
    puedo:
      lectura: "Puedo leer artículos largos de más de 500 palabras, seguir el argumento, el tono y la organización, y completar textos con la palabra, la forma o la oración que falta."
      escucha: "Puedo entender entrevistas, charlas y extractos de tres o cuatro minutos y captar opiniones, actitudes, propósito y acuerdo o desacuerdo entre quienes hablan."
      escritura: "Puedo escribir de 140 a 190 palabras un ensayo con mi postura y otro texto a elección (artículo, correo, carta, reseña o informe), con conectores y un registro adecuado."
      habla: "Puedo describir y comparar fotografías, debatir con otra persona hasta llegar a una decisión y defender mi opinión, durante unos 14 minutos."
    origen:
      gramatica: "Anexo B del plan (fila B2.4). Los conectores de contraste y los formales de causa, resultado y propósito son la parte de B2 de lo que el anexo B llamaba «contraste, causa y propósito» (la parte básica de causa y propósito pasó a B1.3). Respaldo parcial del manual de B2 First en las tareas de Use of English: colocaciones, verbos frasales y conectores (partes 1 y 2, PDF p. 12 y 13), formación de palabras (parte 3, PDF p. 14) y una gama de estructuras en las transformaciones (parte 4, PDF p. 15). Todo B2 es diseño."
      funciones: "Anexo B del plan y diseño de GRAVITY; tareas de Writing de B2 First (ensayo y una tarea a elegir), según el contrato."
      vocabulario: "Diseño de GRAVITY y tareas de Use of English de B2 First (PDF p. 12 a 14)."
      puedo: "Contrato cambridge-b2-first (Writing de 140 a 190 palabras; Speaking de 14 minutos por pareja) y diseño de GRAVITY (ver descriptores_puedo)."
    pendiente: true
    nota: "Escalón de cierre de B2: su puerta es la forma completa tipo B2 First (unos 209 minutos según el contrato: 75 de Reading and Use of English, 80 de Writing, 40 de Listening y 14 de Speaking; se reparte en varias sesiones, lo define P0.3). Todo B2 es diseño; contrastar con el English Grammar Profile."

