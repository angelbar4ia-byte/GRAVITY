# Cómo se reparten las 8 semanas de cualquier escalón. El detalle semana por semana de A2.1, A2.2 y A2.3 está en temario_por_semana
# (D-ING-7: el curso arranca por A2.1; los demás escalones no llevan ese detalle todavía).
plan_de_las_8_semanas:
  semanas_de_contenido: [1, 2, 3, 4, 5, 6, 7]
  semana_de_repaso_y_puerta: 8
  primera_oportunidad_de_la_puerta: "Al final de la semana 8"
  puerta_anticipada: "En la semana 2 del escalón que se cursa, con 90 % o más en cada habilidad y sin gastar oportunidades"
  mini_prueba: "Cada viernes: 10 preguntas de gramática y vocabulario; se aprueba con 8 (gravity-escalon.yaml, mini_prueba)"
  origen: "plan 0.6, sección 4.2 (primera oportunidad al final de la semana 8) y sección 3.3 (puerta anticipada en la semana 2); gravity-escalon.yaml"
  pendiente: true
  nota: "Que las semanas 1 a 7 sean de contenido nuevo y la 8 de repaso y puerta es una propuesta de P1.3, no un dato: el plan no dice si la puerta cuenta dentro de las 40 horas del escalón (gravity-escalon.yaml, primera_oportunidad). Se propone que sí, porque las 80, 200, 360 y 520 horas suponen aprobar a la primera al final de la semana 8. La puerta de etapa dura lo que dura su examen (unos 100, 130 y 209 minutos en A2 Key, B1 Preliminary y B2 First, según los contratos) y no cabe en una sesión: cómo se reparte lo decide P0.3."

# Detalle por semana de los tres escalones de A2. Es una propuesta de P1.3 que calibra el piloto de A2.1 (P1.5); no sale de ningún manual.
# Cada tema de gramatica_nueva de un escalón aparece en una sola semana; retoma lista lo que esa semana vuelve a usar y que ya apareció.
# El campo de vocabulario de las semanas 1 a 7 es uno de los de la lista vocabulario del escalón. La producción respeta las longitudes
# de A2 (escritura de 50 a 80 palabras; habla de 45 a 60 segundos); los mínimos de Writing 6 y 7 son los del examen, no los del curso.
temario_por_semana:
  A2.1:
    - semana: 1
      titulo: "Ahora mismo"
      gramatica_nueva: [gram.presente_continuo]
      retoma: [gram.verbo_to_be, gram.presente_simple_afirmativa, gram.presente_simple_negativa_y_pregunta, gram.adverbios_de_frecuencia]
      vocabulario: "Actividades de casa y trabajo en este momento"
      funcion: "Decir qué estoy haciendo y qué hacen otras personas, y preguntarlo. Semana puente: repasa lo de A1 con vocabulario nuevo."
      pronunciacion: "Terminación -ing sin g final y contracciones I'm, you're y she's"
      produccion: "Escritura de 50 palabras: un mensaje a un amigo contando qué haces y con quién estás. Habla de 45 segundos: lo que se ve o se hace en mi casa ahora."
    - semana: 2
      titulo: "Siempre o ahora"
      gramatica_nueva: [gram.verbos_de_estado]
      retoma: [gram.presente_continuo, gram.presente_simple_afirmativa, gram.presente_simple_negativa_y_pregunta, gram.gusto_mas_ing]
      vocabulario: "Gustos, opiniones y sentimientos"
      funcion: "Distinguir lo que hago siempre de lo que pasa ahora, y decir lo que quiero, necesito, sé y pienso."
      pronunciacion: "Final -s de la tercera persona: /s/, /z/ y /ɪz/"
      produccion: "Escritura de 50 a 60 palabras comparando mi rutina con lo que pasa esta semana. Habla de 45 segundos sobre lo que me gusta y lo que quiero."
    - semana: 3
      titulo: "Ayer"
      gramatica_nueva: [gram.was_were, gram.pasado_simple_afirmativa]
      retoma: [gram.verbo_to_be, gram.preposiciones_de_tiempo, gram.plurales]
      vocabulario: "Fin de semana y vacaciones"
      funcion: "Contar lo que hice ayer o el fin de semana y dónde estuve."
      pronunciacion: "Los tres sonidos de -ed: /t/, /d/ y /ɪd/"
      produccion: "Escritura de 50 a 70 palabras sobre mi último fin de semana. Habla de 45 segundos contando qué hice."
    - semana: 4
      titulo: "¿Y qué hiciste?"
      gramatica_nueva: [gram.pasado_simple_negativa_y_pregunta]
      retoma: [gram.pasado_simple_afirmativa, gram.was_were, gram.palabras_interrogativas_basicas, gram.presente_simple_negativa_y_pregunta]
      vocabulario: "Salidas, eventos y entretenimiento"
      funcion: "Hacer y contestar preguntas sobre lo que pasó y decir lo que no hice. Más verbos irregulares."
      pronunciacion: "did you como /dɪdʒu/ y la entonación de las preguntas"
      produccion: "Escritura de 60 palabras: una entrevista corta con seis preguntas y respuestas sobre un evento. Habla de 45 segundos: una conversación con preguntas y respuestas en pasado."
    - semana: 5
      titulo: "Cosas y cantidades"
      gramatica_nueva: [gram.contables_e_incontables, gram.pronombres_posesivos_e_indefinidos]
      retoma: [gram.some_any, gram.plurales, gram.articulos_a_an_the, gram.pronombres_objeto, gram.posesivo_s]
      vocabulario: "Comida, compras y cantidades"
      funcion: "Preguntar cuánto y cuántos, comprar, hablar de lo que hay o falta y decir de quién es algo."
      pronunciacion: "Formas débiles de a, of y some (/səm/)"
      produccion: "Escritura de 50 a 60 palabras: una lista de compras con cantidades y un mensaje para quien las compra. Habla de 45 segundos: comprar en una tienda."
    - semana: 6
      titulo: "Comparar"
      gramatica_nueva: [gram.comparativos_y_superlativos]
      retoma: [gram.adjetivos_calificativos, gram.verbo_to_be, gram.was_were, gram.there_is_are]
      vocabulario: "Ciudad, lugares y transporte"
      funcion: "Comparar lugares, transportes y personas y decir cuál es el mejor o el más…"
      pronunciacion: "Terminaciones -er y -est, y la /ə/ débil de than"
      produccion: "Escritura de 60 a 80 palabras comparando dos ciudades o dos transportes. Habla de 45 a 60 segundos comparando dos opciones."
    - semana: 7
      titulo: "Planes"
      gramatica_nueva: [gram.going_to, gram.conectores_basicos]
      retoma: [gram.presente_continuo, gram.preposiciones_de_tiempo, gram.can_habilidad, gram.pasado_simple_afirmativa]
      vocabulario: "Planes, citas y tiempo libre"
      funcion: "Decir mis planes e intenciones y dar razones con because y so."
      pronunciacion: "going to y su forma rápida /ˈgənə/, para reconocerla y no para producirla"
      produccion: "Escritura de 60 a 80 palabras sobre mis planes del próximo mes, con razones. Habla de 45 a 60 segundos."
    - semana: 8
      titulo: "Repaso y puerta de escalón"
      gramatica_nueva: []
      retoma: [gram.presente_continuo, gram.verbos_de_estado, gram.pasado_simple_afirmativa, gram.pasado_simple_negativa_y_pregunta,
        gram.contables_e_incontables, gram.comparativos_y_superlativos, gram.going_to, gram.conectores_basicos]
      vocabulario: "Repaso de los siete campos del escalón"
      funcion: "Contar en orden lo que hice, lo que hago y lo que voy a hacer."
      pronunciacion: "Repaso de los sonidos de las semanas 1 a 7"
      produccion: "La tarea de la puerta: escritura de 50 a 80 palabras y habla de 45 a 60 segundos (gravity-escalon). Primera oportunidad al final de la semana."
  A2.2:
    - semana: 1
      titulo: "Mañana y más adelante"
      gramatica_nueva: [gram.will_futuro]
      retoma: [gram.going_to, gram.presente_continuo, gram.verbos_de_estado]
      vocabulario: "Clima y naturaleza"
      funcion: "Predecir, decidir en el momento, prometer y ofrecer ayuda, y decir qué puede pasar (may)."
      pronunciacion: "Contracciones 'll y won't"
      produccion: "Escritura de 50 a 70 palabras con predicciones para el próximo año. Habla de 45 segundos: ofrecer ayuda y prometer algo."
    - semana: 2
      titulo: "Debo y no debo"
      gramatica_nueva: [gram.have_to_must_mustnt]
      retoma: [gram.imperativos, gram.can_habilidad, gram.will_futuro]
      vocabulario: "Trabajo, reglas y servicios"
      funcion: "Decir lo que es obligatorio, lo que está prohibido y lo que hace falta."
      pronunciacion: "have to como /ˈhæftə/ y el acento en mustn't"
      produccion: "Escritura de 50 a 60 palabras con las reglas de un lugar. Habla de 45 segundos explicando las reglas de mi trabajo o de mi casa."
    - semana: 3
      titulo: "Mi consejo"
      gramatica_nueva: [gram.should_consejo]
      retoma: [gram.have_to_must_mustnt, gram.will_futuro, gram.imperativos, gram.can_habilidad]
      vocabulario: "Salud, medicina y ejercicio"
      funcion: "Pedir y dar consejos sobre salud, estudio y trabajo."
      pronunciacion: "Acento de oración en los consejos: should y shouldn't"
      produccion: "Escritura de 60 a 80 palabras: la respuesta a un amigo que pide un consejo. Habla de 45 segundos dando tres consejos."
    - semana: 4
      titulo: "¿Alguna vez?"
      gramatica_nueva: [gram.presente_perfecto_experiencias]
      retoma: [gram.pasado_simple_afirmativa, gram.pasado_simple_negativa_y_pregunta, gram.was_were, gram.gusto_mas_ing]
      vocabulario: "Viajes y experiencias"
      funcion: "Contar experiencias de vida sin decir cuándo pasaron y preguntar por las de otras personas."
      pronunciacion: "have y has débiles y enlaces (I've been)"
      produccion: "Escritura de 60 a 80 palabras: tres cosas que he hecho y una que nunca he hecho. Habla de 45 segundos preguntando Have you ever…?"
    - semana: 5
      titulo: "Noticias recientes"
      gramatica_nueva: [gram.presente_perfecto_just_already_yet]
      retoma: [gram.presente_perfecto_experiencias, gram.pasado_simple_afirmativa, gram.contables_e_incontables]
      vocabulario: "Casa, recados y tareas pendientes"
      funcion: "Dar noticias recientes y decir lo que ya hice y lo que todavía no."
      pronunciacion: "Acento en just, already y yet dentro de la frase"
      produccion: "Escritura de 50 a 70 palabras: una lista de pendientes y un mensaje sobre lo que ya hice. Habla de 45 segundos: ya hice y todavía no."
    - semana: 6
      titulo: "Pedir, ofrecer y sugerir"
      gramatica_nueva: [gram.could_peticiones_y_habilidad_pasada, gram.would_like_y_sugerencias]
      retoma: [gram.can_habilidad, gram.will_futuro, gram.should_consejo, gram.conectores_basicos]
      vocabulario: "Restaurantes, tiendas y servicios"
      funcion: "Pedir con cortesía, aceptar y rechazar, invitar y sugerir."
      pronunciacion: "Entonación de las peticiones y de las sugerencias"
      produccion: "Escritura de 50 a 70 palabras: una invitación y su respuesta. Habla de 45 a 60 segundos: un diálogo en un restaurante o una tienda."
    - semana: 7
      titulo: "Quiero hacerlo bien"
      gramatica_nueva: [gram.verbo_mas_infinitivo, gram.adverbios_de_modo_y_grado]
      retoma: [gram.gusto_mas_ing, gram.adverbios_de_frecuencia, gram.can_habilidad, gram.going_to]
      vocabulario: "Sentimientos y relaciones con otras personas"
      funcion: "Decir qué quiero, espero o decido hacer y cómo hago las cosas."
      pronunciacion: "to débil en want to, hope to y decide to; acento en los adverbios de modo"
      produccion: "Escritura de 60 a 80 palabras sobre cómo soy con mis amigos y qué espero de ellos. Habla de 45 a 60 segundos."
    - semana: 8
      titulo: "Repaso y puerta de escalón"
      gramatica_nueva: []
      retoma: [gram.will_futuro, gram.have_to_must_mustnt, gram.should_consejo, gram.presente_perfecto_experiencias,
        gram.presente_perfecto_just_already_yet, gram.would_like_y_sugerencias, gram.verbo_mas_infinitivo]
      vocabulario: "Repaso de los siete campos del escalón"
      funcion: "Hablar de experiencias, obligaciones y consejos en una misma conversación."
      pronunciacion: "Repaso de los sonidos de las semanas 1 a 7"
      produccion: "La tarea de la puerta: escritura de 50 a 80 palabras y habla de 45 a 60 segundos (gravity-escalon). Primera oportunidad al final de la semana."
  A2.3:
    - semana: 1
      titulo: "Mientras tanto"
      gramatica_nueva: [gram.pasado_continuo]
      retoma: [gram.pasado_simple_afirmativa, gram.pasado_simple_negativa_y_pregunta, gram.presente_continuo, gram.was_were]
      vocabulario: "Historias y noticias"
      funcion: "Contar lo que pasaba y lo que ocurrió mientras tanto."
      pronunciacion: "was y were débiles (/wəz/ y /wər/) y la terminación -ing"
      produccion: "Escritura de 50 a 70 palabras: una historia a partir de tres imágenes, con el formato de Writing 7 de A2 Key (en el examen bastan 35 palabras). Habla de 45 segundos: contar la historia."
    - semana: 2
      titulo: "Si pasa esto"
      gramatica_nueva: [gram.condicional_primera]
      retoma: [gram.will_futuro, gram.presente_simple_afirmativa, gram.going_to, gram.conectores_basicos]
      vocabulario: "Condiciones y consecuencias de la vida diaria"
      funcion: "Plantear condiciones, advertencias y promesas."
      pronunciacion: "Ritmo y pausa después de la cláusula con if"
      produccion: "Escritura de 50 a 80 palabras con condiciones y consecuencias. Habla de 45 segundos: mis planes según el clima o el tiempo libre."
    - semana: 3
      titulo: "La persona que…"
      gramatica_nueva: [gram.relativas_who_which_that, gram.sintagma_nominal_basico]
      retoma: [gram.adjetivos_calificativos, gram.comparativos_y_superlativos, gram.posesivo_s]
      vocabulario: "Personas, objetos y lugares: cómo son y para qué sirven"
      funcion: "Describir personas, cosas y lugares con más detalle."
      pronunciacion: "Acento en who y which, y en los participios -ed y -ing (bored, boring)"
      produccion: "Escritura de 50 a 80 palabras: un mensaje con tres puntos obligatorios, con el formato de Writing 6 de A2 Key (en el examen bastan 25 palabras). Habla de 45 segundos describiendo a una persona."
    - semana: 4
      titulo: "¿Cuánto tiempo?"
      gramatica_nueva: [gram.presente_perfecto_for_since]
      retoma: [gram.presente_perfecto_experiencias, gram.presente_perfecto_just_already_yet, gram.pasado_simple_afirmativa]
      vocabulario: "Etapas de la vida, estudios y trabajo"
      funcion: "Decir desde cuándo y por cuánto tiempo hago o tengo algo."
      pronunciacion: "for débil (/fər/) y since claro"
      produccion: "Escritura de 50 a 80 palabras: cuánto tiempo llevo en mi casa, mi trabajo o mis estudios. Habla de 45 segundos con preguntas How long…?"
    - semana: 5
      titulo: "Se hace así"
      gramatica_nueva: [gram.pasiva_presente_y_pasado]
      retoma: [gram.pasado_simple_afirmativa, gram.was_were, gram.verbo_to_be]
      vocabulario: "Productos, lugares conocidos y procesos"
      funcion: "Decir cómo se hace o se hizo algo, dónde se fabrica o quién lo inventó, sin nombrar a quien lo hace."
      pronunciacion: "Acento en el participio (made, built, spoken)"
      produccion: "Escritura de 60 a 80 palabras describiendo un producto o un lugar famoso. Habla de 45 segundos presentando un lugar."
    - semana: 6
      titulo: "Creo que… y quedamos a las ocho"
      gramatica_nueva: [gram.oraciones_con_that, gram.futuro_con_presente_continuo_y_simple]
      retoma: [gram.going_to, gram.will_futuro, gram.presente_continuo, gram.verbos_de_estado]
      vocabulario: "Horarios, citas y transporte público"
      funcion: "Decir lo que pienso, espero y sé; hablar de citas y de horarios."
      pronunciacion: "that débil (/ðət/) y el enlace en I think that"
      produccion: "Escritura de 50 a 80 palabras: un correo para quedar con un amigo, con tres puntos obligatorios (formato de Writing 6). Habla de 45 a 60 segundos: proponer un plan y acordar la hora."
    - semana: 7
      titulo: "Demasiado, suficiente y todo junto"
      gramatica_nueva: [gram.gerundio_y_preposiciones, gram.too_y_enough]
      retoma: [gram.gusto_mas_ing, gram.verbo_mas_infinitivo, gram.adverbios_de_modo_y_grado, gram.preposiciones_de_lugar]
      vocabulario: "Idiomas, estudios y comunicación"
      funcion: "Hablar de lo que se me da bien y de lo que es demasiado o suficiente, y practicar las partes del examen."
      pronunciacion: "Acento en good at, interested in y too más adjetivo"
      produccion: "Práctica por partes de A2 Key (lectura, escucha, escritura 6 y 7, habla 1 y 2) repartida en dos sesiones, con escritura de 50 a 80 palabras y habla de 45 a 60 segundos."
    - semana: 8
      titulo: "Repaso y puerta de etapa (A2 Key)"
      gramatica_nueva: []
      retoma: [gram.pasado_continuo, gram.condicional_primera, gram.relativas_who_which_that, gram.presente_perfecto_for_since,
        gram.pasiva_presente_y_pasado, gram.oraciones_con_that, gram.futuro_con_presente_continuo_y_simple, gram.gerundio_y_preposiciones,
        gram.too_y_enough]
      vocabulario: "Repaso de los siete campos del escalón"
      funcion: "Repasar las cuatro habilidades con el formato de A2 Key."
      pronunciacion: "Repaso de los sonidos de las semanas 1 a 7"
      produccion: "La puerta de etapa: forma completa tipo A2 Key (lectura, escritura, escucha y habla), de unos 100 minutos, repartida en varias sesiones; primera oportunidad al final de la semana. Lo define P0.3."

# Los manuales que se consultaron para respaldar la etapa de cada tema. Solo se leyeron; no se copia su texto. Las páginas son las del PDF
# (como en los contratos), no las impresas.
manuales:
  cambridge-a2-key:
    contrato: cambridge-a2-key
    titulo: "A2 Key — Handbook for teachers, for exams from 2020"
    seccion: "Language specifications: funciones, inventario de áreas gramaticales, temas y léxico"
    pagina_manual: {desde: 51, hasta: 53}
    paginas_impresas: "49 a 51"
    consultado: 2026-11-16
    nota: "El manual dice que quien se examina verá formas fuera de la lista, en las que no se le evalúa directamente."
  cambridge-b1-preliminary:
    contrato: cambridge-b1-preliminary
    titulo: "B1 Preliminary — Handbook for teachers (para exámenes desde 2020)"
    seccion: "Language specifications: funciones, inventario de áreas gramaticales, temas y léxico"
    pagina_manual: {desde: 72, hasta: 74}
    paginas_impresas: "70 a 72"
    consultado: 2026-11-16
    nota: "Su inventario incluye todo el de A2 Key; en cobertura_de_manuales solo se anota lo que agrega."
  cambridge-b2-first:
    contrato: cambridge-b2-first
    titulo: "B2 First — Handbook for teachers (para exámenes desde 2015)"
    seccion: "No trae inventario de estructuras. Se usaron la descripción de las partes 1 a 4 de Reading and Use of English (PDF p. 12 a 15), Reading parte 5 (p. 16) y los glosarios de las escalas (p. 37 y 84)."
    consultado: 2026-11-16
    nota: "Los glosarios de las escalas (PDF p. 37 y 84) advierten que, donde hay especificación de lenguaje en los niveles inferiores (A2 Key y B1 Preliminary), quien se examina puede controlar solo las formas más simples de lo listado. Por eso la profundidad con que se enseña cada tema en A2 y B1 es criterio de diseño, y todo B2 queda con pendiente: true."
  declaracion: "El respaldo es solo de etapa: dice que un tema debe estar visto a más tardar al cerrar A2.3 (A2 Key) o B1.4 (B1 Preliminary). No respalda en qué escalón de la etapa se ve ni con qué profundidad."

# Cobertura de los inventarios. Cada elemento del inventario (resumido con palabras propias) apunta a los temas que lo cubren, y todos esos
