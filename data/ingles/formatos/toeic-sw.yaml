# Contrato de formato (gravity-ingles-v1, tipo formato). Generado en el paquete P1.1a.
# - pagina_manual y medido.pagina son la numeración del PDF (no la impresa en la página).
# - palabras_estimulo.origen: declarado (cifra del manual) o medido (medida en la prueba de muestra, +-15 %, redondeada a decenas;
#   si la cifra medida es menor de 20 se redondea a unidades). Las medidas cuentan cada secuencia de letras, dígitos, apóstrofos o guiones
#   e incluyen la numeración de los huecos.
# - pendiente: true marca un dato que el manual no da o que no se pudo medir; nada se completó de memoria.
# - Ninguna pregunta ni texto del manual se copia aquí: solo números, nombres de parte y páginas.
