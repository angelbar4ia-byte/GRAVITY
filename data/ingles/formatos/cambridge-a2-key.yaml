tipo: formato
id: cambridge-a2-key
estado: borrador
nombre: Cambridge A2 Key
fuente: {titulo: 'A2 Key — Handbook for teachers, for exams from 2020', url: 'https://www.cambridgeenglish.org/Images/504505-a2-key-handbook-2020.pdf',
  consultado: 2026-11-15}
