    deben_cumplirse_las_dos: true
    sacar_3_en_todo_aprueba: false
    nota_de_calculo: "Con pesos enteros que suman 100, la suma ponderada es la suma de peso × puntaje (máximo 400) y se compara con 320 en enteros, sin decimales."
    origen: "D29 (D-ING-6: promedio ponderado de 80 % de la rúbrica y gramática del tema en 3 o más de 4); plan 0.4, sección 4 (D-ING-6: «sacar 3 en todo no aprueba»)"
rubrica:
  origen: "rúbrica 0.1, secciones 2 y 3; D29 (D-ING-6)"
  escala: {min: 0, max: 4}
  puntajes:
    - {puntaje: 4, significado: "dominado: sin errores que cambien el sentido; el error ocasional no se repite"}
    - {puntaje: 3, significado: "sólido: errores menores que no afectan la comprensión"}
    - {puntaje: 2, significado: "en progreso: errores frecuentes en el tema, pero se entiende la idea"}
    - {puntaje: 1, significado: "inicial: la idea se entiende solo con esfuerzo; faltan estructuras básicas"}
    - {puntaje: 0, significado: "no logrado: no responde o no se entiende"}
  escritura:
    origen: "rúbrica 0.1, sección 3.2"
    criterios:
      - {id: gramatica_del_tema, nombre: "Gramática del tema", peso: 40}
      - {id: vocabulario, nombre: "Vocabulario", peso: 20}
      - {id: coherencia, nombre: "Coherencia", peso: 20}
      - {id: puntuacion_y_mayusculas, nombre: "Puntuación y mayúsculas", peso: 10}
      - {id: extension, nombre: "Extensión", peso: 10}
    extension_por_etapa:
      pendiente: true
      nota: "La rúbrica 0.1 fija la extensión en 60 a 80 palabras (pruebas de módulo, anteriores a las etapas) y dice que menos de 50 palabras se califica como 1 en coherencia. Con D29 la extensión es la de la etapa (tabla de longitudes de la sección 7 del formato) y falta decir cómo se traslada la regla del 1 en coherencia. Lo ajusta P1.3 (plan 0.4, sección 7, fila rubrica-evaluacion.md)."
  habla:
    origen: "rúbrica 0.1, sección 3.3"
    criterios:
      - {id: gramatica_del_tema, nombre: "Gramática del tema", peso: 35}
      - {id: pronunciacion_del_tema, nombre: "Pronunciación del módulo", peso: 25}
      - {id: fluidez, nombre: "Fluidez", peso: 25}
      - {id: vocabulario, nombre: "Vocabulario", peso: 15}
  ejemplos_de_calculo:
    origen: "cálculo con los pesos de la rúbrica 0.1 (secciones 3.2 y 3.3) y la regla de D29 (D-ING-6); el caso de 3 en todo, de plan 0.4, sección 4 (D-ING-6)"
    casos:
      - {tarea: escritura, puntajes: {gramatica_del_tema: 3, vocabulario: 3, coherencia: 3, puntuacion_y_mayusculas: 3, extension: 3}, suma_ponderada: 300, aprueba: false, motivo: "3 en todo no aprueba: 300 es menos de 320"}
      - {tarea: escritura, puntajes: {gramatica_del_tema: 3, vocabulario: 4, coherencia: 4, puntuacion_y_mayusculas: 4, extension: 4}, suma_ponderada: 360, aprueba: true}
      - {tarea: escritura, puntajes: {gramatica_del_tema: 2, vocabulario: 4, coherencia: 4, puntuacion_y_mayusculas: 4, extension: 4}, suma_ponderada: 320, aprueba: false, motivo: "el promedio llega a 320, pero gramática del tema está por debajo de 3"}
      - {tarea: habla, puntajes: {gramatica_del_tema: 3, pronunciacion_del_tema: 4, fluidez: 4, vocabulario: 4}, suma_ponderada: 365, aprueba: true}
      - {tarea: habla, puntajes: {gramatica_del_tema: 2, pronunciacion_del_tema: 4, fluidez: 4, vocabulario: 4}, suma_ponderada: 330, aprueba: false, motivo: "el promedio pasa de 320, pero gramática del tema está por debajo de 3"}
  quien_califica_escritura_y_habla:
    resuelto: true
    resolucion: "Una IA, opcional por función (D-ING-9, 16/nov/2026). El curso no arranca hasta que la fase 6 (pareja y corrección con IA) esté completamente integrada (D-ING-9 y D-ING-10), así que no hay etiqueta provisional."
    pendiente_para_P6_0: "Qué pasa con la puerta si la persona no activa la corrección con IA, que es opcional por función; cómo se hace el habla de las partes en pareja de los exámenes (A2 Key parte 2, B1 partes 3 y 4, B2 parte 3) sin otra persona; qué se hace con la pronunciación, que no se juzga bien desde un texto."
    origen: "D29 (D-ING-9 y D-ING-10); plan 0.6, secciones 3.8 y 4.1"
