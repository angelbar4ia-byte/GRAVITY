# Contrato propio de GRAVITY (gravity-ingles-v1, tipo formato). Generado en el paquete P1.1b.
# - Su fuente no es un manual sino los documentos del proyecto. Cada dato lleva un campo origen con el documento y la sección de donde
#   sale, o con la decisión del dueño (D29: D-ING-1, D-ING-2, D-ING-5 y D-ING-6). Siglas: «formato 0.4» =
#   docs/specs/fase-8-ingles-formato.md; «plan 0.4» = docs/specs/fase-8-ingles-plan.md; «D29» = docs/DECISIONES.md; «rúbrica 0.1» =
#   docs/contenido/ingles/rubrica-evaluacion.md; «niveles-y-avance 0.3» = docs/contenido/ingles/niveles-y-avance.md. Un origen puesto
#   en un bloque cubre los datos de ese bloque que no traen el suyo.
# - pendiente: true marca un dato que esos documentos no dan. Nada se completó por cuenta propia: la nota dice qué falta y, cuando hay
#   una lectura razonable, la da como propuesta, nunca como dato. Una parte pendiente da aviso en V15 y no puede ser de fidelidad completa.
# - Este contrato describe la puerta interna (escalón y puerta de A1) en secciones[] y las reglas de las puertas en los bloques de abajo.
#   La puerta de A2, B1 y B2 usa el contrato del examen (campo etapas[].puerta.formato); aquí solo se dice cuál y cómo se aprueba.
# - Las formas de este contrato son de uso escalon o etapa (formato 0.4, sección 5); sus unidades son exclusivas (V20).
