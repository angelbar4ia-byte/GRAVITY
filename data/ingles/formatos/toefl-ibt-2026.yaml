    reproducciones: 1
    palabras_estimulo: {max: 250, origen: declarado, pagina: 12, nota: El manual da el máximo general del audio (250 palabras; los intermedios
        suelen tener de 35 a 100) pero no lo reparte por tarea (p. 12).}
    puntos_por_pregunta: 1
    pagina_manual: 5
    pendiente: true
    nota: Unidades, preguntas por unidad y opciones pendientes.
