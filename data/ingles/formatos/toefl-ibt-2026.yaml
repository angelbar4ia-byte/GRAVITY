# Contrato de formato (gravity-ingles-v1, tipo formato). Generado en el paquete P1.1a.
# - pagina_manual y medido.pagina son la numeración del PDF (no la impresa en la página).
# - palabras_estimulo.origen: declarado (cifra del manual) o medido (medida en la prueba de muestra, +-15 %, redondeada a decenas;
#   si la cifra medida es menor de 20 se redondea a unidades). Las medidas cuentan cada secuencia de letras, dígitos, apóstrofos o guiones
#   e incluyen la numeración de los huecos.
# - pendiente: true marca un dato que el manual no da o que no se pudo medir; nada se completó de memoria.
# - Ninguna pregunta ni texto del manual se copia aquí: solo números, nombres de parte y páginas.
esquema: gravity-ingles-v1
tipo: formato
id: toefl-ibt-2026
estado: borrador
nombre: TOEFL iBT (formato 2026)
fuente: {titulo: 'TOEFL iBT Test: 2026 Update — Test Blueprint and Specifications', url: 'https://www.ets.org/content/dam/ets-org/pdfs/toefl/toefl-ibt-test-specifications-2026.pdf',
  consultado: 2026-11-15}
variante: en-US
idioma_instrucciones: en
totales: {items: 120, puntos_crudos: 145, minutos_min: 83, minutos_max: 89, pagina: 2, nota: 'Tiempo total estimado de 1 h 23 min a 1 h 29 min
    (p. 2). Las especificaciones están sujetas a revisiones menores hasta el lanzamiento oficial (p. 3). Corrección a docs/contenido/ingles/formatos-oficiales.md:
    en Reading el módulo inferior y el superior comparten 9 minutos; el ''21 min'' es el límite superior del módulo de ruta (18 a 21).'}
secciones:
- id: reading
  minutos: 27
  minutos_router: {min: 18, max: 21}
  minutos_modulo: 9
  adaptativo: dos etapas (módulo de ruta y módulo inferior o superior)
  preguntas_total: 50
  puntos_crudos: 35
  pagina: 2
  minutos_nota: 'Mínimo estimado: ruta 18 + módulo 9 = 27. El manual da un solo valor (9) para el módulo inferior y el superior (p. 2).'
  restricciones: ['complete-the-words: 30 ítems', 'read-in-daily-life + read-an-academic-passage: 20 ítems en total (p. 2)', 50 ítems incluyen
      ítems sin puntuar; 35 puntos crudos]
  partes:
  - id: reading-complete-the-words
    tarea: 'Completar palabras: palabras con letras ocultas dentro de un texto (30 ítems, solo con pistas de forma y sintaxis)'
    tipo_pregunta: completar_palabras
    tipo_estimulo: texto
    unidades: null
    preguntas_por_unidad: null
    preguntas_total: 30
    palabras_estimulo: {min: 15, max: 200, origen: declarado, pagina: 9, nota: '"Los textos más fáciles tienen de 15 a 50 palabras; los más complejos
        pueden llegar a 200." Cifra general de Reading, no por tarea.'}
    puntos_por_pregunta: 1
    pagina_manual: 4
    pendiente: true
    nota: 'El manual da 30 ítems pero no dice cuántos textos ni cuántos huecos por texto: unidades y preguntas_por_unidad quedan pendientes. El
      rango 15 a 200 es el general de Reading.'
    ocultar: {regla: segunda_mitad, pendiente: true, nota: 'Añadido al integrar (15/nov/2026). Ni la especificación ni la página de Reading de ETS dicen
        cuánto de cada palabra se oculta: solo "partially missing words". Se adopta la mitad final (la mayor si el número de letras es impar),
        que es la convención de este tipo de prueba, hasta ver una muestra oficial.'}
  - id: reading-read-in-daily-life
    tarea: 'Leer en la vida diaria: textos cortos no académicos (señal, menú, correo, publicación) en conjuntos de 2 y de 3 preguntas'
    tipo_pregunta: opcion_multiple
    tipo_estimulo: texto
    unidades: null
    preguntas_por_unidad: {min: 2, max: 3}
    preguntas_total: {min: 5, max: 15}
    palabras_estimulo: {min: 15, max: 200, origen: declarado, pagina: 9, nota: '"Los textos más fáciles tienen de 15 a 50 palabras; los más complejos
        pueden llegar a 200." Cifra general de Reading, no por tarea.'}
    puntos_por_pregunta: 1
    pagina_manual: 4
    pendiente: true
    nota: Entre las dos tareas de lectura suman 20 ítems (p. 2 y 4). El manual no dice cuántas opciones tiene cada pregunta ni cuántos conjuntos
      hay.
  - id: reading-read-an-academic-passage
    tarea: 'Leer un pasaje académico: ideas principales, detalles, inferencias y estructura retórica'
    tipo_pregunta: opcion_multiple
    tipo_estimulo: texto
    unidades: null
    preguntas_por_unidad: null
    preguntas_total: {min: 5, max: 15}
    palabras_estimulo: {min: 15, max: 200, origen: declarado, pagina: 9, nota: '"Los textos más fáciles tienen de 15 a 50 palabras; los más complejos
        pueden llegar a 200." Cifra general de Reading, no por tarea.'}
    puntos_por_pregunta: 1
    pagina_manual: 4
    pendiente: true
    nota: Entre las dos tareas de lectura suman 20 ítems (p. 2 y 4). El manual no da el número de preguntas por pasaje ni las opciones.
- id: listening
