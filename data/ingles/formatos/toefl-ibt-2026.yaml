    preguntas_total: {min: 6, max: 10}
    reproducciones: 1
    palabras_estimulo: {max: 250, origen: declarado, pagina: 12, nota: El manual da el máximo general del audio (250 palabras; los intermedios
        suelen tener de 35 a 100) pero no lo reparte por tarea (p. 12).}
    puntos_por_pregunta: 1
    pagina_manual: 5
    pendiente: true
    nota: Unidades, preguntas por unidad y opciones pendientes.
  - id: listening-listen-to-an-academic-talk
    tarea: 'Escuchar una charla académica: ideas principales y de apoyo, inferencias'
    tipo_pregunta: opcion_multiple
    tipo_estimulo: audio
    unidades: null
    preguntas_por_unidad: null
