  preguntas_total: 47
  puntos_crudos: 35
  pagina: 2
  minutos_nota: 'Mínimo estimado: ruta 18 + módulo inferior 7 = 25; con el superior, 29 (p. 2).'
  restricciones: ['diálogos (choose-a-response + conversation): 25 a 29 ítems', 'monólogos (announcement + academic-talk): 18 a 22 ítems', las
      grabaciones se oyen una sola vez (p. 12)]
  partes:
  - id: listening-listen-and-choose-a-response
    tarea: 'Escuchar y elegir una respuesta: un solo intercambio entre dos personas'
    tipo_pregunta: opcion_multiple
    tipo_estimulo: audio
    unidades: null
    preguntas_por_unidad: 1
    preguntas_total: {min: 15, max: 19}
    reproducciones: 1
    puntos_por_pregunta: 1
    pagina_manual: 5
    pendiente: true
    nota: 'Enunciados breves: no más de seis sílabas acentuadas (p. 12); el manual no da cifra de palabras. Opciones pendientes.'
  - id: listening-listen-to-a-conversation
    tarea: Escuchar una conversación corta entre dos personas
    tipo_pregunta: opcion_multiple
    tipo_estimulo: audio
    unidades: null
    preguntas_por_unidad: null
