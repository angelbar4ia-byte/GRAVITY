# Contrato propio de GRAVITY (gravity-ingles-v1, tipo formato). Generado en el paquete P1.1b.
# - Su fuente no es un manual sino los documentos del proyecto. Cada dato lleva un campo origen con el documento y la sección de donde
#   sale, o con la decisión del dueño (D29: D-ING-2). Siglas: «formato 0.4» = docs/specs/fase-8-ingles-formato.md; «plan 0.4» =
#   docs/specs/fase-8-ingles-plan.md; «D29» = docs/DECISIONES.md. Un origen puesto en un bloque cubre los datos de ese bloque que no
#   traen el suyo.
# - pendiente: true marca un dato que esos documentos no dan. Nada se completó por cuenta propia: la nota dice qué falta y, cuando hay
#   una lectura razonable, la da como propuesta, nunca como dato.
# - palabras_estimulo.por_nivel: rango por etapa (A1, A2, B1 y B2, cada una con min y max). Lo leerá P1.2c. La versión actual del
#   validador (P1.2b) no lo lee: con solo por_nivel, el informe muestra «sin rango» para esa parte y V15 no compara.
# - Los minutos de cada bloque están una sola vez: en secciones[].minutos y en partes[].minutos_parte.
# - Una unidad de este formato (los audios de traslado) declara formato: gravity-sesion-60 y parte: traslado-audio.
# - El rango de audio de cada etapa se escribe una sola vez (anclas &audio_a1 a &audio_b2) y la tabla longitudes_por_etapa lo reutiliza.
esquema: gravity-ingles-v1
tipo: formato
id: gravity-sesion-60
estado: borrador
nombre: Sesión del curso de 60 minutos
fuente:
  titulo: "Formato gravity-ingles-v1 0.4, sección 7 (sesión del curso) y sección 11 (V21 a V23); plan de ejecución 0.4, secciones 3.2 y 6 (fase 4); D29 (D-ING-2)"
  url: docs/specs/fase-8-ingles-formato.md
  consultado: 2026-11-16
documentos:
  - {ruta: docs/specs/fase-8-ingles-formato.md, version: "0.4", fecha: 2026-11-16}
  - {ruta: docs/specs/fase-8-ingles-plan.md, version: "0.4", fecha: 2026-11-16}
  - {ruta: docs/DECISIONES.md, version: D29, fecha: 2026-11-16}
  - {ruta: data/ingles/ejemplos/sesion-b1-1-s01-lun-ejemplo.yaml, version: borrador, fecha: 2026-11-15}
variante: en-US
variante_origen: "plan 0.4, anexo D.3 («americano (TOEFL y curso)») y los ejemplos patrón del curso (variante: en-US)"
idioma_instrucciones: es
idioma_instrucciones_origen: "formato 0.4, sección 7: la explicación de la lección va en español; los ejemplos, en inglés con su traducción"
totales:
