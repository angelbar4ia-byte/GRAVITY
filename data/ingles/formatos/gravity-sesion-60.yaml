  minutos_principal: 35
  minutos_traslado: 25
  sesiones_por_semana: 5
  origen: "formato 0.4, sección 7, párrafo inicial («bloque principal de 35 minutos ... y traslado de 25»); plan 0.4, sección 3.2; D29 (D-ING-2)"
secciones:
  - id: principal
    minutos: 35
    origen: "formato 0.4, sección 7, párrafo inicial («bloque principal de 35 minutos»); D29 (D-ING-2)"
    partes:
      - id: repaso
        tarea: "Repaso de las tarjetas pendientes (lo arma la app); el viernes lo ocupa la mini prueba"
        minutos_parte: 5
        origen: "formato 0.4, sección 7, párrafo inicial (repaso 5) y ejemplo de sesión (bloque repaso: «lo arma la app con las tarjetas pendientes»)"
        por_dia:
          viernes:
            sustituido_por: mini_prueba
            ver: viernes
            origen: "formato 0.4, sección 7, párrafo previo a la tabla: «la mini prueba ocupa el lugar del repaso»"
      - id: leccion
        tarea: "Lección del día: explicación en español, ejemplos y preguntas con su razón; el contenido cambia según el día"
        minutos_parte: 10
        origen: "formato 0.4, sección 7, párrafo inicial (lección 10) y tabla de mínimos, fila «Lección (10)»"
        por_dia:
          lunes:
            explicacion: true
            ejemplos: {min: 6}
            error_comun: true
            preguntas: {min: 10}
            origen: "formato 0.4, sección 7, tabla de mínimos, fila «Lección (10)», columna «Lunes: gramática y vocabulario»"
          martes:
            estimulo: {tipo: audio, nombre_en_la_tabla: "audio propio"}
            preguntas: {min: 10}
            origen: "formato 0.4, sección 7, tabla de mínimos, fila «Lección (10)», columna «Martes: escucha»"
            pendiente: true
            nota: "El formato no define dónde va el audio propio dentro del bloque lección (hoy el bloque solo trae explicacion, ejemplos, error_comun y preguntas), ni cuántas reproducciones tiene, ni si es una unidad aparte. Propuesta, no aplicada: un estímulo dentro del bloque con la forma de una unidad de audio y la longitud de la tabla por etapa."
          miercoles:
            explicacion_del_sonido: true
            elementos: {min: 14}
            origen: "formato 0.4, sección 7, tabla de mínimos, fila «Lección (10)», columna «Miércoles: pronunciación»"
            pendiente: true
            nota: "El formato no define dónde van los 12 elementos dentro del bloque lección (hoy solo el bloque de pronunciación tiene elementos)."
          jueves:
            estimulo: {tipo: texto}
            preguntas: {min: 10}
            origen: "formato 0.4, sección 7, tabla de mínimos, fila «Lección (10)», columna «Jueves: lectura y escritura»"
            pendiente: true
            nota: "El formato no define dónde va el texto dentro del bloque lección ni cómo se cuenta su tiempo de lectura en V22 (ver estimacion_de_minutos.lectura)."
          viernes:
            sustituido_por: conversacion_guiada
            ver: viernes
            origen: "formato 0.4, sección 7, párrafo previo a la tabla («El viernes cambia la lección por conversación guiada») y columna «Viernes: conversación»"
      - id: pronunciacion
        tarea: "Pronunciación: foco del día y elementos para practicar en voz alta"
        tipo_pregunta: pronunciacion
        minutos_parte: 8
        origen: "formato 0.4, sección 7, párrafo inicial (pronunciación 8) y tabla de mínimos, fila «Pronunciación (8)»"
        por_dia:
          lunes: {elementos: {min: 12}}
          martes: {elementos: {min: 12}}
          miercoles: {elementos: {min: 12}}
          jueves: {elementos: {min: 12}}
          viernes: {elementos: {min: 12}}
        conflicto_con_v22:
          resuelto: true
          resolucion: "El 16/nov/2026 el arquitecto subió el mínimo de 10 a 12 elementos (formato 0.4, sección 7, calibración): 12 elementos de 30 segundos son 6.0 minutos, el 75 % de 8."
          origen: "cálculo del agente de contratos (P1.1b) con formato 0.4, sección 7; decisión del arquitecto"
      - id: produccion
        tarea: "Tarea de producción con consigna, lista de cotejo y respuesta modelo"
        tipo_pregunta: produccion
        minutos_parte: 12
        origen: "formato 0.4, sección 7, párrafo inicial (producción 12) y tabla de mínimos, fila «Producción (12)»"
        requiere: [consigna, cotejo, modelo]
        requiere_origen: "formato 0.4, sección 4.2 (tipo produccion: «Siempre con lista de cotejo y respuesta modelo») y sección 7 (cálculo de minutos)"
        extension: {segun: longitudes_por_etapa, escritura: escritura_palabras, habla: habla_segundos}
        extension_origen: "formato 0.4, sección 7, tabla de longitudes por etapa (columnas Escritura y Habla)"
        por_dia:
          lunes: {tarea: true}
          martes: {tarea: true}
          miercoles: {tarea: true}
          jueves: {tarea: true, modalidad: escritura}
          viernes: {ver: viernes}
        modalidad_de_lunes_a_miercoles:
          pendiente: true
          nota: "La tabla dice «tarea con cotejo y modelo» sin decir si es escrita o hablada. El ejemplo patrón del lunes es escrita (80 a 100 palabras)."
  - id: traslado
    minutos: 25
    origen: "formato 0.4, sección 7, párrafo inicial («traslado de 25 (escucha 10, repetición 10, tarjetas 5)»); D29 (D-ING-2)"
    solo_con_audio:
      valor: true
      origen: "plan 0.4, sección 6, P2.4 (sin audio, el traslado aparece como disponible cuando haya audio y no cuenta minutos) y P3.2b"
    partes:
      - id: traslado-audio
        tarea: "Escucha: los dos audios de la semana (un monólogo y un diálogo), dos veces cada uno, sin preguntas"
        tipo_estimulo: audio
        unidades: 2
        preguntas_por_unidad: 0
        reproducciones: 2
        palabras_estimulo:
          por_nivel:
            A1: &audio_a1 {min: 60, max: 120}
            A2: &audio_a2 {min: 120, max: 200}
            B1: &audio_b1 {min: 200, max: 350}
            B2: &audio_b2 {min: 350, max: 500}
          origen: "formato 0.4, sección 7, tabla de longitudes por etapa, columna «Audio (palabras)»"
          se_cuenta: solo_turnos_de_habla
          se_cuenta_origen: "formato 0.4, sección 6.2, regla 2 (la voz N no cuenta)"
        voces: [F1, F2, M1, M2, N]
        voces_origen: "formato 0.4, sección 4.1"
        minutos_parte: 10
        origen: "formato 0.4, sección 7, párrafo inicial (escucha 10) y tabla de mínimos, fila «Traslado (25)»: dos audios de la semana, dos veces cada uno"
        por_semana:
          audios: 2
          monologo: 1
          dialogo: 1
          distintos_entre_si: true
          los_mismos_en_las_cinco_sesiones: true
          origen: "formato 0.4, sección 7: «dos audios de traslado distintos (un monólogo y un diálogo), que se repiten durante la semana»; plan 0.4, sección 6, fase 4 (2 audios de traslado por semana)"
        criterio_monologo_y_dialogo:
          pendiente: true
          nota: "El formato dice «un monólogo y un diálogo» pero no cómo se comprueba. Propuesta, no aplicada: monólogo = una sola voz sin contar N; diálogo = al menos dos voces sin contar N. Los ejemplos patrón la cumplen (el A usa M1; el B usa F1 y M1)."
      - id: traslado-repeticion
        tarea: "Repetición: frases para escuchar y repetir en voz alta"
        tipo_pregunta: repetir
        minutos_parte: 10
        frases: {min: 20}
        todos_los_dias: true
        origen: "formato 0.4, sección 7, párrafo inicial (repetición 10) y tabla de mínimos, fila «Traslado (25)»: 20 frases para repetir"
      - id: traslado-tarjetas
        tarea: "Tarjetas en audio"
        minutos_parte: 5
        todos_los_dias: true
        origen: "formato 0.4, sección 7, párrafo inicial (tarjetas 5) y tabla de mínimos, fila «Traslado (25)»: tarjetas en audio"
