# Contrato propio de GRAVITY (gravity-ingles-v1, tipo formato). Generado en el paquete P1.1b.
# - Su fuente no es un manual sino los documentos del proyecto. Cada dato lleva un campo origen con el documento y la sección de donde
#   sale, o con la decisión del dueño (D29: D-ING-5). Siglas: «formato 0.4» = docs/specs/fase-8-ingles-formato.md; «plan 0.4» =
#   docs/specs/fase-8-ingles-plan.md; «D29» = docs/DECISIONES.md. Un origen puesto en un bloque cubre los datos de ese bloque que no
#   traen el suyo.
# - pendiente: true marca un dato que esos documentos no dan. Nada se completó por cuenta propia: la nota dice qué falta y, cuando hay
#   una lectura razonable, la da como propuesta, nunca como dato. Una parte pendiente da aviso en V15 y no puede ser de fidelidad completa.
# - Cada etapa es una sección con tres partes (gramática y vocabulario, lectura y escucha), no una sola parte: una parte del contrato
#   admite un solo tipo de estímulo, un solo rango de palabras y un solo número de reproducciones (V15, V16 y la fidelidad). Las 12
#   preguntas de la etapa son la suma de sus tres partes (6 + 3 + 3).
# - Los rangos de palabras repiten, por etapa, la tabla de longitudes de la sección 7 del formato (el encargo P1.1b manda aplicarla a la
#   ubicación). Si cambia allí, cambia aquí y en gravity-sesion-60.
