# Ejemplo patrón · Curso · B1.1, semana 1 · Audio de traslado A (monólogo)
# Muestra: guion con la longitud de la etapa B1 (200 a 350 palabras), cargado de
# la gramática de la semana: rutina en presente simple, lo temporal y lo que
# cambia en presente continuo, y verbos de estado. Sin preguntas: se usa para
# escuchar y repetir en el traslado.
