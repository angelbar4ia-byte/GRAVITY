# Ejemplo patrón · Cambridge B2 First · Reading and Use of English, parte 6
# Muestra: texto con seis oraciones quitadas y una que sobra. Cada oración
# colocada declara su `ancla`: lo que la ata a la oración anterior Y a la
# siguiente (pronombres, conectores, cifras, cronología). Si una oración solo
# se ata por un lado, puede caber en dos huecos y la pregunta está mal.
# La sobrante usa palabras del texto, pero lo contradice: `porque_no`.
# Las oraciones se escriben en el orden de los huecos; la letra se sortea al
# exportar. Longitud: texto y oraciones juntos, dentro del rango del contrato.
