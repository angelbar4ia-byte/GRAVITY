# Ejemplo patrón · Cambridge B1 Preliminary · Reading, parte 3
# Muestra: texto dentro del rango del contrato (300 a 400 palabras; la muestra
# oficial mide unas 350), cinco preguntas de cuatro opciones en el
# orden del texto (la última, global), una sola respuesta defendible y la razón
# de cada opción. La primera opción es siempre la correcta; el sorteo lo hace
# la herramienta.
