    hueco: 7
    base: "EXPECT"
    aceptadas: ["unexpected"]
    porque: "Adjetivo ante 'connections'; una mente que divaga hace conexiones que nadie espera, de ahí el prefijo negativo."
  - id: ej-cam-b2-ue3-0001-8
    tipo: formacion_palabra
