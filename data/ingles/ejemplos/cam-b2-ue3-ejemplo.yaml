  titulo: "In praise of boredom"
  texto: |
    Most of us do everything we can to avoid being bored. We fill every
    spare moment with our phones, and the idea of sitting quietly while our
    own {1} drift by seems almost {2}. Yet a growing number of {3} believe that
    boredom is far from useless. In fact, it may be exactly what our brains
    need.

    In one study, volunteers were asked to copy numbers from a phone book,
    a task chosen for its complete lack of {4}. Afterwards, they were {5}
    good at finding new uses for everyday objects, and did much better than
    a second group who had not been bored first. The {6} seems to be that a
    bored mind starts to wander, and a wandering mind makes {7}
    connections.

    None of this means that boredom is always pleasant, or that we should
    go looking for it. But the next time you are stuck in a queue, it may
    be worth leaving your phone in your pocket. Your {8} might thank you.
preguntas:
