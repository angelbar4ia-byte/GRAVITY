    hueco: 1
    base: "THINK"
    aceptadas: ["thoughts"]
    porque: "Hace falta un sustantivo en plural: el verbo 'drift' va sin -s. 'Thinking' es singular y pediría 'drifts'; la revisión a ciegas lo propuso cuando el texto decía 'with our own …'."
