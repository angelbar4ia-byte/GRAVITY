  - "El texto es técnico (tree rings, climate of a region) y las palabras (measuring, researchers, describe) están más cerca de B2 que de B1. El real tiene unas diez palabras en un párrafo académico de ~100 palabras; aquí es acorde."
  - "Es muy corto para 'reading' en general; es una sola tarea, correcto para la parte."
