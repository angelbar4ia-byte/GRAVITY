  ej-cam-b2-ue4-0001-2: {respuesta: ["must have forgotten"], seguridad: alta, otras_validas: []}
  ej-cam-b2-ue4-0001-3: {respuesta: ["wish I had studied", "wish I'd studied"], seguridad: alta, otras_validas: []}
