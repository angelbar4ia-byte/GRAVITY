  ej-cam-b2-ue4-0001-6: {respuesta: ["looking forward to seeing"], seguridad: alta, otras_validas: []}
observaciones:
  - "Ítem 1: hay varias respuestas correctas. Con 'nearly', 'quite', 'half' o 'nowhere near' el sentido es el mismo. Se necesita una lista de variantes o una regla explícita en la clave."
  - "Ítem 5: 'repaired' y 'fixed' son sinónimos naturales (y 'my' o 'the'). Además, 'I ___ at the moment' deja ambiguo si 'm cuenta como una o dos palabras. Con 'am having my car repaired' son exactamente 5 palabras, el límite. Si se acepta 'm, se pasa de 5 por la regla de contracciones."
  - "Ítem 3: 'wish I had studied' y 'wish I'd studied' son equivalentes. 'wish I'd studied' es de 4 palabras con la regla de contracciones, dentro del límite."
  - "Ítem 4: 'is said to be' es única. 'was said to be' o 'is said to have been' cambian el tiempo."
  - "Ítem 6: 'looking forward to seeing' es única."
