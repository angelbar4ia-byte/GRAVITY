  ej-b1-1-s01-lun-09: {respuesta: ["How often do you go to the gym?"], seguridad: media, otras_validas: ["How often are you going to the gym?"]}
  ej-b1-1-s01-lun-10: {respuesta: ["don't need", "do not need"], seguridad: alta, otras_validas: []}
  ej-b1-1-s01-lun-11: {respuesta: ["is walking", "'s walking"], seguridad: alta, otras_validas: []}
observaciones:
  - "Ítem 09: 'How often are you going to the gym?' es gramatical con sentido de 'últimamente, estos días'. Contradice el foco de la lección ('how often' = hábito = presente simple), pero en una respuesta libre un alumno podría defenderla. Conviene que el corrector no la acepte y que la clave lo diga. Además, hay que decidir si mayúscula inicial y signo de interrogación son obligatorios; la instrucción no lo dice."
  - "Ítem 03: 'I'm understanding' es hoy aceptable en ciertos contextos ('I'm understanding more and more'), pero la lección lo descarta como verbo de estado y aquí no cabe. Ítem 05: 'is speaking three languages' no es natural."
  - "Ítem 08: 'stay' aquí no es verbo de estado y 'until ... ready' marca lo temporal. Ítems 08, 10 y 11: las contracciones y formas completas son todas válidas y la clave debe listarlas."
  - "El nivel corresponde a B1.1 de curso. La instrucción 'Escribe la pregunta' mezcla español con ejemplos en inglés, lo que es coherente con una lección en español."
